# Pacgate-ai adapter for deer-flow
# ~150 lines — translates deer-flow's storage interfaces to pacgate-api HTTP calls.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pacgate-deerflow-adapter"
version = "0.1.0"
description = "Thin adapter that routes deer-flow storage to pacgate-api"
requires-python = ">=3.10"
dependencies = ["httpx>=0.24"]

[tool.setuptools]
packages = ["pacgate_deerflow_adapter"]

[tool.setuptools.package-dir]
pacgate_deerflow_adapter = "."
