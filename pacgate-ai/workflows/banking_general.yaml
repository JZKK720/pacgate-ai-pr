# Banking, finance, shipping, energy, and general legal workflows
# Derived from: 非诉律师实用Prompts指南.md §九-十二
# Covers banking/finance, maritime, PPP/energy, and general legal tools.

- id: "00000000-0000-0000-0000-000000000a01"
  name: "贷款与银团协议审阅"
  description: "Review loan agreement and syndication facility — terms, covenants, events of default"
  category: "banking_finance"
  steps:
    - name: "Read loan agreement"
      description: "Read the loan agreement document"
      tool: "read_document"
      parameters: {}

    - name: "Find key clauses"
      description: "Search for critical loan clauses"
      tool: "find_in_document"
      parameters:
        queries:
          - "利率"
          - "违约事件"
          - "先决条件"
          - "陈述与保证"
          - "财务承诺"
          - "交叉违约"
          - "加速到期"

    - name: "Generate loan review"
      description: "Generate loan agreement review memo"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请从【借款人/贷款人】角度审阅以下贷款/银团协议：

          审阅条款：
          1. 贷款金额、期限、利率（固定/浮动、基准选择）
          2. 提款先决条件（CP清单）
          3. 还款方式（等额/到期一次性/分期）
          4. 财务承诺（杠杆率/覆盖率/最低净值）
          5. 陈述与保证（存续期、更新机制）
          6. 借款人承诺（积极/消极）
          7. 违约事件（实际违约/交叉违约/预期违约）
          8. 加速到期机制
          9. 担保与保证
          10. 费用与税负
          11. 法律适用与争议解决
          12. 银团管理（代理行职责、投票门槛）

          每条标注风险等级（🔴/🟡/🟢）和修改建议。
          输出结论先行。

- id: "00000000-0000-0000-0000-000000000a02"
  name: "担保架构设计与审查"
  description: "Design and review security package — pledges, mortgages, guarantees, comfort letters"
  category: "banking_finance"
  steps:
    - name: "Generate security review"
      description: "Generate security package design and review"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请为以下交易设计/审查担保架构：
          交易类型：【贷款/债券发行/并购融资/项目融资】
          债务人：【公司/项目公司】
          担保资产：【股权/不动产/应收账款/设备/知识产权】

          担保方案：
          1. 担保类型选择
          - 保证（一般/连带）
          - 抵押（不动产/动产）
          - 质押（股权/应收账款/知识产权）
          - 留置
          - 安慰函（适用场景与法律效力）

          2. 担保顺位（优先/次级/平级）
          3. 担保覆盖范围（本金/利息/费用/违约金）
          4. 担保设立程序
          - 登记要求（动产融资统一登记/不动产登记/股权质押登记）
          - 审批要求
          - 公证要求
          5. 担保执行程序
          6. 跨境担保特殊要求（内保外贷/外保内贷备案）

          每项标注适用法律条文号和登记机关。

- id: "00000000-0000-0000-0000-000000000a03"
  name: "债券发行法律工作"
  description: "Legal work for bond issuance — prospectus review, offering documents, listing compliance"
  category: "banking_finance"
  steps:
    - name: "Search bond regulations"
      description: "Search for bond issuance regulations"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate bond legal work"
      description: "Generate bond issuance legal work plan"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请就以下债券发行提供法律工作方案：
          债券类型：【公司债/企业债/中票/短融/可转债/ABS/境外美元债】
          发行人：【公司名称】
          发行规模：【金额】

          法律工作清单：
          1. 发行人尽职调查
          - 公司治理与合规
          - 财务状况
          - 重大诉讼与或有负债
          - 资产权属

          2. 募集说明书审阅
          - 风险因素披露完整性
          - 财务数据准确性
          - 法律事项准确性

          3. 法律意见书起草
          - 发行人主体资格
          - 发行授权与批准
          - 募集说明书合规性
          - 债券受托管理协议
          - 担保安排（如有）

          4. 交易文件审阅
          - 承销协议
          - 受托管理协议
          - 担保协议（如有）
          - 偿付代理人协议

          5. 上市/挂牌合规
          6. 信息披露义务

          每项标注所需文件清单、法律依据（条文号）、时间安排。

- id: "00000000-0000-0000-0000-000000000a04"
  name: "PPP/特许经营项目法律支持"
  description: "PPP and concession project legal support — structuring, risk allocation, government agreement"
  category: "ppp_energy"
  steps:
    - name: "Search PPP regulations"
      description: "Search for PPP and concession regulations"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate PPP legal memo"
      description: "Generate PPP project legal support memorandum"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请为以下PPP/特许经营项目提供法律支持：
          项目类型：【BOT/TOT/ROT/BOO/DBFOT】
          项目领域：【收费公路/污水处理/垃圾处理/综合管廊/新能源/医疗/教育】
          项目规模：【投资额/特许经营期限】

          法律工作内容：
          一、项目合规性审查
          - 项目审批/核准/备案程序
          - 用地合规
          - 环评合规
          - 财政承受能力论证

          二、实施方案审阅
          - 风险分配框架
          - 回报机制（使用者付费/可行性缺口补助）
          - 绩效考核机制
          - 期限与退出安排

          三、核心合同条款
          1. PPP项目合同/特许经营协议
          - 当事方权利义务
          - 建设期条款（进度/质量/变更）
          - 运营期条款（标准/考核/调价）
          - 风险分配（不可抗力/法律变更/政策风险）
          - 提前终止与补偿
          - 移交安排

          2. 股东协议
          3. 融资协议
          4. 保险安排
          5. 履约保证

          四、争议解决
          五、政府监管与合规

          引用具体PPP法规条文号。

- id: "00000000-0000-0000-0000-000000000a05"
  name: "法律检索"
  description: "Legal research — search, verify, and summarize legal authority with source grading"
  category: "general_legal"
  steps:
    - name: "Search legal database"
      description: "Search knowledge base for relevant legal authority"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate research memo"
      description: "Generate legal research memorandum"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请就以下法律问题进行检索和分析：
          法律问题：【具体问题】

          输出格式：
          一、问题概述
          二、检索范围与方法
          - 检索的数据库（元典/北大法宝/裁判文书网/国家法规库）
          - 检索关键词
          - 检索时间

          三、适用法律法规
          | 法律名称 | 条文号 | 效力状态 | 主要内容 | 来源 |
          每条标注：
          - 是否现行有效
          - 是否有实施细则
          - 是否有修订历史

          四、相关案例
          | 案号 | 法院 | 裁判要旨 | 参考价值 |

          五、法律分析
          - 对问题的法律分析
          - 不同观点的对比
          - 司法实践倾向

          六、结论与建议
          - 标注来源级别（权威核验/辅助数据库/内部模板/模型推断）
          - 检索不到的明确说明"检索稀薄"
          - 严禁编造法条或案例

- id: "00000000-0000-0000-0000-000000000a06"
  name: "合同翻译"
  description: "Translate legal documents between Chinese and English with legal terminology accuracy"
  category: "general_legal"
  steps:
    - name: "Read source document"
      description: "Read the source document for translation"
      tool: "read_document"
      parameters: {}

    - name: "Generate translation"
      description: "Generate bilingual translation with legal terminology notes"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请将以下法律文件在中文与英文之间进行翻译：
          翻译方向：【中→英 / 英→中】
          文件类型：【合同/法律意见书/起诉状/判决书/公司章程】

          翻译要求：
          1. 法律术语准确使用
          - 标注关键术语的中英对照表
          - 有多种译法的标注选择理由
          - 法定术语优先于学术译法

          2. 译文格式
          - 保持原文段落结构
          - 条款编号对应
          - 标注条款引用的法律条文（中英对照）

          3. 文化与法系适配
          - 中国法特有概念（如"有限责任公司"→"Limited Liability Company"）
          - 英美法特有概念（如"indemnify and hold harmless"→"赔偿并使免受损害"）
          - 标注无法直接对应的概念

          4. 审校建议
          - 标注存疑译文
          - 标注需法律确认的条款

          输出双语对照格式。

- id: "00000000-0000-0000-0000-000000000a07"
  name: "法律备忘录起草"
  description: "Draft a legal memorandum — issue, analysis, conclusion with citations"
  category: "general_legal"
  steps:
    - name: "Search legal basis"
      description: "Search for relevant legal authority"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate legal memo"
      description: "Generate legal memorandum"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请就以下事项起草法律备忘录：
          咨询事项：【具体法律问题】

          备忘录结构：
          一、事实摘要
          二、法律问题（逐个列出）
          三、法律分析
          - 对每个法律问题：
            a. 适用法律法规（引用名称、条文号、效力状态）
            b. 相关案例（引用案号、裁判要旨）
            c. 分析推理
          四、结论与建议
          五、待确认事项
          六、免责声明

          要求：
          - 结论先行
          - 引用具体条文号
          - 标注检索来源
          - 检索不到的明确说明
          - 严禁编造

- id: "00000000-0000-0000-0000-000000000a08"
  name: "比较法研究"
  description: "Comparative law research — analyze the same legal issue across multiple jurisdictions"
  category: "general_legal"
  steps:
    - name: "Search comparative law"
      description: "Search for multi-jurisdiction legal authority"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate comparative study"
      description: "Generate comparative law research report"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请就以下法律问题进行多法域比较法研究：
          研究问题：【具体问题】
          比较法域：【中国/美国/欧盟/英国/日本/新加坡/其他】

          输出格式：
          一、研究问题定义
          二、各法域分析（逐一展开）
          每个法域：
          - 适用法律名称与条文号
          - 监管机构
          - 合规要求
          - 执法案例
          - 效力状态与来源

          三、对比矩阵
          | 维度 | 中国 | 美国 | 欧盟 | ... |
          |------|------|------|------|-----|
          | 法律框架 | | | | |
          | 监管机构 | | | | |
          | 合规门槛 | | | | |
          | 罚则 | | | | |

          四、跨境合规建议
          - 多法域同时合规的路径
          - 冲突处理原则
          - 最佳实践建议

          五、待确认事项

          每条标注来源与效力状态。检索不到的明确说明。