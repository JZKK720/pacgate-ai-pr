      parameters:
        top_k: 10

    - name: "Generate offshore filing"
      description: "Generate annual compliance calendar and filing comparison checklist"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请协助准备境外基金的年度合规报送与协会披露：

          基金信息：
          - 基金注册地：【开曼/BVI/香港】
          - 基金类型：【开曼ELP/BVI公司/香港OFC】
          - 注册/登记机构：【CIMA/BVI FSC/SFC】
          - 管理人注册地：【香港/开曼/新加坡】
          - 报告年度：【20XX年度】

          一、开曼CIMA年度合规报送
          1. 私募基金年度审计与报送：
             - CIMA对私募基金（Private Fund）的年度审计要求：
               * 审计报告提交截止日期（通常为财务年度结束后6个月内）
               * 审计师资质要求（CIMA认可审计师清单）
               * 审计报告必备内容
             - 私募基金年度报表报送：
               * 年度报表内容清单（Fund Annual Return）
               * 报送时间与方式
               * 未报送/迟报送的处罚（罚款标准）

          2. CIMA注册管理人年度合规：
             - 管理人的年度审计要求
             - 管理人的年度合规报告
             - 管理人信息更新（董事变动、股权变动等）

          3. 经济实质法年度申报：
             - ES申报截止日期（每年12月31日前）
             - 申报内容（相关活动分类、CIGA情况、支出等）
             - 豁免实体的简化申报要求

          二、香港SFC年度合规报送（如管理人在港）
          1. Type 9牌照年度合规：
             - 年度审计与报送
             - 管理人信息更新
             - 财务资源合规证明

          2. 基金年度报告（如为香港OFC/公募基金）：
             - SFC规定的基金年度报告内容
             - 报送时间与方式

          三、BVI FSC年度合规（如适用）
          1. BVI基金的年度审计要求
          2. BVI经济实质法申报
          3. BVI公司年度登记费缴纳

          四、FATCA/CRS年度申报
          1. FATCA年度申报：
             - 申报截止日期
             - 申报内容（账户数量、余额、收入等汇总）
             - 申报路径（开曼DITC→IRS/通过IGA）

          2. CRS年度申报：
             - 申报截止日期
             - 申报内容（可报告账户数量、余额、收入等）
             - 申报路径（开曼DITC→CRS自动交换）

          请输出年度合规日历（标注每个报送的截止日期和所需材料）+ 各机构的报送对照清单。

- id: "00000000-0000-0000-0000-000000000e17"
  name: "基金高频违规类型识别与处罚应对"
  description: "Identify high-frequency fund violations and draft penalty response plan"
  category: "fund_disputes"
  steps:
    - name: "Search AMAC enforcement cases"
      description: "Search for AMAC disciplinary cases and enforcement trends in recent years"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate violation response"
      description: "Generate violation red-black list and penalty response plan"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请梳理基金领域的高频违规类型，并为我们的基金/管理人起草违规自查与处罚应对方案：

          基金/管理人信息：
          - 管理人名称：【XX资本管理有限公司】
          - 在管基金：【X支，规模合计XX亿】
          - 关注的违规类型：【请根据实际情况勾选】

          请搜索AMAC近3年的纪律处分案例和监管动态，梳理以下高频违规类型：

          一、募集环节违规（最高频）
          1. 向非合格投资者募集：
             - 违规表现：未做合格投资者审查/降低门槛/拆分转让
             - AMAC处分类型：警告/公开谴责/暂停会员资格/注销管理人登记
             - 自查要点：合格投资者确认程序的完整性

          2. 公开宣传/变相公开宣传：
             - 违规表现：微信公众号推文/朋友圈推介/论坛路演未经合格投资者确认
             - 处分案例引用
             - 自查要点：募集材料的合规审查留痕

          3. 未设募集监督账户/资金挪用：
             - 违规表现：募集资金未进入监督账户/直接划入管理人账户/挪用至其他项目
             - 严重后果：可能涉嫌非法集资/诈骗
             - 自查要点：募集账户设置与资金流转合规

          4. 夸大宣传/虚假陈述：
             - 违规表现：承诺保本保收益/夸大过往业绩/隐瞒重大风险
             - 处分案例
             - 自查要点：推介材料的真实性和合规性

          二、运作环节违规
          1. 资金池运作：
             - 违规表现：不同基金之间混同运作/新基金募资偿还旧基金/期限错配
             - AMAC专项整治重点
             - 自查要点：各基金资产独立性

          2. 关联交易未披露/未审批：
             - 违规表现：管理人关联方与基金之间的交易未向LP披露/未经LPAC同意
             - 处分案例
             - 自查要点：关联交易识别与披露机制

          3. 投资超出备案范围：
             - 违规表现：备案为PE基金但实际从事二级市场投资/债权投资/房地产投资
             - 处分案例
             - 自查要点：投资范围与备案类型一致性核查

          4. 未按约定估值/虚增NAV：
             - 违规表现：估值方法不符合指引/选择性估值调整/虚增NAV以维持管理费
             - 处分案例
             - 自查要点：估值方法合规性与执行一致性

          三、管理人持续合规违规
          1. 实控人/高管变动未备案：
             - 违规表现：股东变更/实控人变更/高管离职未及时向AMAC报告
             - 处分类型：公示异常/警告
             - 自查要点：信息更新及时性

          2. 未报送定期报告/年度报告：
             - 违规表现：未按期报送季度/年度报告
             - 处分后果：公示异常→6个月未补报→注销风险
             - 自查要点：报送日历的执行检查

          3. 冲突业务：
             - 违规表现：管理人同时从事民间借贷/担保/保理/小额贷款等冲突业务
             - AMAC态度：严格禁止
             - 自查要点：业务范围审查

          四、处罚应对方案
          1. 收到AMAC反馈/整改通知的应对流程：
             - 第一步：限期阅读通知，理解违规定性
             - 第二步：组织内部自查，确认违规事实
             - 第三步：制定整改方案（含整改措施、时限、责任人）
             - 第四步：报送整改报告
             - 第五步：持续跟进公示状态恢复

          2. 收到纪律处分决定书的应对：
             - 是否可以申诉/复议
             - 申诉时限与程序
             - 处分对管理人业务的影响评估（新基金备案受限/LP信任损失）

          3. 公示异常的恢复流程：
             - 异常公示的触发条件
             - 恢复正常公示的条件和流程
             - 6个月未恢复→注销的应对

          4. 管理人注销的后果与退出方案：
             - 在管基金的处置方案（管理人更换/基金清算）
             - LP沟通与安抚策略
             - 品牌与业务重建方案

          请输出高频违规红黑榜（违规类型×处罚后果×自查要点）+处罚应对流程图+整改报告模板。

- id: "00000000-0000-0000-0000-000000000e18"
  name: "LP-GP争议处理——LP权利行使与GP抗辩"
  description: "Draft legal analysis memorandum on LP-GP disputes covering LP rights and GP defenses"
  category: "fund_disputes"
  steps:
    - name: "Search LP-GP dispute cases"
      description: "Search for LP-GP dispute cases and relevant regulations"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate dispute memo"
      description: "Generate LP-GP dispute analysis memorandum and evidence checklist"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请就基金LP与GP之间的争议起草法律分析备忘录：

          争议背景：
          - 争议类型：【请勾选：GP未按约定分配收益 / GP管理费收取争议 / GP关联交易未披露 / 关键人事件触发争议 / 基金延期LP不同意 / GP挪用基金资产 / LP要求查阅基金账册被拒绝 / LP主张无过错解散权 / 其他】
          - 基金名称：【XXX基金】
          - 争议LP：【XX母基金/XX国资LP/XX家族办公室】
          - 争议金额/影响：【XX万元 / 基金XX%的LP份额】
          - LPA关键条款：【请提供或引用LPA关于争议事项的条款编号】

          请搜索相关案例和法规，从以下维度分析：

          一、LP权利的法律基础
          1. 《合伙企业法》下有限合伙人的法定权利：
             - 知情权（查阅财务账册的范围和方式）
             - 监督权（对GP执行合伙事务的监督）
             - 解散权（特定条件下请求解散合伙企业）
             - 退出权（LPA约定条件下退伙）

          2. LPA约定的LP权利（基于LPA条款分析）：
             - LPAC的权利范围（哪些事项需LPAC同意）
             - LP的否决事项清单
             - LP的无过错解散权条件
             - LP的知情权增强条款（如Side Letter约定）

          3. AMAC规则下的LP保护：
             - 信息披露义务对LP知情权的支撑
             - 合规制度对LP监督权的支撑

          二、GP的法定与约定义务
          1. GP的核心义务清单：
             - 勤勉尽责义务
             - 诚实信用义务
             - 公平对待义务（多基金之间）
             - 忠诚义务（关联交易披露与避免利益冲突）
             - 信息披露义务

          2. GP的抗辩要点：
             - 商业判断原则的适用（投资决策属于GP的商业判断）
             - LPAC同意的抗辩效力
             - LPA免责条款的效力边界
             - 不可抗力/市场变化导致损失的抗辩

          三、争议解决路径分析
          1. 协商解决：
             - LPAC会议讨论
             - GP与争议LP的直接谈判
             - 可能的和解方案（信息权增强/管理费调整/退出安排）

          2. 仲裁/诉讼：
             - LPA约定的争议解决方式（仲裁条款分析——仲裁机构、仲裁地、仲裁规则）
             - 仲裁/诉讼的策略考量：
               * LP立场：主张GP违约/违反忠实义务/请求解散/请求赔偿
               * GP立场：商业判断抗辩/LPA免责/LP已知情同意
             - 证据组织要点（邮件往来、LPAC决议、基金报告、财务记录）
             - 保全策略（基金账户冻结/GP份额冻结的风险评估）

          3. 行政途径：
             - 向AMAC投诉的适用场景与效果
             - AMAC的纪律处分对争议的影响

          四、风险与方案评估
          请对各解决路径的风险、成本、时间线、成功率进行评估，并给出推荐方案。

          输出为争议分析备忘录 + 证据组织清单 + 谈判策略要点。

- id: "00000000-0000-0000-0000-000000000e19"
  name: "投资者索赔与群体性争议应对"
  description: "Draft response plan for investor (LP) claims and group disputes"
  category: "fund_disputes"
  steps:
    - name: "Search investor claim cases"
      description: "Search for AMAC disciplinary cases and judicial precedents on investor claims"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate claim response"
      description: "Generate investor claim response plan and settlement agreement framework"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请就基金投资者（LP）的索赔诉求起草应对方案：

          索赔背景：
          - 索赔LP：【单个LP/多个LP联合/全体LP】
          - 索赔事由：【基金亏损超预期 / GP未按约定分配 / 基金未按期退出 / GP挪用 / 信息披露不充分 / 其他】
          - 索赔诉求：【返还投资本金 / 赔偿损失 / 解散基金 / 更换GP / 查阅基金全部资料 / 其他】
          - 索赔金额：【XX万元】
          - 是否已委托律师：【是/否】
          - 是否已提起仲裁/诉讼：【是/否】

          请搜索AMAC纪律处分案例和相关司法判例，从以下维度分析应对方案：

          一、索赔诉求的法律分析
          1. 每项索赔诉求的法律依据审查：
             - 是否有《合伙企业法》/LPA/AMAC规则的支持
             - GP的抗辩空间有多大
             - 索赔金额的计算依据是否合理

          2. 基金亏损 vs. GP责任的区分：
             - 正常投资损失（市场风险）vs. GP过错导致的损失
             - 商业判断原则对GP投资决策的保护边界
             - LP签署的风险揭示书对索赔的影响

          二、群体性争议的特殊应对
          1. 多LP联合索赔的组织特征：
             - LP之间的利益是否一致（国资LP vs. 民营LP诉求可能不同）
             - 是否有牵头LP/代表LP
             - LP是否在寻求媒体/监管渠道施加压力

          2. 群体性争议的分层应对策略：
             - 对核心索赔LP：重点谈判，争取和解
             - 对跟随索赔LP：观察策略，利用核心LP谈判结果辐射
             - 对观望LP：主动沟通，防止被裹挟加入索赔

          3. 舆情与监管风险管控：
             - 索赔是否可能被媒体报道
             - LP是否已经/可能向AMAC投诉
             - 双轨应对策略（法律应对+舆情管控+监管沟通）

          三、和解方案设计
          1. 可选和解方案：
             - 信息权增强（向索赔LP提供更详细的基金运营信息）
             - 管理费调整/退还部分管理费
             - 退出安排（按NAV/NAV折扣退出/实物分配）
             - 利益分配机制调整（提高门槛收益率/降低carried interest）
             - GP治理承诺（增设LPAC席位/关联交易审批强化）
             - 赔偿方案（一次性赔偿/分期赔偿/以未来收益抵扣）

          2. 和解协议起草要点：
             - 和解范围（是否包含全部已知和未知索赔）
             - 和解条件（保密义务/不再投诉/不再诉讼）
             - 和解对其他LP的影响（是否需要LPAC知情/MFN条款触发）
             - 和解的法律效力确认

          四、诉讼/仲裁应对（如和解失败）
          1. GP的答辩策略：
             - 商业判断抗辩
             - LP已签署风险揭示书
             - LPA免责条款
             - 市场不可控因素
          2. 反索赔策略（如适用）：
             - LP违约（未按时缴款/违反保密义务）
          3. 证据准备清单

          请输出索赔应对方案 + 和解协议模板框架 + 答辩要点清单。

- id: "00000000-0000-0000-0000-000000000e1a"
  name: "基金监管调查/检查应对"
  description: "Draft response plan for fund regulatory investigation or inspection"
  category: "fund_disputes"
  steps:
    - name: "Search inspection focus"
      description: "Search for AMAC/CSRC inspection focus areas and common penalties"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate inspection response"
      description: "Generate regulatory inspection response manual and material checklist"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请就基金/管理人面临监管调查或检查起草应对方案：

          调查/检查背景：
          - 调查/检查主体：【AMAC / 证监局 / 地方金融监管局 / 其他】
          - 调查/检查原因：【日常抽查 / LP投诉触发 / 异常公示触发 / 媒体报道触发 / 其他基金违规牵连 / 专项检查】
          - 调查/检查范围：【管理人整体合规 / 特定基金运作 / 募集行为 / 关联交易 / 其他】
          - 是否已收到正式通知：【是/否，收到日期：【XX】】
          - 要求提交材料的时间：【XX日内】

          请搜索近年AMAC/证监局对私募基金检查的重点和常见处罚，编制应对方案：

          一、监管检查的重点领域预判
          1. AMAC日常检查重点（近年趋势）：
             - 合格投资者审查底稿
             - 募集行为合规（推介材料、路演记录）
             - 基金资产独立性（是否资金池）
             - 关联交易识别与披露
             - 信息披露及时性与完整性
             - 管理人内控制度执行情况
             - 冲突业务排查

          2. 证监局/地方金融监管局检查重点：
             - 是否涉嫌非法集资
             - 是否超范围经营
             - 是否有保本保收益承诺
             - 资金流向追踪

          二、材料准备与自查
          1. 监管要求提交的材料清单预判：
             - 管理人基本信息与历史变更记录
             - 在管基金清单与基本信息
             - 募集过程材料（合格投资者确认表、风险揭示书签署记录）
             - 基金合同/LPA
             - 投资决策记录（投委会决议、尽调报告）
             - 基金财务报表与审计报告
             - 信息披露记录（向LP的报告、向AMAC的报送）
             - 内控制度文本与执行记录
             - 关联交易清单与审批记录
             - 从业人员登记信息

          2. 自查要点（对照检查重点）：
             - 逐项自查，发现问题的预整改
             - 合规解释准备（对历史瑕疵的解释口径）

          三、检查配合策略
          1. 检查流程了解：
             - AMAC现场检查/非现场检查的一般流程
             - 检查人员可能提出的问题预判
             - 管理人配合义务的范围

          2. 配合策略：
             - 指定专人对接检查组
             - 材料提供的节奏控制（先提供基本材料，补充材料分批提供）
             - 口头回答的策略（如实陈述但注意口径一致性）
             - 对无法提供材料的合规解释

          3. 检查期间的注意事项：
             - 不隐瞒/不伪造材料
             - 对自查发现的问题主动说明整改方案
             - 保密义务（不向LP/外界透露检查细节，除非有披露义务）

          四、检查结果应对
          1. 收到整改通知的应对：
             - 整改方案制定与报送
             - 整改时限内的整改执行
             - 整改完成报告

          2. 收到纪律处分/行政处罚的应对：
             - 处分类型与影响评估
             - 申诉/行政复议路径（如适用）
             - 处分对业务的影响管控

          请输出监管检查应对手册 + 材料准备清单 + 自查对照表 + 检查常见问题预判与口径准备。

- id: "00000000-0000-0000-0000-000000000e1b"
  name: "基金清算争议与GP责任追究"
  description: "Draft legal memorandum on liquidation disputes and GP liability pursuit"
  category: "fund_disputes"
  steps:
    - name: "Search liquidation dispute cases"
      description: "Search for judicial and arbitration cases on fund liquidation disputes"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate liquidation dispute memo"
      description: "Generate liquidation dispute analysis memorandum and liability decision tree"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请就基金清算过程中LP对GP的责任追究争议起草法律备忘录：

          争议背景：
          - 基金名称：【XXX基金】
          - 基金当前状态：【即将到期/已到期进入清算/清算进行中】
          - 基金整体业绩：【亏损/微盈/未达门槛收益】
          - LP诉求：【追究GP管理失职责任 / 要求GP返还全部/部分业绩报酬（Clawback） / 主张GP赔偿损失 / 其他】
          - GP立场：【投资亏损属正常市场风险 / 已勤勉尽责 / LPA免责条款保护 / 其他】

          请搜索基金清算纠纷的司法判例和仲裁案例，从以下维度分析：

          一、Clawback（回拨机制）的执行争议
          1. Clawback的法律基础：
             - LPA约定的Clawback条款效力分析
             - Clawback的计算方法争议（whole fund vs. deal-by-deal下的不同计算）
             - Clawback的执行障碍（GP已分配收益无法追回/GP主体已注销/GP资产不足）

          2. LP追回业绩报酬的法律路径：
             - 按LPA条款主张Clawback
             - 超出LPA约定主张GP欺诈/重大过失
             - 穿透追索GP股东/实控人个人资产的条件

          二、GP管理失职的责任追究
          1. GP失职的认定标准：
             - 勤勉尽责义务的司法认定标准（搜索判例）
             - 投资决策失职 vs. 商业判断失误的区分
             - 内控缺失导致损失的责任认定
             - 未按投资限制投资的责任认定

          2. LP可主张的赔偿范围：
             - 直接损失（因GP失职导致的额外损失）
             - 间接损失（基金亏损中GP失职贡献的部分）
             - 管理费退还是否可主张
             - LP投资机会损失的赔偿可行性

          三、清算分配争议
          1. 瀑布机制执行争议：
             - 门槛收益率计算争议（复利/单利、起算日期争议）
             - Catch-up计算争议
             - 管理费抵消计算争议
             - Clawback与最终分配的衔接

          2. 实物分配争议：
             - 未退出项目的实物分配估值争议
             - LP拒绝接受实物分配的处理
             - 实物分配后的GP持续义务

          3. 清算费用争议：
             - 清算费用的范围与合理性
             - 清算人费用由谁承担（GP/LP/基金）

          四、GP退出与责任限制
          1. GP清算中的责任限制条款效力：
             - LPA中GP责任限制条款的司法审查
             - 责任限制不覆盖的情形（欺诈/故意违约/重大过失）

          2. GP解散/注销后LP的追索路径：
             - GP为有限合伙时——穿透GP的GP追索
             - GP为公司时——股东/实控人追索条件
             - GP已注销时——清算未了债务的处理

          请输出争议分析备忘录 + Clawback计算争议对照表 + GP责任追究路径决策树。
