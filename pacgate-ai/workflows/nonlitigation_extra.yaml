             - 解锁时间表与通胀率
             - 代币效用与价值捕获机制
             - 是否存在"庞氏"特征（高APY来源分析）

          2. 技术安全：
             - 智能合约审计报告（CertiK / Trail of Bits / Quantstamp等）
             - 审计发现与修复状态
             - 多签钱包配置
