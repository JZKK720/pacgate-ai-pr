# Non-litigation extra workflows
# Derived from: 非诉律师实用Prompts指南.md
# Covers cross-border M&A, domestic M&A, arbitration, Web3, corporate governance,
# capital markets, equity incentive, banking/finance, shipping/maritime, PPP/energy,
# and general legal templates NOT already covered by existing workflow files.
# IDs use the 00000000-0000-0000-0000-000000000cXX range (c01..c19).

- id: "00000000-0000-0000-0000-000000000c01"
  name: "监管审批路径分析"
  description: "Analyze regulatory approval path for a Chinese company acquiring a foreign target (FDI, antitrust, ODI)"
  category: "cross_border_ma"
  steps:
    - name: "Search regulatory requirements"
      description: "Search for FDI, national security, and antitrust approval requirements"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate approval analysis"
      description: "Generate regulatory approval path analysis with timeline"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请分析【中国企业】收购【美国/欧盟/英国】某【半导体/AI/国防相关】企业涉及的监管审批：

          一、目标国审查
          1. FDI/国家安全审查：
             - 【美国CFIUS / 欧盟FDI Screening Regulation / 英国NSI Act】适用性分析
             - 是否属于"敏感行业"
             - 申报是否为强制申报还是自愿申报
             - 审查时间线与关键里程碑
             - 可能的缓解措施（Mitigation Measures）类型
             - 所需材料清单

          2. 反垄断申报：
             - 营业额测试（各法域 thresholds）
             - 是否触发合并控制申报
             - 申报时间线（Phase I / Phase II）
             - 救济措施可能性（资产剥离等）

          3. 行业特定审批：
             - 【FDA/EDA/民航局等】行业监管审批要求

          二、中国侧审批
          1. ODI备案/核准流程
          2. 外汇登记
          3. 反垄断申报（如达到中国申报标准）

          三、时间线总览
          请输出甘特图式的审批时间线，标注各审批之间的并行/串行关系和关键路径。

- id: "00000000-0000-0000-0000-000000000c02"
  name: "交割后整合法律风险评估"
  description: "Assess post-merger integration legal risks for cross-border M&A"
  category: "cross_border_ma"
  steps:
    - name: "Search integration legal basis"
      description: "Search for labor, IP, data transfer, and tax integration rules"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate risk assessment"
      description: "Generate post-merger integration legal risk matrix"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请对本次跨境并购的投后整合（Post-merger Integration）阶段进行法律风险评估：

          收购方：【中国企业】，目标公司：【德国/日本企业】，行业：【制造业/科技】

          评估维度：
          1. 劳动法整合风险：
             - 目标国裁员/调岗/降薪的法律限制
             - 工会/员工代表的信息与咨询权（如德国Co-determination）
             - 留用奖金（Retention Bonus）的税务处理
             - 养老金负债转移问题

          2. 知识产权整合：
             - IP权属变更与许可协议承继
             - 联合开发IP的权属安排
             - 开源代码合规风险传导

          3. 数据跨境传输合规：
             - 收购后数据整合涉及的跨境数据传输
             - 目标国数据保护法限制（GDPR第6章合法性基础）
             - 数据本地化要求

          4. 关联交易与转移定价：
             - 采购/销售集中化的转移定价风险
             - 关联交易披露义务
             - 事先裁定（APA）申请的必要性

          5. 反商业贿赂合规整合：
             - FCPA/UKBA对收购方的继承责任（successor liability）
             - 目标公司历史合规问题尽职调查（pre-acquisition compliance review）

          6. 税务整合：
             - 税务居民身份变更
             - 常设机构（PE）风险
             - 税收协定适用

          输出：风险矩阵表（风险 × 可能性 × 影响 × 应对措施），标注"交易前必须解决"vs"交割后12个月内解决"vs"长期监控"。

- id: "00000000-0000-0000-0000-000000000c03"
  name: "境内并购交易结构设计"
  description: "Design optimal transaction structure for domestic M&A (equity vs asset vs capital increase vs merger)"
  category: "domestic_ma"
  steps:
    - name: "Search domestic M&A rules"
      description: "Search for Company Law, SOE transaction, and antitrust rules"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate structure design"
      description: "Generate domestic M&A transaction structure comparison matrix"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请为以下境内并购交易设计最优交易结构方案：

          交易背景：
          - 收购方：【中国民企 / 国有企业 / 上市公司 / PE基金】
          - 目标公司：【中国境内企业】，行业：【XX行业】，注册地：【XX省/市】
          - 目标估值：【约XX亿元人民币】
          - 收购比例：【100%全资收购 / 51%控股 / 30%参股】
          - 目标公司性质：【民营企业 / 国有企业 / 外商投资企业 / VIE架构企业】

          请从以下维度分析"股权收购 vs. 资产收购 vs. 增资入股 vs. 合并"四种方案的利弊：

          1. 税务效率：
             - 股权收购：目标公司历史税务风险承继、股权转让所得税（个人20% / 企业一般25%但有特殊递延）
             - 资产收购：增值税、土地增值税、契税的叠加成本（资产收购税负通常远高于股权收购）
             - 特殊税务筹划：是否适用特殊性税务处理递延纳税（59号文条件）
             - 印花税差异

          2. 法律风险承继：
             - 股权收购：隐性债务、历史违规、劳动争议、税务风险的承继
             - 资产收购：风险隔离效果，但需逐一确认每项资产的权属和可转让性
             - 合同变更与承继（需目标公司每份重大合同的对方同意）

          3. 审批与合规：
             - 国资交易：是否触发32号令/36号令的进场交易要求？评估与审计的前置程序
             - 外资并购：是否涉及《外商投资准入负面清单》限制类/禁止类？
             - 反垄断：是否触发经营者集中申报（营业额/市场份额测试）
             - 上市公司：是否触发重大资产重组/要约收购/信息披露义务
             - 行业审批：【金融/电信/军工/教育/医疗】等行业准入审批

          4. 交割便利性：
             - 工商变更登记的流程与时间
             - 资产过户登记（房产/土地/知识产权/车辆）的逐一流程
             - 员工安置方案的差异

          5. 后续整合：
             - 品牌商誉的保留 vs. 更替
             - 业务资质的延续性
             - 银行贷款/担保的承继与变更

          请输出对比矩阵表，标注每种方案在各维度的优/劣/中评级，给出推荐方案及理由。
          引用《公司法》2024修订版、《企业国有资产交易监督管理办法》（32号令）、经营者集中申报标准等最新法规。
          使用华宇元典数据库检索。

- id: "00000000-0000-0000-0000-000000000c04"
  name: "上市公司并购与重大资产重组"
  description: "Legal compliance analysis for listed company M&A and major asset restructuring"
  category: "domestic_ma"
  steps:
    - name: "Search listed company M&A rules"
      description: "Search for major asset restructuring and takeover rules"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate compliance report"
      description: "Generate compliance review report framework for listed company M&A"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请为以下上市公司并购/重大资产重组项目进行法律合规分析：

          项目信息：
          - 上市公司：【XX股份】，板块：【主板/科创板/创业板/北交所】
          - 交易类型：【重大资产购买 / 重大资产出售 / 重大资产置换 / 吸收合并 / 要约收购 / 协议收购】
          - 标的资产/公司：【XX公司/XX资产包】，估值：【XX亿元】
          - 交易后是否构成借壳/重组上市：【是/否/待确认】
          - 支付方式：【现金 / 发行股份 / 现金+股份 / 可转债】

          合规分析维度（依据《上市公司重大资产重组管理办法》《上市公司收购管理办法》及最新修订）：

          1. 重大资产重组认定标准：
             - 资产总额/营业收入/资产净额的50%测试（是否构成重大资产重组）
             - 借壳/重组上市的认定标准（100%测试 + 实际控制人变更）
             - 判断结果对审核程序的影响（证监会注册 vs. 交易所审核 vs. 仅披露）

          2. 信息披露合规：
             - 停牌/提示性公告→董事会预案→股东大会→证监会/交易所审核→实施→实施报告的完整披露时间线
             - 每阶段的披露内容要求
             - 内幕信息管理与知情人登记
             - 停牌安排与时间限制

          3. 审核注册程序：
             - 交易所审核流程（受理→审核问询→审核中心意见→联席会议→上市委审议→向证监会注册）
             - 证监会注册程序与时间线
             - 问询函常见问题清单及预答策略
             - 分道制审核的分类与影响

          4. 中介机构职责：
             - 独立财务顾问的核查意见
             - 法律意见书的要求
             - 审计报告的要求
             - 评估报告的要求
             - 各中介机构的分工与责任边界

          5. 股份发行与定价：
             - 发行股份购买资产的定价基准日选择（董事会决议公告日/股东大会决议公告日/董事会再次决议公告日）
             - 定价底线（20日/60日/120日均价的90%）
             - 价格调整机制的条件与限制
             - 锁定期安排（12个月/36个月/60个月的分层适用）

          6. 要约收购专项（如适用）：
             - 触发全面要约/部分要约的条件（30%红线）
             - 要约价格底线
             - 免除要约义务的申请条件与程序
             - 预受要约与竞争要约的程序

          7. 投资者保护：
             - 异议股东的利益保护机制
             - 中小股东表决权保护（网络投票、单独计票）
             - 利润承诺与补偿安排

          8. 反垄断与经营者集中申报（如触发）

          请输出合规审查报告框架，标注各环节的时间节点和合规要求。
          引用《重组管理办法》2024修订版、《收购管理办法》及最新交易所审核规则。
          使用华宇元典和联网搜索检索最新监管案例和审核动态。

- id: "00000000-0000-0000-0000-000000000c05"
  name: "外商投资并购专项合规"
  description: "Analyze China compliance path for foreign-invested M&A transactions"
  category: "domestic_ma"
  steps:
    - name: "Search foreign investment rules"
      description: "Search for Foreign Investment Law and negative list rules"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate compliance analysis"
      description: "Generate foreign investment M&A compliance decision tree"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请分析以下外商投资并购交易的中国合规路径：

          交易信息：
          - 外资方：【XX外国公司/基金】，国家/地区：【XX】
          - 目标公司：【XX中国公司】，行业：【XX行业】
          - 收购比例：【XX%】
          - 交易金额：【XX亿元人民币】

          合规分析维度（依据《外商投资法》及最新负面清单）：

          1. 准入限制判断：
             - 目标行业是否列入《外商投资准入特别管理措施（负面清单）》：
               * 禁止类：完全禁止外商投资（如新闻机构、武器弹药等）
               * 限制类：有股比/高管/许可等限制（如金融、电信、教育等）
               * 鼓励类：列入《鼓励外商投资产业目录》的优惠待遇
             - 是否涉及国家安全审查（《外商投资安全审查办法》适用条件）
             - VIE架构的合规性评估（负面清单行业使用VIE的法律风险）

          2. 审批与备案程序：
             - 商务部/地方商务部门备案 vs. 审批（负面清单内行业需审批）
             - 工商变更登记（外商投资企业设立/变更登记）
             - 外汇登记（FDI外汇登记与资金汇入）
             - 行业主管部门审批（如适用）

          3. 反垄断申报（如触发）

          4. 国资进场交易（如目标为国资）

          5. 上市公司外资并购特别规则（如目标为上市公司）：
             - 外资战略投资上市公司的审批与锁定期
             - QFII/RQFII渠道并购的路径与限制
             - 外资持股比例限制的行业汇总

          6. 外资并购特别审查：
             - 军工/国防相关行业的投资限制
             * 重要农产品/重要能源/重要文化等行业的安全审查
             * 拥有实际控制权的外资并购安全审查触发条件

          7. 外资并购后的合规义务：
             - 外商投资信息报告制度
             - 外商投资企业年度报告
             - 税务合规（居民企业认定、税收协定适用）

          请输出合规决策树，标注各环节的审批机关、时限和所需材料。
          引用《外商投资法》《外商投资准入负面清单》最新版、《外商投资安全审查办法》等。

- id: "00000000-0000-0000-0000-000000000c06"
  name: "仲裁条款审阅与起草"
  description: "Review and draft arbitration clauses with institution, seat, and governing law analysis"
  category: "arbitration"
  steps:
    - name: "Search arbitration rules"
      description: "Search for ICC/SIAC/HKIAC/LCIA/CIETAC rules and New York Convention"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate clause review"
      description: "Generate arbitration clause review and drafting suggestions"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请审阅以下合同中的仲裁条款，并给出修改建议：

          【粘贴仲裁条款文本】

          审阅维度：
          1. 仲裁机构选择：
             - ICC vs. SIAC vs. HKIAC vs. LCIA vs. CIETAC 的优劣比较
             - 机构规则版本的适用

          2. 仲裁地（Seat of Arbitration）：
             - 仲裁地的法律意义（法院监督、裁决国籍、执行依据）
             - 是否为《纽约公约》缔约国

          3. 仲裁员人数与指定方式：
             - 独任仲裁员 vs. 三人仲裁庭的成本与效率权衡
             - 指定机制（机构指定 vs. 当事人指定）

          4. 仲裁语言：
             - 中英双语 vs. 单语的选择考量

          5. 实体法适用：
             - 准据法选择条款的有效性
             - 最密切联系原则的适用风险

          6. 仲裁条款的可分割性（Severability/Competence-Competence）

          7. 临时措施与紧急仲裁员条款

          8. 多方/多合同仲裁条款的前瞻性安排（合并仲裁、追加当事人）

          请提供"投资人/中方友好版"和"均衡版"两种修改建议文本，中英对照。

- id: "00000000-0000-0000-0000-000000000c07"
  name: "跨境裁决/判决执行分析"
  description: "Analyze path for recognizing and enforcing foreign arbitral awards or judgments in mainland China"
  category: "arbitration"
  steps:
    - name: "Search enforcement rules"
      description: "Search for New York Convention and judicial interpretation on enforcement"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate enforcement analysis"
      description: "Generate cross-border award/judgment enforcement analysis"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请分析一份【新加坡/香港/英国/美国】法院判决或仲裁裁决在中国大陆申请承认与执行的路径：

          案件信息：
          - 裁决/判决来源：【SIAC仲裁裁决 / 香港法院判决 / 美国法院判决】
          - 被执行人：在【中国大陆】有资产
          - 争议金额：【约XX万美元】

          分析框架：
          1. 法律依据：
             - 仲裁裁决：《纽约公约》+ 中国《民事诉讼法》第281条（2023年修订）
             - 外国法院判决：双边司法协助条约 / 互惠原则
             - 【如适用】内地-香港《关于内地与香港特别行政区法院相互认可和执行民商事案件判决的安排》

          2. 申请程序：
             - 管辖法院（被申请人住所地/财产所在地的中级法院）
             - 申请材料清单（裁决书原件+认证翻译件、仲裁协议证明等）
             - 申请期限

          3. 审查标准：
             - 形式审查 vs. 实质审查
             - 公共政策例外（如何界定"公共政策"）
             - 程序正当性审查（正当程序抗辩）
             - 超裁抗辩

          4. 可能的抗辩理由及应对：
             - 被申请人可能提出的抗辩
             - 我方应对策略

          5. 时间与费用预估：
             - 审查程序时间线
             - 法院费用、翻译费、律师费预估

          6. 资产调查与保全：
             - 执行前资产调查路径
             - 申请财产保全的可能性

          请引用最新司法解释和典型案例（使用华宇元典数据库检索）。

- id: "00000000-0000-0000-0000-000000000c08"
  name: "争议解决方式比较分析"
  description: "Compare international arbitration vs cross-border litigation to select optimal dispute resolution path"
  category: "arbitration"
  steps:
    - name: "Search dispute resolution options"
      description: "Search for arbitration and litigation comparison data"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate comparison analysis"
      description: "Generate dispute resolution comparison matrix and recommendation"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请为以下跨境商事争议提供争议解决方式比较分析，帮助客户选择最优路径：

          争议概况：【简述交易背景和争议焦点】
          当事人：【中方 vs. 外方，各自所在地】
          争议金额：【约XX万美元】
          合同约定：【现有争议解决条款内容，如有】

          请从以下维度比较：

          | 维度 | 国际仲裁 | 跨境诉讼 |
          |------|---------|---------|
          | | ICC/SIAC/HKIAC/LCIA | 中国法院 vs. 外国法院 |

          1. 保密性：仲裁的保密性 vs. 诉讼的公开性
          2. 执行力：仲裁裁决（纽约公约）vs. 外国判决（互惠/条约）
          3. 成本：仲裁费 vs. 法院费用 + 各自律师费
          4. 速度：仲裁 vs. 诉讼的平均时间
          5. 专业性：仲裁员选择 vs. 法官专业度
          6. 上诉与纠错：仲裁一裁终局 vs. 诉讼上诉机制
          7. 临时措施：仲裁庭/紧急仲裁员 vs. 法院保全
          8. 文件披露：仲裁灵活披露 vs. 诉讼证据规则
          9. 跨境执行便利度
          10. 和解可能性

          请输出对比矩阵，并基于案件具体情况给出推荐方案及理由。

- id: "00000000-0000-0000-0000-000000000c09"
