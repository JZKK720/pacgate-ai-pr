          3. 团队背景：
             - 核心团队身份验证（KYC）
             - 历史项目经验
             - 匿名团队的风险评估

          4. 监管合规状态：
             - 代币法律意见书（Legal Opinion on Token Classification）
             - 适用的牌照/注册
             - 制裁合规（OFAC/SDN名单筛查）

          5. 链上资产托管：
             - 金库（Treasury）管理方案
             - 冷热钱包配置
             - 保险覆盖

          6. 用户数据合规：
             - 用户数据收集范围（钱包地址 vs. KYC数据）
             - 隐私政策合规性
             - 链上数据的隐私保护

          7. 社区与治理：
             - 治理参与度分析
             - 提案与投票记录
             - 社区争议历史

