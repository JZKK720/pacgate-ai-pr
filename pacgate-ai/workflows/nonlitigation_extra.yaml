      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate documents or exit handling"
      description: "Generate equity incentive document package or exercise/exit handling"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请起草股权激励全套文件，或处理行权/退出的具体事项：

          【场景A：起草文件包】
          基于已确定的方案参数【粘贴方案要点】，起草：
          1. 《股权激励计划》（总纲：定义、池规模、管理机构与授权、授予/成熟/行权/回购规则、调整与终止）
          2. 《授予协议》（个人化条款：数量、价格、成熟表、税务责任、保密与竞业衔接）
          3. 持股平台《有限合伙协议》（GP控制权、LP权利限制、入伙退伙机制、表决权归集）
          4. 《行权通知书》《回购通知书》模板
          5. 股东会/董事会决议
          6. 员工沟通FAQ（通俗解释：值多少钱/什么时候能变现/离职怎么办/要交多少税）

          【场景B：行权/退出处理】
          员工情况：【姓名/激励工具/已成熟比例/离职原因（主动辞职/被辞退/协商/退休）】
          请分析：
          1. 按计划文件的处理路径（已成熟/未成熟部分的处置）
          2. 回购价格计算（成本价/净资产/约定公式）与支付安排
          3. 个税代扣代缴义务
          4. 争议风险：激励纠纷的定性（劳动争议 vs. 合同纠纷——影响管辖与仲裁前置）、常见裁判倾向
          5. 文件签署清单（回购协议、退伙协议、工商变更）

          输出所需文件 + 操作步骤 + 风险提示。

- id: "00000000-0000-0000-0000-000000000c15"
  name: "资产证券化（ABS/REITs）法律架构"
  description: "Design legal architecture for asset securitization (ABS/REITs) projects"
  category: "banking_finance"
  steps:
    - name: "Search securitization rules"
      description: "Search for ABS/REITs regulatory and true-sale rules"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate securitization architecture"
      description: "Generate ABS/REITs legal architecture and document list"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请为以下资产证券化项目设计法律架构：

          项目信息：
          - 基础资产类型：【应收账款/租赁债权/收费收益权/CMBS（不动产抵押贷款）/基础设施（公募REITs）】
          - 原始权益人：【XX公司】
          - 拟发行规模：【XX亿元】
          - 发行场所：【交易所（企业ABS）/银行间（ABN/信贷ABS）/公募REITs】

          架构设计：

          1. 基础资产合格性审查：
             - 负面清单核查、权属清晰性、可特定化、现金流独立稳定
             - 未来债权/收益权的特殊问题（特许经营权质押限制等）

          2. 真实出售与破产隔离：
             - 转让的法律效力（通知债务人的安排、应收账款转让登记）
             - "真实出售"要件 vs. 担保融资的再定性风险
             - 原始权益人破产时的隔离效果论证

          3. SPV与交易结构：
             - 专项计划/信托/私募基金+专项计划（REITs的"公募基金+ABS+项目公司"三层架构）
             - 增信措施：优先/次级分层、差额支付、担保、保证金
             - 现金流归集路径与账户监管（混同风险防控）

          4. 公募REITs特有问题（如适用）：
             - 项目公司股权重组与税务（划转/增资的特殊性税务处理）
             - 特许经营权/产权类项目的转让审批
             - 原始权益人战略配售与扩募安排

          5. 法律意见书要点与各方文件清单

          输出交易结构图 + 法律要点清单 + 文件清单。

- id: "00000000-0000-0000-0000-000000000c16"
  name: "船舶建造/买卖与融资法律审查"
  description: "Legal review and document drafting for shipbuilding, sale/purchase, and financing"
  category: "shipping_maritime"
  steps:
    - name: "Search maritime rules"
      description: "Search for shipbuilding, sale, and mortgage rules"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate review and documents"
      description: "Generate ship transaction legal review and document list"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请为以下船舶交易提供法律审查/文件起草支持：

          交易信息：
          - 交易类型：【新造船建造合同/二手船买卖/船舶融资租赁/船舶抵押融资】
          - 船舶信息：【船型、吨位、船级社、拟挂旗（中国/香港/巴拿马/马绍尔等）】
          - 我方身份：【船东/船厂/买方/卖方/融资租赁公司/银行】
          - 合同范本基础：【SAJ/NEWBUILDCON/挪威格式SALEFORM/自拟】

          审查/起草要点：

          1. 新造船建造合同（如适用）：
             - 付款节点与还款保函（Refund Guarantee）的银行开立与索赔条件
             - 建造监理与检验权、变更（Modification）定价机制
             - 交船条件与试航验收标准
             - 延误交船的赔偿与解约权（弃船权触发天数）
             - 保证期（Warranty）与缺陷修复
             - 适用法与仲裁（伦敦仲裁惯例 vs. 中国仲裁的选择）

          2. 二手船买卖（如适用）：
             - MOA核心条款：定金与付款、检验（潜水检验/坞检）、交接文件清单
             - 交船条件（free from encumbrances——抵押/优先权/留置的清洁保证）
             - 物理交接与文件交接的衔接（Notice of Readiness）

          3. 船舶融资（如适用）：
             - 融资租赁架构：SPV持船、光船租赁注册、售后回租的合规
             - 船舶抵押登记（登记机关与效力）与受偿顺位提示：船舶优先权＞船舶留置权＞船舶抵押权
             - 保险利益安排（船壳险/保赔险的第一受益人、保险转让）
             - 挂旗选择的法律影响（登记地法对抵押执行的影响）

          4. 税务与合规：进口环节税务（如入中国籍）、制裁筛查（船舶/船东/贸易航线）

          输出审查意见（🔴🟡🟢标注）+ 关键条款修改建议 + 交易文件清单。

- id: "00000000-0000-0000-0000-000000000c17"
  name: "租船与运输合同审阅"
  description: "Review charterparty and carriage contracts from various party perspectives"
  category: "shipping_maritime"
  steps:
    - name: "Search charterparty rules"
      description: "Search for charterparty and bill of lading rules"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate charterparty review"
      description: "Generate charterparty/carriage contract review with modification suggestions"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请从【出租人/承租人/托运人/承运人】角度审阅以下租船/运输合同：

          【粘贴或上传合同文本】

          合同类型：【定期租船（NYPE/BALTIME）/航次租船（GENCON）/包运合同COA/光船租赁（BARECON）/多式联运】

          审阅要点：

          1. 期租合同（如适用）：
             - 交还船条件（时间窗口、燃油交接计价、还船通知）
             - 租金支付与撤船权（技术性撤船的宽限条款、反技术性撤船条款）
             - 停租（Off-hire）事由清单与举证
             - 安全港口/安全泊位保证的责任边界
             - 转租权与责任承担

          2. 程租合同（如适用）：
             - 受载期（Laycan）与解约权
             - 装卸时间（Laytime）起算、滞期费/速遣费的计算条款
             - 运费支付节点（预付运费的不可退还条款）
             - 绕航与合理绕航的边界

          3. 提单相关：
             - 租约条款并入提单的效力（仲裁条款并入的明示要求）
             - 承运人识别条款（Identity of Carrier）
             - 电放/无单放货的风险控制条款

          4. 通用风险条款：
             - 互有责任碰撞条款、新杰森条款、共同海损理算条款
             - 战争/冰冻/疫情条款（航线风险分配）
             - 制裁条款（航线/货物/交易对手的制裁合规）
             - 留置权条款（对货物/转租运费的留置）

          输出逐条审阅意见（🔴🟡🟢）+ 修改建议文本（中英对照）。

- id: "00000000-0000-0000-0000-000000000c18"
  name: "能源项目开发与并购"
  description: "Legal support for energy project development and M&A (solar, wind, storage)"
  category: "ppp_energy"
  steps:
    - name: "Search energy project rules"
      description: "Search for energy project development and M&A rules"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate compliance and structure"
      description: "Generate energy project compliance checklist and transaction structure"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请为以下能源项目的开发/并购提供法律支持：

          项目信息：
          - 项目类型：【集中式光伏/风电（陆上/海上）/储能/分布式光伏/传统电力/氢能/充换电】
          - 事项类型：【新项目开发/项目公司股权并购/EPC与运维合同/电力交易】
          - 项目规模：【装机XX MW，投资额XX亿元】
          - 我方身份：【开发商/投资方/收购方/EPC承包商/融资方】

          法律支持内容：

          1. 开发阶段合规清单（如适用）：
             - 项目指标与备案：竞争性配置指标的取得与转让限制、备案/核准
             - 用地合规：用地性质（戈壁/农光互补/林光互补的限制）、耕地与生态红线核查、租赁 vs. 出让的选择与农村土地流转程序
             - 电网接入：接入系统批复、消纳能力
             - 环评/水保/军事/文物/矿压等专项批复
             - 电价机制：平价上网/市场化交易/绿电绿证的收益结构

          2. 项目公司并购尽调重点（如适用）：
             - 指标合规性：指标取得程序、"倒卖路条"风险（未开工先转让的限制）
             - 补贴合规：存量项目的可再生能源补贴核查结论、欠补的应收账款处理
             - 土地瑕疵：未办证先建设、租赁期限与项目周期错配、地上附着物补偿纠纷
             - 电站质量：EPC质保责任的承继、组件衰减担保
             - 股权交割安排：分期付款与并网/指标条件挂钩的对赌设计

          3. 核心合同审查（如适用）：
             - EPC合同：固定总价的调价例外、进度与并网节点、性能担保（PR值）与违约金
             - 运维合同：可用率承诺与考核
             - 购售电协议（PPA）/绿电交易协议：电量电价、偏差考核、期限与终止

          4. 融资与退出：项目融资担保包（股权质押/电费收益权质押）、公募REITs退出的合规预留

          输出合规清单/尽调报告框架 + 交易结构建议 + 风险矩阵。

- id: "00000000-0000-0000-0000-000000000c19"
  name: "客户沟通文件"
  description: "Draft client communication documents (risk alert letter, legal briefing, service proposal)"
  category: "general_legal"
  steps:
    - name: "Generate client communication"
      description: "Generate client communication document with email template"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请根据以下内容，起草一份致客户的【法律风险提示函 / 法律简报 / 法律服务建议书】：

          内容要点：
          【粘贴要点或描述场景】

          文件类型选择：
          - 法律风险提示函：针对新法规出台/监管动态，提示客户潜在影响
          - 法律简报：定期或不定期法律动态通报
          - 法律服务建议书：针对客户具体需求，提出法律服务方案

          格式要求：
          1. 开头：客户称谓 + 简短背景说明
          2. 正文：分点列出要点，每点包含"事实/变化"→"法律分析"→"对您的影响"→"建议行动"
          3. 结尾：联系方式 + 免责声明
          4. 语言风格：专业但不过度学术化，客户高管可读
          5. 篇幅控制在【1-2页A4】

          输出为Word文档，附邮件正文模板。
