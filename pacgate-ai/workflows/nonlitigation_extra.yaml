- id: "00000000-0000-0000-0000-000000000c0c"
  name: "RWA 项目法律架构设计"
  description: "Design legal architecture for Real World Asset tokenization projects"
  category: "web3"
  steps:
    - name: "Search RWA regulatory developments"
      description: "Search for RWA regulatory frameworks (Ensemble, Project Guardian, DTA, EU DLT pilot)"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate architecture design"
      description: "Generate RWA legal architecture comparison matrix and recommendation"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请为以下RWA（Real World Asset Tokenization，现实世界资产代币化）项目设计法律架构方案：

          RWA项目基本信息：
          - 底层资产类型：【不动产（房产/商业地产）/ 债券（国债/企业债）/ 私募股权基金份额 / 艺术品/收藏品 / 碳信用/绿色资产 / 应收账款/供应链金融 / 其他】
          - 底层资产所在地：【中国大陆 / 中国香港 / 美国 / 欧盟 / 新加坡 / 开曼】
          - 资产规模：【XX亿元人民币/美元】
          - 代币化比例：【100%完全代币化 / 部分代币化（如5%作为流动性层）】
          - 目标投资者：【中国大陆投资者 / 海外合格投资者 / 全球散户 / 机构投资者】
          - 发行平台：【公链（以太坊/Solana）/ 联盟链（蚂蚁链/BSN）/ 许可链】
          - 是否涉及二级市场交易：【是（流动性市场）/ 否（仅持有到期）】

          请分析以下法律架构方案的利弊及合规路径：

          1. 直接代币化模式（Direct Tokenization）：
             - SPV设立（底层资产→SPV持有→代币对应SPV股权/份额）
             - SPV注册地选择矩阵：
               * 开曼群岛：成本、速度、税收中性、投资者接受度
               * BVI：类似开曼但设立更快
               * 中国香港：透明度高、亚洲投资者信任、但合规成本较高
               * 新加坡：MAS监管框架明确、但需VASP牌照
               * 瑞士：DTA框架完善、欧洲投资者友好
               * 卢森堡：欧盟基金代币化立法先行
             - 代币与SPV权益的法律映射机制（代币=SPV股权？还是债权？还是收益权凭证？）
             - 代币持有者对底层资产的间接权利链条（代币→SPV→底层资产，每层法律关系的明确性）

          2. 基金/信托持有模式（Fund/Trust Model）：
             - 信托架构：底层资产装入信托→受托人管理→代币代表信托受益权
             - 基金架构：底层资产由基金持有→代币代表基金份额
             - 各法域信托/基金法律对代币化的适配度

          3. 抵押/担保模式（Collateral/Security Model）：
             - 底层资产作为抵押物→链上智能合约管理还款/清算→代币代表对抵押品的债权
             - 适用于供应链金融、应收账款类RWA

          4. 双层架构（On-chain + Off-chain Hybrid）：
             - 链上：代币发行、交易、结算
             - 链下：SPV/信托持有底层资产、法律协议约定代币持有者权利
             - 链上与链下的权利衔接机制（智能合约条款↔法律协议条款的一致性保障）

          每个方案需分析：
          - 投资者权利保护链条的完整性（从代币→法律实体→底层资产）
          - 代币法律性质认定（证券型/商品型/虚拟资产型）
          - 税务处理（代币分红/转让/赎回的税务影响）
          - 监管合规路径（各法域对RWA的监管态度和牌照要求）
          - 底层资产处置的法律程序（代币持有者如何行使权利影响底层资产处置）
          - 清算/退出机制

          请输出方案对比矩阵和推荐方案，重点标注各法域RWA的最新监管动态和试点案例。
          联网搜索香港Ensemble项目、新加坡MAS Project Guardian、瑞士DTA框架、欧盟DLT试点等最新RWA监管动态。

- id: "00000000-0000-0000-0000-000000000c0d"
  name: "三会召开全套流程与文件"
  description: "Draft full process and documents for shareholders/board/supervisory board meetings"
  category: "corporate_governance"
  steps:
    - name: "Search corporate meeting rules"
      description: "Search for Company Law 2024 meeting and voting rules"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate meeting documents"
      description: "Generate full meeting process guide and document templates"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请为以下公司三会会议起草全套流程文件：

          会议信息：
          - 公司名称：【XX有限公司/股份有限公司】
          - 会议类型：【股东会/董事会/监事会】，性质：【定期/临时】
          - 召开原因：【年度会议 / 审议XX事项 / 紧急事项】
          - 审议事项：【如：审议年度财务报告、选举董事、修改章程、增资、分红等】
          - 公司性质：【普通有限公司 / 国有企业 / 上市公司 / 外商投资企业】

          请提供以下全套文件与流程指引：

          一、会议召开程序合规指引（依据新《公司法》2024修订版）：

          1. 召集程序：
             - 股东会召集人：董事会/执行董事/监事/代表10%以上表决权股东（不同召集权限的适用条件）
             - 董事会召集人：董事长/半数以上董事推举的董事
             - 通知时限：股东会提前15日（有限公司）/20日（股份公司）/章程另有规定
             - 通知方式与送达确认
             - 通知内容要求（审议事项必须列明，不得临时增加重大事项）

          2. 表决规则：
             - 股东会普通决议：过半数表决权 / 特别决议：三分之二以上表决权（修改章程/增减资本/合并分立/解散/变更形式）
             - 董事会决议：过半数董事出席+过半数出席董事同意
             - 关联股东/关联董事回避表决规则
             - 累积投票制（如适用——股份公司选举董事/监事时可采用）
             - 一人有限公司的特别规定（书面决定+签名+存档）

          3. 线上/电子会议合规（新《公司法》允许电子方式参会）：
             - 电子会议的合法性确认条件
             - 身份验证与签到机制
             - 表决方式（电子投票系统的合规要求）
             - 会议记录与签名的电子化方案

          二、全套法律文件模板：

          1. 会议通知书：
             - 会议时间、地点、方式（现场/线上/混合）
             - 审议事项清单（逐项列明）
             - 出席/列席人员清单
             - 表决权确认要求（股东需携带的身份证明/持股证明）
             - 授权委托书模板（如股东委托他人出席）

          2. 授权委托书：
             - 委托人/受托人信息
             - 委托权限范围（一般授权/特别授权+逐项表态指引）
             - 委托期限

          3. 会议议程：
             - 时间分配、发言顺序、表决安排

          4. 会议决议草案（每项审议事项的决议草案文本）

          5. 会议记录模板：
             - 出席/缺席/委托情况记录
             - 每项议题的讨论要点记录
             - 表决情况记录（赞成/反对/弃权票数，赞成比例）
             - 异议记录（反对/弃权股东/董事的具体意见）
             - 签名页（主持人+记录人+出席股东/董事签名）

          6. 会议决议正式文本（每项通过的决议单独成文）

          7. 决议备案/报送要求（如适用——上市公司/国有企业/外商投资企业的特殊备案要求）

          请确保所有文件和程序符合新《公司法》2024修订版，特别注意电子参会的新规定和董事责任加重的新变化。

- id: "00000000-0000-0000-0000-000000000c0e"
  name: "公司减资、解散与注销全流程"
  description: "Full-process legal guidance and documents for capital reduction, dissolution, and deregistration"
  category: "corporate_governance"
  steps:
    - name: "Search capital reduction rules"
      description: "Search for Company Law 2024 capital reduction and liquidation rules"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate full-process guidance"
      description: "Generate capital reduction/dissolution/deregistration full-process guidance and documents"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请为以下公司减资/解散/注销项目提供全流程法律指引和全套文件：

          项目信息：
          - 公司名称：【XX有限公司】
          - 注册资本：【XX万元】，实缴出资：【XX万元】
          - 当前经营状态：【正常经营拟减资 / 亏损严重拟解散 / 已停止经营拟注销 / 被吊销拟注销】
          - 股东情况：【XX股东XX% / XX股东XX%】
          - 债权债务情况：【有已知债权人XX个 / 债务约XX万元 / 或有债务待确认】
          - 员工情况：【XX名员工，需安置/已安置】
          - 操作类型：【减资 / 解散清算 / 简易注销 / 强制注销】

          请提供以下全流程指引与文件：

          一、减资流程（依据新《公司法》2024修订版）：

          1. 减资类型判断：
             - 同比减资（所有股东按比例减少）vs. 定向减资（个别股东退出）
             - 免除出资义务减资（未实缴部分减资）vs. 返还出资减资（已实缴部分返还）
             - 新《公司法》第224条：减资必须编制资产负债表和财产清单

          2. 新法核心变化——减资必须通知债权人并公告：
             - 通知已知债权人（10日内）+ 公告（30日内，在报纸或国家企业信用信息公示系统公告）
             - 债权人45日内有权要求清偿债务或提供担保
             - 违反通知义务的法律后果（减资对债权人不发生效力，股东仍按原出资额承担责任）

          3. 简易减资程序（新法第225条新增）：
             - 适用条件：公司亏损严重，减资用于弥补亏损，且不减资返还股东、不免除股东出资义务
             - 简化公告程序（仅需在国家企业信用信息公示系统公告）
             - 注意：简易减资后2年内不得向股东分配利润或免除出资义务

          4. 全套文件：
             - 股东会决议（特别决议：三分之二以上表决权）
             - 董事会/执行董事提议方案
             - 资产负债表和财产清单
             - 债权人通知书模板
             - 债权人公告文本
             - 债权人清偿/担保方案
             - 章程修正案（注册资本变更）
             - 工商变更登记材料

          二、解散与清算流程：

          1. 解散事由判断：
             - 自愿解散：股东会决议（三分之二以上）
             - 章程规定解散事由出现
             - 合并/分立解散
             - 行政解散：吊销营业执照/责令关闭
             - 司法解散：公司僵局下的法院判决解散（新法第231条）

          2. 清算程序（新法第232-242条）：
             - 清算组组成（董事为法定清算义务人，新法重要变化！）
             - 清算组职权与义务
             - 清算公告与债权人申报（60日公告期）
             - 清算方案制定与确认
             - 清偿顺序（清算费用→职工工资/社保→税款→普通债务）
             - 剩余财产分配（按股东出资比例/章程约定）
             - 清算报告与确认
             - 注销登记

          3. 清算义务人责任（新法加重）：
             - 董事为法定清算义务人（新法第232条，原为股东）
             - 未及时清算的责任：对公司债务承担连带赔偿责任
             - 怠于清算导致无法清算：对公司全部债务承担连带责任
             - 欺诈清算的刑事责任风险

          4. 全套文件：股东会解散决议 + 清算组成立决议 + 清算公告 + 债权人申报登记表 + 清算方案 + 清算报告 + 注销登记申请书

          三、简易注销（新法第240条新增）：

          1. 适用条件：
             - 公司存续期间未产生债务或已清偿全部债务
             - 全体股东书面承诺对公司债务承担连带责任（如承诺不实）
             - 不适用简易注销的情形：有未清偿债务/有正在诉讼/有行政处罚未执行/曾被吊销

          2. 简易注销程序：
             - 全体股东承诺书
             - 在国家企业信用信息公示系统公告（20日公告期，无需债权人45日等待）
             - 公告期满无异议→向登记机关申请注销
             - 20日内完成注销

          3. 简易注销的风险：
             - 承诺不实的后果：股东对公司债务承担连带责任，不受出资比例限制
             - 不得再次申请简易注销的条件

          四、强制注销（新法第241条新增——行政机关依职权注销）：

          1. 适用条件：公司被吊销营业执照/责令关闭/撤销满3年且未申请注销登记
          2. 登记机关公告程序
          3. 强制注销的后果与股东责任

          请输出全流程时间线图、全套法律文件模板（每个文件标注法律依据条文号），以及新旧《公司法》清算制度变化对照表。

- id: "00000000-0000-0000-0000-000000000c0f"
  name: "高频公司法违规与争议风险排查"
  description: "Screen a company for high-frequency Company Law violations and dispute risks"
  category: "corporate_governance"
  steps:
    - name: "Search Company Law risk rules"
      description: "Search for Company Law 2024 compliance and liability rules"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate risk screening report"
      description: "Generate high-frequency Company Law violation and dispute risk screening report"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请为以下公司进行高频公司法违规和争议风险排查：

          公司信息：
          - 公司名称：【XX有限公司/股份有限公司】
          - 成立时间：【XX年XX月】
          - 注册资本：【XX万元】，实缴比例：【XX%】
          - 股东人数：【XX人】
          - 是否设董事会/监事会：【是/否/仅设执行董事/仅设1名监事】
          - 行业：【XX行业】
          - 经营状态：【正常经营/停业/亏损/被吊销】
          - 特殊情况：【有国资成分/有外资成分/VIE架构/上市公司/一人公司】

          请依据新《公司法》2024修订版，从以下维度排查高频违规和争议风险：

          一、出资合规风险（新法重点变化区域）：

          1. 认缴出资5年限制（新法第47条）：
             - 2024年7月1日前设立的存量公司：过渡期安排（国务院规定3年过渡期+5年缴足期=最长8年）
             - 当前认缴期限是否超过2032年7月1日？如超过，需修改章程缩短出资期限
             - 未在规定期限内缴足的法律后果：董事催缴义务（第51条）、股东失权风险（第52条）、对公司债务的补充赔偿责任

          2. 出资形式合规：
             - 现金出资是否到位
             - 非货币出资（实物/知识产权/股权）的评估程序是否合规
             - 是否存在虚假出资/抽逃出资
             - 新法变化：股权和债权可作出资（新法第48条新增），但需满足条件

          3. 股东出资瑕疵的法律后果：
             - 未按期出资：公司可发催缴书→60日未缴→失权通知→丧失未缴出资部分的股权
             - 抽逃出资：返还+赔偿+对公司债务连带责任（新法第53条）
             - 股东名册记载与工商登记不一致的风险

          二、公司治理合规风险：

          1. 三会运行合规：
             - 股东会/董事会/监事会是否按章程规定定期召开
             - 会议通知程序是否合规（时限、方式、内容）
             - 表决比例是否达到法定最低要求
             - 决议是否存在可撤销/无效/不成立情形（新法第25-28条）
             - 决议不成立的新增情形（新法第27条：未开会/未表决/未达法定出席/未达法定表决比例）

          2. 董事/高管责任风险（新法大幅加重）：
             - 董事催缴出资义务（第51条）——违反的个人赔偿
             - 董事清算义务（第232条）——未及时清算的连带赔偿责任
             - 董事/高管忠实义务清单（新法第181-191条详细列举）：
               * 禁止挪用资金/禁止违规担保/禁止利益冲突交易/禁止谋取商业机会/禁止同业竞争
               * 关联交易报告义务
               * 新增：董事/高管对第三人受害的赔偿责任（新法第191条重大变化）
             - 双重股东代表诉讼（新法第189条）：母公司股东可穿透起诉子公司董事/高管

          3. 法定代表人合规：
             - 新法第10条：法定代表人范围扩大（董事或经理均可）
             - 法定代表人变更程序：谁有权决定？变更登记时限？
             - 法定代表人越权代表的责任与限制

          三、股东权利与争议风险：

          1. 股东知情权争议（新法变化）：
             - 新法第57条扩大股东查阅权：可查阅会计凭证（原法无此规定）
             - 可委托会计师/律师查阅（新法明确允许）
             - 股东查阅权被拒绝的救济路径

          2. 股权转让争议高频类型：
             - 优先购买权争议（通知方式、同等条件认定、30日答复期）
             - 股权代持纠纷（显名股东与隐名股东的权利冲突、代持协议效力）
             - 股权继承争议（新法第90条：自然人股东死亡后，继承人可继承股东资格，章程另有规定除外）
             - 离婚分割股权争议（是否需其他股东同意/优先购买权冲突）

          3. 公司僵局与解散请求权：
             - 公司经营严重困难认定标准
             - 股东请求解散公司的条件（持股10%以上）
             - 替代方案：强制股权收购/减资退出

          4. 股东滥用权利风险：
             - 滥用法人独立地位和股东有限责任逃避债务（新法第23条，人格否认制度）
             - 一人公司股东自证财产独立的义务（举证责任倒置）
             - 横向人格否认：关联公司间的人格否认（新法第23条第2款新增）

          四、公司变更合规风险：

          1. 减资程序合规（新法必须通知债权人+45日等待期）
          2. 合并/分立程序合规（债权人保护程序）
          3. 注册资本/经营范围变更的合规审查

          五、其他高频风险：

          1. 公司印章管理风险（公章私刻、公章失控、电子印章合规）
          2. 营业执照管理风险（吊销后继续经营的法律后果）
          3. 信息公示合规（国家企业信用信息公示系统年报/即时信息公示义务）
          4. 税务合规交叉风险（出资/转让/注销环节的税务风险）

          请输出风险排查报告，每项标注风险等级（🔴高风险/🟡中风险/🟢低风险）和整改建议。
          引用新《公司法》2024修订版具体条文号。
          使用华宇元典数据库检索相关司法解释和典型案例。

- id: "00000000-0000-0000-0000-000000000c10"
  name: "外商投资企业设立"
  description: "Full-process legal plan for establishing a foreign-invested enterprise (WFOE/JV/representative office)"
  category: "corporate_governance"
  steps:
    - name: "Search foreign investment setup rules"
      description: "Search for negative list and foreign investment establishment rules"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate establishment plan"
      description: "Generate foreign-invested enterprise establishment plan and document list"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请为以下外商投资企业设立项目提供全流程法律方案：

          设立信息：
          - 境外投资方：【国别/地区、主体类型（公司/基金/个人）】
          - 拟设立形式：【外商独资企业（WFOE）/ 中外合资（JV）/ 外国企业代表处】
          - 拟经营业务：【简述】，行业：【XX行业】
          - 注册资本：【XX万元/万美元】，出资方式：【现金/实物/知识产权】
          - 注册地：【XX市】，是否入驻自贸区/特殊经济区域：【是/否】

          方案内容：

          1. 准入合规核查：
             - 目标行业是否列入《外商投资准入负面清单》（禁止/限制/股比要求）
             - 是否列入《鼓励外商投资产业目录》（优惠政策适用）
             - 是否涉及行业前置审批（金融/电信/医疗/教育等）
             - 是否触发外商投资安全审查

          2. 设立流程与时间线：
             - 名称登记 → 市场监管设立登记 → 刻章 → 外汇FDI登记 → 银行开户与资本金入账 → 税务登记与票种核定 → 社保/公积金开户 → 海关登记（如涉进出口）
             - 每步的办理机关、材料、时限

          3. 设立文件清单：
             - 章程（治理结构选择：董事会 vs. 执行董事；是否设监事——注意新《公司法》单层治理选项）
             - 投资方主体资格文件的公证认证/海牙认证（Apostille，中国2023年加入公约后的简化路径）
             - 法定代表人/董事/监事任命文件
             - 注册地址证明与租赁合同
             - 外商投资信息报告（初始报告）

          4. 合资项目补充（如适用）：
             - 合资合同核心条款（股权比例/董事会席位/否决权/僵局解决/退出机制）
             - 技术出资/许可安排

          5. 设立后持续合规义务清单：
             - 外商投资信息年度报告、工商年报、外汇存量权益登记、税务合规

          输出设立方案 + 流程时间线 + 文件清单表格。

- id: "00000000-0000-0000-0000-000000000c11"
  name: "外商投资企业变更与注销"
  description: "Legal guidance for foreign-invested enterprise changes and deregistration"
  category: "corporate_governance"
  steps:
    - name: "Search FIE change rules"
      description: "Search for foreign-invested enterprise change and deregistration rules"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate change/deregistration guidance"
      description: "Generate FIE change/deregistration flow chart and document list"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请为以下外商投资企业的变更/注销事项提供法律指引：

          企业信息：
          - 企业名称：【XX（中国）有限公司】
          - 事项类型：【股权转让 / 增资减资 / 经营范围变更 / 董事与法定代表人变更 / 清算注销】
          - 背景：【简述，如：集团重组/中国业务收缩/合资方退出】

          一、变更类事项（按适用勾选）：
          1. 股权转让：
             - 是否涉及负面清单行业的外资比例限制
             - 转让定价与税务（非居民企业股权转让所得预提税10%/税收协定优惠、7号公告间接转让审查）
             - 流程：内部决议 → 转让协议 → 市场监管变更 → 外汇变更登记 → 税务申报
          2. 增资/减资：
             - 减资的债权人通知与公告程序（新《公司法》第224条）
             - 外汇资金流出入路径
          3. 信息报告义务：变更后20个工作日内的外商投资信息变更报告

          二、清算注销全流程：
          1. 解散决议与清算组备案（董事为清算义务人）
          2. 债权人通知（10日）与公告（45日申报期）
          3. 员工安置方案（经济补偿金N计算、社保停缴）
          4. 税务注销（清税证明——通常为耗时最长环节，含税务清算审计）
          5. 外汇注销登记与剩余财产汇出（完税凭证要求）
          6. 海关/社保/银行账户注销
          7. 市场监管注销登记
          8. 时间预估与常见卡点（税务遗留问题/账册不全/员工争议）

          输出变更/注销流程图 + 文件清单 + 风险提示。

- id: "00000000-0000-0000-0000-000000000c12"
  name: "发行上市法律意见书与律师工作报告"
  description: "Draft legal opinion and lawyer's work report framework for IPO"
  category: "capital_markets"
  steps:
    - name: "Search IPO legal opinion rules"
      description: "Search for securities practice rules and listing requirements"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate legal opinion framework"
      description: "Generate IPO legal opinion and lawyer's work report framework"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请起草【A股IPO法律意见书/律师工作报告】框架：

          项目信息：
          - 发行人：【XX股份有限公司】，板块：【XX】
          - 【上传尽调底稿或关键事实摘要】

          按证券法律业务执业规则和板块审核要求，逐项展开以下意见点（每项含：核查程序→核查依据→事实描述→意见结论的标准措辞）：

          1. 发行人本次发行上市的批准与授权
          2. 发行人本次发行上市的主体资格
          3. 本次发行上市的实质条件（逐条对照《证券法》《注册管理办法》及板块上市规则）
          4. 发行人的设立与历史沿革
          5. 发起人/股东（实际控制人认定及36个月稳定性、股东穿透核查）
          6. 发行人的股本及演变
          7. 发行人的业务（业务资质、境外经营、主营业务变更）
          8. 关联交易及同业竞争（关联方认定、必要性与公允性、解决措施承诺）
          9. 发行人的主要财产
          10. 发行人的重大债权债务
          11. 发行人重大资产变化及收购兼并
          12. 公司章程的制定与修改
          13. 股东大会、董事会议事规则及规范运作
          14. 董事、监事、高级管理人员及其变化（任职资格、重大违法核查）
          15. 税务（依法纳税、税收优惠合法性）
          16. 环境保护、产品质量、技术等标准
          17. 诉讼、仲裁或行政处罚（重大性认定）
          18. 结论性意见

          要求：区分"法律意见书"（结论）与"律师工作报告"（核查过程详述）的写法差异；对存在瑕疵的事项给出保留意见的措辞方案。

- id: "00000000-0000-0000-0000-000000000c13"
  name: "股权激励方案设计"
  description: "Design an equity incentive plan with tool selection, holding structure, and tax optimization"
  category: "equity_incentive"
  steps:
    - name: "Search equity incentive rules"
      description: "Search for equity incentive and deferred tax rules"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate incentive plan design"
      description: "Generate equity incentive plan design proposal"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请为以下企业设计股权激励方案：

          企业信息：
          - 公司阶段：【初创/成长期（X轮融资后）/ Pre-IPO / 已上市】
          - 激励对象：【核心高管XX人/骨干员工XX人/外部顾问】
          - 可用激励股权池：【XX%，来源：创始人转让/增发】
          - 商业目标：【绑定核心团队/上市前规范/替代部分现金薪酬】

          方案设计内容：

          1. 激励工具选择（对比分析）：
             | 工具 | 期权 | 限制性股权 | 直接持股 | 虚拟股/分红权 |
             - 激励效果、出资要求、税务时点、退出灵活性、上市衔接

          2. 持股架构：
             - 有限合伙持股平台（GP由创始人控制）vs. 直接持股 vs. 代持（风险提示）
             - 平台注册地选择与税务（经营所得 vs. 财产转让所得的适用争议）
             - 多平台分层设计（高管平台/员工平台）

          3. 核心机制设计：
             - 授予定价（公允价值折扣、增资 vs. 转让来源的税务差异）
             - 成熟（Vesting）安排：期限/里程碑/业绩条件，加速成熟触发事件
             - 行权与出资安排
             - 退出与回购：善意离职/恶意离职/退休/身故的差异化回购定价，回购主体与资金来源
             - 调整机制：融资稀释、股份变动时的调整公式

          4. 税务优化：
             - 非上市公司递延纳税备案（财税〔2016〕101号）适用条件
             - 行权/转让环节的个税测算
             - 股份支付对报表的影响提示

          5. 上市衔接：
             - 闭环原则与股东穿透核查要求
             - 上市前员工持股计划的锁定期
             - 期权在申报前的处理（行权/终止）

          输出方案建议书 + 工具对比矩阵 + 关键条款参数表。

- id: "00000000-0000-0000-0000-000000000c14"
  name: "股权激励文件包起草与行权/退出处理"
  description: "Draft equity incentive document package or handle exercise/exit matters"
