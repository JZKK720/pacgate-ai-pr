- id: "00000000-0000-0000-0000-000000000b28"
  name: "刑事案件评估与辩护策略"
  description: "Assess a criminal case and develop a defense strategy across elements, defense direction, and sentencing prediction"
  category: "criminal_defense"
  steps:
    - name: "Search criminal law basis"
      description: "Search for applicable criminal law provisions and sentencing guidelines"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate criminal assessment"
      description: "Generate a criminal case assessment and defense strategy memo"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请对以下刑事案件进行初步评估并制定辩护策略：

          案件信息：
          - 涉嫌罪名：【XX罪，涉嫌《刑法》第XX条】
          - 案件阶段：【立案侦查/逮捕后/审查起诉/一审/二审】
          - 当事人情况：【身份/职业/羁押状态（拘留/逮捕/取保）/前科情况】
          - 案件事实概述：【简述指控事实与当事人陈述的版本差异】
          - 涉案金额/后果：【XX万元/伤害后果等】
          - 已知证据情况：【口供/书证/证人/鉴定等，如已阅卷可上传摘要】

          评估框架：

          1. 构成要件对照分析：
             - 逐要件分析（主体/主观方面/客体/客观方面）指控罪名是否成立
             - 此罪与彼罪的辨析（如：诈骗 vs. 民事合同纠纷、职务侵占 vs. 挪用资金、非法吸收公众存款 vs. 合法民间借贷）
             - 罪与非罪的核心争议点

          2. 辩护方向选择（评估各方向的空间与依据）：
             - 无罪辩护：事实不清/证据不足/行为不构成犯罪/正当事由
             - 罪轻辩护：定性之争（更轻罪名）/数额认定/地位作用（主从犯）/未遂中止
             - 量刑辩护：法定与酌定从宽情节盘点（自首/坦白/立功/退赃退赔/初犯/认罪认罚）
             - 程序辩护：管辖/超期羁押/非法证据线索

          3. 量刑预测：对照量刑指导意见和本地量刑细则，给出量刑区间预测（含缓刑可能性评估）

          4. 阶段性行动计划：当前阶段最紧迫的3件事（会见/取保申请/证据保全/退赃安排）

          5. 风险告知要点：向家属/当事人说明的预期管理与执业边界

          输出案件评估备忘录（注意措辞：基于现有材料的初步分析）。

- id: "00000000-0000-0000-0000-000000000b29"
  name: "侦查阶段辩护（会见/取保/羁押必要性审查）"
  description: "Support defense work during investigation including meeting outline, bail application, and detention necessity review"
  category: "criminal_defense"
  steps:
    - name: "Search criminal procedure basis"
      description: "Search for applicable criminal procedure provisions"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate investigation-stage defense"
      description: "Generate investigation-stage defense documents and meeting outline"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请为侦查阶段的辩护工作提供支持：

          案件信息：
          - 涉嫌罪名与办案机关：【XX罪，XX公安分局/监委】
          - 强制措施与期限：【拘留第X日/已逮捕/指定居所监视居住】
          - 需要的工作：【首次会见准备/取保候审申请/羁押必要性审查/侦查阶段律师意见】

          一、首次会见提纲：
          1. 权利告知清单（如实供述与认罪认罚制度、辩护人权利、对讯问程序的注意事项）
          2. 事实核实问题清单（按涉嫌罪名的构成要件设计，开放式提问）
          3. 程序信息收集（讯问次数与方式、是否存在刑讯逼供/疲劳审讯线索、已签署文件）
          4. 执业红线提醒（不得传递案情给同案人员、不得教唆翻供、通讯工具管理）

          二、取保候审申请书起草：
          1. 社会危险性逐项反驳（《刑事诉讼法》第81条情形逐一论证不具备）
          2. 从宽情节与人身危险性论证（初犯/固定住所职业/家庭羁绊/自愿退赃）
          3. 保证方式（保证人/保证金）与配套承诺
          4. 企业经营者的特殊论证（羁押对企业经营的影响——少捕慎诉慎押政策）

          三、羁押必要性审查申请（逮捕后）：
          - 申请时机与受理机关、新情况新证据的组织（赔偿谅解/退赃/疾病证明）

          四、侦查阶段律师意见书：
          - 向办案机关提交不构成犯罪/不应逮捕法律意见的时机与结构

          输出所需文书 + 会见提纲 + 风险提示。

- id: "00000000-0000-0000-0000-000000000b2a"
  name: "审查起诉阶段与认罪认罚"
  description: "Support defense during review-for-prosecution including file review, non-prosecution, and plea leniency negotiation"
  category: "criminal_defense"
  steps:
    - name: "Search criminal procedure basis"
      description: "Search for applicable criminal procedure and plea leniency provisions"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate prosecution-stage defense"
      description: "Generate evidence review opinion and plea leniency analysis"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请为审查起诉阶段的辩护工作提供支持：

          案件信息：
          - 罪名与移送情况：【XX罪，已移送XX检察院审查起诉】
          - 阅卷情况：【已阅卷（可上传卷宗摘要）/待阅卷】
          - 当事人态度：【认罪/不认罪/部分认罪】

          一、阅卷与证据审查：
          1. 阅卷清单与卷宗结构梳理（诉讼文书卷/证据卷）
          2. 证据审查框架：
             - 逐份证据三性审查，重点：口供取证合法性（与讯问录音录像比对）、鉴定意见的资质与程序、电子数据完整性
             - 证据链分析：指控事实的每个构成要件是否有证据支撑、证据间矛盾点
             - 非法证据排除线索的固定
          3. 有利证据挖掘与补充侦查建议

          二、不起诉争取（如有空间）：
          - 法定不起诉/酌定不起诉（情节轻微）/存疑不起诉的论证路径
          - 检察听证的申请与准备
          - 刑事和解（适用范围）与赔偿谅解的落地

          三、认罪认罚从宽（如选择）：
          1. 量刑协商策略：量刑建议的谈判空间（幅度刑 vs. 确定刑）、与自首坦白退赃的叠加计算
          2. 具结书签署注意事项（辩护人在场、当事人反悔的后果）
          3. 认罪认罚后的上诉问题（检察院抗诉风险）
          4. 利弊分析框架：帮当事人对比认罪认罚 vs. 无罪辩护的预期结果

          输出证据审查意见 + 检察阶段法律意见书 + 认罪认罚利弊分析。

- id: "00000000-0000-0000-0000-000000000b2b"
  name: "庭审辩护（质证/辩护词/非法证据排除）"
  description: "Prepare criminal trial defense including cross-examination, examination outline, illegal evidence exclusion, and defense speech"
  category: "criminal_defense"
  steps:
    - name: "Read case materials"
      description: "Read indictment, evidence list, and file summary"
      tool: "read_document"
      parameters: {}

    - name: "Generate trial defense"
      description: "Generate cross-examination opinions, examination outline, and defense speech"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请为刑事庭审辩护准备以下工作：

          案件信息：
          - 案号与罪名：【XX】
          - 辩护方向：【无罪/罪轻/量刑辩护】
          - 【上传起诉书、证据清单、阅卷摘要】

          一、质证意见（逐组证据）：
          - 每组证据的质证维度：真实性/合法性/关联性 + 证明力
          - 重点攻击点：取证程序瑕疵、鉴定意见的方法与资质、言词证据的前后矛盾、间接证据链的断点
          - 质证语言规范（简明、直指争议焦点）

          二、发问提纲：
          - 对被告人的发问（引出有利事实、澄清口供语境）
          - 对证人/鉴定人/侦查人员的发问设计（出庭申请与发问策略）

          三、非法证据排除申请（如有线索）：
          1. 启动条件与申请时机（庭前会议优先）
          2. 线索与材料的提供要求（时间/地点/方式/人员）
          3. 排除范围主张（重复性供述的排除规则）
          4. 对检方证明取证合法性的应对（申请当庭播放讯问录像）

          四、辩护词起草：
          1. 结构：辩护意见总述 → 事实与证据之辩（对应质证成果）→ 法律适用之辩（构成要件/此罪彼罪）→ 量刑之辩（情节逐项论证）→ 结论
          2. 无罪辩护版与罪轻辩护版的不同写法（主张无罪时量刑意见的表述技巧与骑墙风险提示）
          3. 两个版本：口头辩护提纲（庭上用）+ 书面辩护词（庭后提交）

          输出质证意见 + 发问提纲 + 辩护词（指明版本）。

- id: "00000000-0000-0000-0000-000000000b2c"
  name: "涉案企业刑事风险与合规整改专项"
  description: "Develop a criminal risk response plan for implicated enterprises including unit crime, asset handling, and compliance rectification"
  category: "criminal_defense"
  steps:
    - name: "Search compliance and criminal rules"
      description: "Search for applicable criminal and compliance rectification provisions"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate enterprise risk plan"
      description: "Generate a criminal risk response and compliance rectification plan"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请为涉刑企业/企业家提供刑事风险处置方案：

          案件信息：
          - 涉案主体：【企业单位犯罪/企业家个人/两者均涉】
          - 涉嫌罪名：【如：虚开增值税专用发票/单位行贿/串通投标/非法吸收公众存款/污染环境/侵犯商业秘密】
          - 企业现状：【正常经营/账户被冻结/核心人员被羁押】

          处置方案：

          1. 单位犯罪与个人犯罪的界分：
             - 单位意志的认定（决策程序/利益归属）
             - 直接负责的主管人员与其他直接责任人员的范围切割
             - 辩护利益冲突审查（企业与个人是否需分别委托律师）

          2. 涉案财物处置应对：
             - 查封扣押冻结的合法性审查（超范围查扣的异议路径）
             - 合法财产与涉案财产的甄别申请（经营账户解冻的争取）
             - 案外人（股东/合作方）财产权利的救济

          3. 追赃挽损与退赃退赔策略：
             - 退赃时机与量刑影响的测算
             - 退赔资金来源的合规安排
             - 与被害人和解/谅解的谈判

          4. 企业合规整改衔接（涉案企业合规改革）：
             - 合规不起诉/合规从宽的适用条件评估
             - 专项合规整改方案框架（针对涉嫌罪名的制度重建）
             - 第三方监督评估机制的配合要点

          5. 经营连续性保障：
             - 关键人员羁押期间的公司治理安排（授权/代行机制）
             - 上下游与金融机构的沟通口径
             - 资质/招投标资格受影响的评估（行贿犯罪档案查询的影响）

          输出刑事风险处置方案 + 涉案财物异议文书 + 合规整改方案框架。

- id: "00000000-0000-0000-0000-000000000b2d"
