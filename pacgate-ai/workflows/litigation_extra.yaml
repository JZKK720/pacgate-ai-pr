# Litigation extra workflows
# Derived from: 诉讼律师实用Prompts指南.md
# Covers templates NOT already present in litigation.yaml (49 workflows).
# IDs: 00000000-0000-0000-0000-000000000b01 .. 00000000-0000-0000-0000-000000000b31

- id: "00000000-0000-0000-0000-000000000b01"
  name: "案件初步评估"
  description: "Comprehensive initial case assessment with facts, claims, jurisdiction, parties, and risk matrix"
  category: "litigation"
  steps:
    - name: "Search legal basis"
      description: "Search for applicable causes of action and legal authority"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate assessment"
      description: "Generate initial case assessment report"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请基于以下案件材料，进行全面的案件初步评估：

          【上传/粘贴：起诉状、合同文本、往来函件、已有证据清单等】

          评估框架：
          1. 案件事实梳理：
             - 按时间线整理关键事实
             - 识别核心争议焦点（不超过3-5个）
             - 标注事实争议 vs. 法律争议

          2. 请求权基础分析：
             - 列出所有可能的请求权基础（违约/侵权/不当得利/缔约过失/无因管理等）
             - 各请求权的构成要件逐一分析
             - 请求权竞合时的选择策略（哪个更有利于当事人）
             - 诉讼时效审查

          3. 管辖分析：
             - 级别管辖（基层/中级/高级法院）
             - 地域管辖（合同履行地/被告住所地/不动产所在地等）
             - 协议管辖条款的有效性审查
             - 是否存在主管问题（仲裁 vs. 诉讼）

          4. 当事人分析：
             - 原告/被告主体资格
             - 是否需要追加当事人（必要共同诉讼/第三人）
             - 诉讼地位选择（本诉/反诉/第三人撤销之诉）

          5. 风险评估矩阵：
             - 每个争议焦点的胜诉概率（高/中/低）
             - 判决金额预估范围
             - 执行可行性预判
             - 时间与成本预估

          6. 策略建议：
             - 起诉/应诉的总体策略方向
             - 是否建议先行调解/谈判
             - 是否需要申请财产保全/证据保全
             - 需要补充收集的证据清单

          输出格式：案件评估报告（Word文档），含风险评估矩阵表和时间线图。

- id: "00000000-0000-0000-0000-000000000b02"
  name: "代理意见/代理词起草"
  description: "Draft a structured agency opinion/advocacy brief organized by issue with evidence and legal authority"
  category: "litigation"
  steps:
    - name: "Search supporting precedents"
      description: "Search for supporting legal rules and similar-case reasoning"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate advocacy brief"
      description: "Generate a structured agency opinion/advocacy brief"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请基于以下案件材料和庭审情况，起草一份代理词：

          案件信息：
          - 案号：【XX】
          - 当事人：【我方当事人】
          - 案由：【如：买卖合同纠纷】
          - 我方身份：【原告/被告】
          - 庭审日期：【XX】

          【上传/粘贴：起诉状、答辩状、证据清单、庭审笔录要点、相关法律条文】

          代理词结构：
          1. 开头：
             - 致法院称呼
             - 简述代理人身份和授权范围

          2. 事实概述（简明扼要）：
             - 一段话概括案件核心事实
             - 点明核心争议焦点

          3. 代理意见（分点论述，每点为一个争议焦点）：
             每个争议焦点的论述结构：
             a. 我方观点（结论先行）
             b. 事实依据（引用证据，如"见证据X第X页"）
             c. 法律依据（引用法条+司法解释+指导性案例裁判规则）
             d. 对方观点的驳斥
             e. 小结

          4. 结论：
             - 重申诉讼请求
             - 请求法院支持

          5. 补充意见（如有）：
             - 庭审中对方新提出观点的回应
             - 庭后补充提交的证据说明

          代理词要求：
          - 论证逻辑严密，层次分明
          - 法条引用准确（民法典/司法解释/部门法）
          - 类案参考（引用指导性案例或典型案例裁判规则）
          - 语言规范、专业、有力
          - 篇幅控制在【3000-5000字】

          请使用华宇元典数据库检索支持我方观点的类案裁判规则。
          输出为Word文档。

- id: "00000000-0000-0000-0000-000000000b03"
  name: "证据清单编制"
  description: "Compile a complete evidence list grouped by proof purpose with admissibility and probative analysis"
  category: "litigation"
  steps:
    - name: "Read evidence documents"
      description: "Read evidence materials for the case"
      tool: "read_document"
      parameters: {}

    - name: "Generate evidence list"
      description: "Generate a complete evidence list with probative analysis"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请基于以下案件材料，编制一份完整的证据清单：

          案件信息：
          - 案由：【如：建设工程施工合同纠纷】
          - 我方身份：【原告/被告】
          - 诉讼请求：【简述】

          【上传/粘贴：所有已有证据材料目录】

          证据清单要求：

          1. 按证明目的分组编排：
             第一组：主体资格证据
             第二组：合同关系成立证据
             第三组：合同履行证据
             第四组：违约事实证据
             第五组：损失证据
             第六组：【其他】

          2. 每项证据包含：
             | 序号 | 证据名称 | 证据形式（原件/复印件/电子数据） | 证明目的 | 证明对象 | 页码/出处 | 备注 |

          3. 证据形式合规性审查：
             - 原件 vs. 复印件的举证要求
             - 电子数据的存证要求（区块链存证/公证/时间戳）
             - 域外证据的公证认证要求
             - 外文证据的翻译要求

          4. 证明力分析：
             - 直接证据 vs. 间接证据
             - 本证 vs. 反证
             - 每项证据的证明力强弱预判
             - 证据链条的完整性评估

          5. 证据薄弱点与补强建议：
             - 哪些事实缺乏充分证据
             - 建议补充收集的证据
             - 是否需要申请法院调查收集证据
             - 是否需要申请鉴定/勘验

          输出为表格（docx文档），含证据清单和证明力分析。

- id: "00000000-0000-0000-0000-000000000b04"
  name: "证据质证意见"
  description: "Draft cross-examination opinions on each opposing evidence item across authenticity, legality, relevance, and probative value"
  category: "litigation"
  steps:
    - name: "Read opposing evidence"
      description: "Read the opposing party's evidence list and materials"
      tool: "read_document"
      parameters: {}

    - name: "Generate cross-examination opinions"
      description: "Generate itemized cross-examination opinions"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请基于以下对方提交的证据清单和证据材料，起草质证意见：

          【上传/粘贴：对方证据清单及证据材料】

          质证框架（对每项证据逐一质证）：

          每项证据的质证维度：
          1. 真实性：
             - 原件/复印件核对情况
             - 电子数据的真实性（存证方式、哈希值校验）
             - 是否申请鉴定真伪
             质证意见：认可真实性 / 不认可真实性 / 真实性无法确认

          2. 合法性：
             - 证据取得方式是否合法
             - 是否侵犯他人合法权益（如偷录偷拍）
             - 是否违反法律禁止性规定
             质证意见：认可合法性 / 不认可合法性

          3. 关联性：
             - 与本案争议焦点的关联程度
             - 证明对象的范围
             质证意见：认可关联性 / 不认可关联性（说明理由）

          4. 证明力：
             - 证据的证明力大小
             - 是否存在矛盾或瑕疵
             - 与其他证据的印证关系
             质证意见：证明力强 / 证明力弱 / 无证明力

          5. 综合质证意见：
             - 对该证据的总体意见（认可 / 部分认可 / 不认可）
             - 不认可的具体理由
             - 需要进一步说明的事项

          输出格式：逐项证据质证意见表 + 综合质证意见
          输出为Word文档。

- id: "00000000-0000-0000-0000-000000000b05"
  name: "电子证据审查"
  description: "Review legality and probative value of electronic evidence with authenticity, legality, and relevance analysis"
  category: "litigation"
  steps:
    - name: "Search electronic evidence rules"
      description: "Search legal basis for electronic evidence admissibility"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate electronic evidence review"
      description: "Generate electronic evidence review report"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请审查以下电子证据的合法性和证明力：

          电子证据信息：
          - 证据类型：【微信聊天记录 / 电子邮件 / 短信 / 区块链存证 / 网页截图 / 系统日志】
          - 取证方式：【公证 / 区块链存证平台 / 截屏 / 原始设备展示】
          - 证据内容概述：【简述】

          审查维度：

          1. 真实性审查：
             - 电子数据的生成、存储、传输环节是否可靠
             - 是否经过篡改（哈希值校验/数字签名验证）
             - 存证平台的资质和可信度
             - 公证保全的规范性（《电子数据公证保管规范》）

          2. 合法性审查：
             - 取证主体是否合法
             - 取证过程是否侵犯他人合法权益
             - 是否属于非法证据排除情形
             - 参照《最高人民法院关于民事诉讼证据的若干规定》第90-94条

          3. 关联性审查：
             - 电子数据与待证事实的关联性
             - 数据内容是否完整（有无断章取义）

          4. 证明力评估：
             - 电子数据单独定案的可能性
             - 是否需要其他证据补强
             - 与其他证据的印证关系

          5. 质证/举证建议：
             - 如为我方证据：如何最大化证明力
             - 如为对方证据：质证攻击点
             - 是否需要申请司法鉴定

          请引用《民事诉讼法》第66条、最高院《关于民事诉讼证据的若干规定》相关条文、
          《人民法院在线诉讼规则》关于电子证据的规定。
          使用华宇元典数据库检索相关案例。

- id: "00000000-0000-0000-0000-000000000b06"
  name: "司法鉴定申请书"
  description: "Draft a judicial appraisal application with necessity argument and risk contingency analysis"
  category: "litigation"
  steps:
    - name: "Search appraisal rules"
      description: "Search legal basis for judicial appraisal applications"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate appraisal application"
      description: "Generate a judicial appraisal application"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请基于以下案件情况，起草一份司法鉴定申请书：

          鉴定事项：【如：对XX合同上"XX"签名的真实性进行鉴定 / 对XX工程造价进行鉴定 / 对XX电子数据的形成时间进行鉴定】

          申请背景：
          - 案号：【XX】
          - 申请方：【原告/被告】
          - 鉴定对象：【简述】
          - 申请鉴定的理由：【如：对方提交的合同签名疑似伪造 / 工程量存在重大争议】

          申请书结构：
          1. 申请人与被申请人信息
          2. 鉴定事项（明确、具体）
          3. 鉴定目的（与待证事实的关联性）
          4. 申请鉴定的理由：
             - 案件涉及专门性问题
             - 该问题对裁判结果有实质性影响
             - 除鉴定外无法通过其他方式查明
          5. 鉴定材料清单：
             - 拟提交鉴定的检材
             - 拟提交鉴定的样本
             - 材料来源说明
          6. 拟选择的鉴定机构（如适用）
          7. 鉴定费用承担承诺

          同时请分析：
          - 鉴定的必要性论证（防止法院以"无必要"驳回）
          - 鉴定可能的结果及各结果对我方的影响
          - 鉴定不成（无法得出结论）的风险预案

          引用《民事诉讼法》第79条、最高院《关于民事诉讼证据的若干规定》第30-42条。
          输出为Word文档。

- id: "00000000-0000-0000-0000-000000000b07"
  name: "类案检索报告"
  description: "Search similar cases and produce a retrieval report with adjudication rules and implications for the case"
  category: "litigation"
  steps:
    - name: "Search similar cases"
      description: "Search for similar cases and adjudication rules"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate retrieval report"
      description: "Generate a similar-case retrieval report"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请就以下案件进行类案检索并出具检索报告：

          案件信息：
          - 案由：【如：股权转让纠纷中的对赌协议效力】
          - 核心法律问题：【如：投资方与目标公司（而非股东）签订的对赌协议，目标公司未完成减资程序时，投资方能否主张回购】
          - 我方立场：【投资方/目标公司/原股东】

          检索要求：

          1. 检索范围：
             - 最高人民法院指导性案例
             - 最高人民法院公报案例
             - 最高人民法院裁判文书
             - 高级人民法院典型案例
             - 近3年同类案件裁判趋势

          2. 检索维度：
             - 按"对赌协议效力""目标公司回购""减资程序"等关键词
             - 按案由"股权转让纠纷""合同纠纷"
             - 按法院层级（最高院→高院→中院）

          3. 检索结果分析：
             | 案号 | 审理法院 | 裁判要旨 | 裁判结果 | 与本案的相似点 | 对我方的影响 |

          4. 裁判规则归纳：
             - 主流裁判观点（多数法院的裁判倾向）
             - 少数/分歧观点
             - 裁判规则的演变趋势
             - 影响裁判结果的关键因素

          5. 对本案的启示：
             - 类案对我方主张的支持度
             - 对方可能援引的不利类案
             - 区分本案与不利类案的策略

          使用华宇元典法律数据库进行检索。
          输出为类案检索报告（Word文档），附裁判文书原文链接。

- id: "00000000-0000-0000-0000-000000000b08"
  name: "法律适用分析"
  description: "Deep legal application analysis of a statute including text, legislative intent, judicial interpretation, and case application"
  category: "litigation"
  steps:
    - name: "Search legal authority"
      description: "Search statutes, judicial interpretations, and cases"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate legal analysis"
      description: "Generate a legal application analysis memo"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请就以下法律问题进行深度的法律适用分析：

          法律问题：【如：民法典第580条"不能实现合同目的"的认定标准——在持续性供货合同中，部分迟延履行是否构成合同目的不能实现】

          分析框架：
          1. 法条文本分析：
             - 法条原文及文义解释
             - 构成要件拆解
             - 法律后果

          2. 立法背景与目的解释：
             - 立法沿革（从原《合同法》第94条到《民法典》第563条、580条的变化）
             - 立法目的

          3. 司法解释：
             - 最高院相关司法解释条文
             - 理解与适用中的权威解读

          4. 裁判规则：
             - 最高院在类似案件中的裁判口径
             - 各地高院的裁判倾向差异
             - 典型案例的裁判要旨

          5. 学理观点：
             - 主流学说
             - 争议观点
             - 比较法参考（如适用）

          6. 本案适用分析：
             - 将法律规则适用于本案事实
             - 预判法院可能的裁判方向
             - 我方主张的法律依据和论证策略
             - 对方可能的反驳及我方应对

          请使用华宇元典数据库检索法条、司法解释和案例。
          输出为法律分析备忘录。

- id: "00000000-0000-0000-0000-000000000b09"
  name: "裁判文书分析"
  description: "Analyze a judgment document to extract adjudication rules and assess its value and quality for the case"
  category: "litigation"
  steps:
    - name: "Read judgment document"
      description: "Read the judgment document for analysis"
      tool: "read_document"
      parameters: {}

    - name: "Generate judgment analysis"
      description: "Generate a judgment document analysis report"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请分析以下裁判文书，提炼对本案有价值的裁判规则：

          【上传/粘贴裁判文书全文】

          分析框架：
          1. 案件基本信息：
             - 案号、审理法院、裁判日期
             - 当事人信息（类型化处理，隐去真实名称）
             - 案由

          2. 争议焦点：
             - 法院归纳的争议焦点
             - 与本案争议焦点的对应关系

          3. 裁判要旨：
             - 法院的核心裁判观点（逐条提炼）
             - 法律适用逻辑
             - 关键说理段落

          4. 裁判规则提炼：
             - 从该案中可以提炼的裁判规则
             - 该规则的适用条件
             - 该规则的适用限制

          5. 对本案的价值：
             - 支持我方主张的裁判观点
             - 不支持我方主张的裁判观点
             - 如何区分/援引该案

          6. 裁判文书质量评估：
             - 说理是否充分
             - 法律适用是否准确
             - 是否存在同案不同判的情况
             - 是否具有上诉/再审的价值（如为不利判决）

          请使用华宇元典数据库交叉验证该案的效力状态（是否被再审改判）。
          输出为裁判文书分析报告。

- id: "00000000-0000-0000-0000-000000000b0a"
  name: "法律法规时效性审查"
  description: "Review the currency and accuracy of applicable laws and judicial interpretations with replacement suggestions"
  category: "litigation"
  steps:
    - name: "Search current legal validity"
      description: "Search current validity of each cited law and interpretation"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate validity review"
      description: "Generate a legal validity review table"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请审查以下案件中适用的法律法规的时效性和准确性：

          案件适用法规清单：
          【列出本案拟引用的所有法律法规、司法解释】

          审查维度：
          1. 法律法规时效性：
             - 是否已被废止或修改
             - 是否被新法取代
             - 施行日期与案件事实发生时间的关系（法的溯及力问题）
             - 过渡期条款的适用

          2. 司法解释时效性：
             - 现行有效版本确认
             - 是否有新的司法解释出台
             - 旧司法解释与新司法解释的衔接

          3. 地方性法规/规章：
             - 适用范围确认
             - 与上位法的一致性

          4. 引用准确性：
             - 法条编号是否正确（注意民法典施行后的条文编号变化）
             - 法条内容是否准确
             - 是否存在引用已失效条文的错误

          5. 替代法规建议：
             - 如发现已失效法规，提供现行有效的替代法规
             - 新旧法规的内容差异分析

          特别提醒：
          - 《民法典》施行后，原《合同法》《物权法》《侵权责任法》等已废止
          - 注意最高院陆续出台的民法典各编司法解释
          - 注意2023年修订的《民事诉讼法》条文变化

          使用华宇元典数据库核实每条法规的现行有效性。
          输出为法规时效性审查表。

- id: "00000000-0000-0000-0000-000000000b0b"
  name: "庭审方案"
  description: "Prepare a comprehensive trial plan covering goals, issues, evidence, examination, debate, and settlement strategy"
  category: "litigation"
  steps:
    - name: "Read case materials"
      description: "Read pleadings, evidence lists, and advocacy drafts"
      tool: "read_document"
      parameters: {}

    - name: "Generate trial plan"
      description: "Generate a comprehensive trial plan"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请基于以下案件材料，制定一份庭审方案：

          案件信息：
          - 案号：【XX】
          - 案由：【XX纠纷】
          - 我方身份：【原告/被告】
          - 庭审日期：【XX】
          - 审理程序：【一审普通程序/简易程序/二审】

          【上传/粘贴：起诉状、答辩状、证据清单、对方证据清单、已提交的代理意见草稿】

          庭审方案结构：

          1. 庭审目标：
             - 核心目标（如：说服法院支持全部诉请 / 说服法院驳回对方诉请）
             - 底线目标（如：至少争取到部分诉请支持 / 减少赔偿金额）

          2. 争议焦点预判：
             - 法院可能归纳的争议焦点（2-5个）
             - 每个争议焦点的我方核心观点
             - 每个争议焦点的对方可能观点

          3. 举证质证方案：
             - 我方证据出示顺序和重点强调
             - 对方证据的质证要点（逐项）
             - 可能的补充证据（庭后提交）

          4. 法庭调查阶段发言要点：
             - 事实补充陈述要点
             - 对对方事实陈述的回应

          5. 法庭辩论提纲：
             第一轮辩论：
             - 核心观点陈述（控制在5-10分钟）
             - 法律依据和类案参考

             第二轮辩论：
             - 针对对方观点的反驳
             - 补充强调关键论点

             第三轮（如有）：
             - 总结性发言

          6. 可能的法庭提问及应对：
             - 法官可能提出的问题（预判5-10个）
             - 每个问题的应对要点

          7. 调解/和解策略：
             - 是否愿意调解
             - 调解的底线条件
             - 调解的谈判策略

          8. 庭审后行动计划：
             - 代理词提交期限和要点
             - 补充证据收集计划
             - 与客户沟通计划

          输出为Word文档，庭审当日携带使用。

- id: "00000000-0000-0000-0000-000000000b0c"
  name: "交叉询问/发问提纲"
  description: "Prepare a court examination outline for opposing parties, witnesses, and own witnesses with follow-up strategy"
  category: "litigation"
  steps:
    - name: "Read case materials"
      description: "Read case facts and evidence for examination design"
      tool: "read_document"
      parameters: {}

    - name: "Generate examination outline"
      description: "Generate a court examination outline"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请基于以下案件情况，准备法庭发问提纲：

          案件信息：【简述案件核心事实和争议】
          需要发问的对象：
          1. 对方当事人
          2. 对方证人（如适用）
          3. 我方证人（引导性发问）

          发问提纲要求：

          一、对对方当事人的发问：
          每个问题的设计原则：
          - 问题目的（确认事实/暴露矛盾/引导承认不利事实/限制抗辩空间）
          - 预期回答（对方可能的回答：有利/不利/回避）
          - 追问策略（根据不同回答的后续追问）

          问题清单（按目的分组）：
          A组：确认对我方有利的事实
          - Q1: 【问题】
            - 目的：【确认XX事实】
            - 预期回答：【对方可能承认/否认】
            - 追问：【如否认，追问"那您如何解释证据X中的XX内容？"】

          B组：暴露对方陈述的矛盾
          - Q: 【问题】
            - 目的：【揭示对方在XX问题上的前后矛盾】
            - 追问策略：【引用对方先前陈述或证据】

          C组：限制对方抗辩空间
          - Q: 【问题】
            - 目的：【让对方承认某个前提，限制其后续抗辩】
            - 封闭式问题设计（是/否回答）

          二、对对方证人的发问：
          - 质疑证人可信度的问题
          - 质疑证言真实性的问题
          - 暴露证言矛盾的问题

          三、对我方证人的引导性发问：
          - 帮助证人清晰陈述有利事实
          - 预先解释可能被对方质疑的问题

          发问技巧提醒：
          - 避免诱导性提问（对方证人）
          - 避免复合问题
          - 准备好异议应对（对方律师可能提出异议）

          输出为Word文档。

- id: "00000000-0000-0000-0000-000000000b0d"
  name: "庭审笔录要点预判"
  description: "Predict key matters to be recorded at trial including admissions, new evidence, judge questions, and deadlines"
  category: "litigation"
  steps:
    - name: "Read case materials"
