- id: "00000000-0000-0000-0000-000000000b2f"
  name: "损失计算模型"
  description: "Build a loss calculation model covering direct, indirect, penalty adjustment, and interest computation"
  category: "litigation"
  steps:
    - name: "Search loss calculation rules"
      description: "Search for applicable loss and damages calculation provisions"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate loss calculation"
      description: "Generate a loss calculation model and memo"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请基于以下案件情况，建立损失计算模型：

          案件信息：
          - 损失类型：【合同违约损失/侵权损失/股权投资损失等】
          - 计算基准：【合同约定/法定标准/实际损失】

          计算模型：

          1. 直接损失：
             - 已付未得部分：【金额 + 计算依据】
             - 财产毁损/灭失：【金额 + 评估依据】
             - 必要费用支出：【如：公证费、鉴定费、差旅费】

          2. 间接损失（可得利益损失）：
             - 计算方法：
               a. 对比法（合同履行后的预期利润 vs. 合同未履行的实际状态）
               b. 行业利润率法（参照同行业平均利润率）
               c. 约定计算法（合同约定的违约金/损失计算方式）
             - 可预见性规则的适用（《民法典》第584条）
             - 减损义务的审查（《民法典》第591条）
             - 损益相抵规则（《民法典》第592条）

          3. 违约金调整分析（如适用）：
             - 约定违约金是否过高（超过实际损失30%）
             - 约定违约金是否过低
             - 调整请求的策略

          4. 利息计算：
             - 法定利息：LPR的倍数（如1倍LPR/4倍LPR）
             - 约定利息/违约金
             - 计算起止日期
             - 复利计算（如约定）

          5. 损失汇总表：
             | 损失项目 | 金额（元） | 计算依据 | 证据支撑 | 备注 |

          6. 诉讼请求金额确定：
             - 本金/直接损失
             - 间接损失
             - 利息/违约金（计算至某一日 + 继续计算至付清之日）
             - 诉讼费/保全费/担保费
             - 律师费（如合同约定由败诉方承担）

          输出：损失计算明细表（Excel）+ 计算说明备忘录

- id: "00000000-0000-0000-0000-000000000b30"
  name: "庭审模拟"
