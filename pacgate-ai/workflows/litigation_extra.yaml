          请预判本案庭审中需要重点关注的记录事项：

          案件信息：【简述】

          需要法庭记录的关键内容清单：
          1. 对方当庭自认的事实（需要确认法官记录在案）
             - 预判对方可能在庭审中自认的事实
             - 自认后的法律效果（免除了我方举证责任）

          2. 对方变更或补充的诉讼请求/答辩意见
             - 是否超出举证期限
             - 是否需要答辩期

          3. 对方提交的新证据
             - 是否属于逾期举证
             - 是否属于"新证据"
             - 我方是否需要质证准备期

          4. 法官庭审中的发问
             - 法官关注的重点问题（反映裁判倾向）
             - 法官要求补充查明的事实

          5. 庭审中我方的关键陈述
             - 确保重要观点被准确记录
             - 庭后核对笔录的要点清单

          6. 调解环节的记录
             - 调解方案的内容
             - 双方的态度

          7. 庭审程序事项
             - 举证期限截止日
             - 代理词提交期限
             - 下次开庭时间（如适用）

          输出为庭审注意事项清单，供律师庭审中参考。

- id: "00000000-0000-0000-0000-000000000b0e"
  name: "上诉状起草"
  description: "Draft an appeal petition identifying errors in fact-finding, legal application, and procedure with supporting precedents"
  category: "litigation"
  steps:
    - name: "Search supporting precedents"
      description: "Search for similar cases supporting the appeal grounds"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate appeal petition"
      description: "Generate an appeal petition"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请基于以下一审判决，起草一份上诉状：

          【上传/粘贴一审判决书全文】

          上诉信息：
          - 上诉人：【我方当事人】
          - 被上诉人：【对方当事人】
          - 一审法院：【XX法院】
          - 一审判决结果：【简述判项】

          上诉状结构：
          1. 上诉请求：
             - 明确请求撤销/变更一审判决的具体判项
             - 明确请求改判的具体内容（金额/行为/确认）
             - 一审、二审诉讼费承担

          2. 上诉理由（分点论述）：
             每个上诉理由的结构：
             a. 一审裁判的错误：
                - 指出一审判决在事实认定/法律适用/程序方面的具体错误
                - 引用一审判决书的具体段落（第X页第X行）

             b. 正确的认定/适用应当是：
                - 事实认定方面：指出正确的事实认定及证据支撑
                - 法律适用方面：指出正确的法律适用及法条依据
                - 程序方面：指出程序违法及法律后果

             c. 类案支持（如适用）：
                - 引用最高院/上级法院的类案裁判规则

          3. 常见上诉理由分类（请逐一审查是否适用）：
             - 事实认定错误：
               * 认定事实缺乏证据证明
               * 认定事实的主要证据是伪造的
               * 认定事实的主要证据未经质证
               * 对当事人逾期提供的证据未组织质证
               * 遗漏重要事实

             - 法律适用错误：
               * 适用法律错误（法条引用错误/理解错误）
               * 确定民事责任违背当事人约定
               * 违反法律适用规则

             - 程序违法：
               * 审判组织不合法
               * 应当回避的审判人员未回避
               * 剥夺当事人辩论权利
               * 未经传票传唤缺席判决
               * 遗漏必须参加诉讼的当事人

          请使用华宇元典数据库检索支持上诉理由的类案。
          输出为Word文档，注意上诉期限（判决15日/裁定10日）。

- id: "00000000-0000-0000-0000-000000000b0f"
  name: "再审申请审查与起草"
  description: "Review the 13 statutory retrial grounds and draft a retrial application with strategy advice"
  category: "litigation"
  steps:
    - name: "Search retrial precedents"
      description: "Search for similar retrial cases"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate retrial application"
      description: "Generate a retrial grounds review and retrial application"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请基于以下生效判决，审查是否具备申请再审的条件，并起草再审申请书：

          【上传/粘贴生效判决书全文】

          第一步：再审事由审查
          请逐一审查《民事诉讼法》第207条规定的13项再审事由是否成立：

          1. 有新的证据，足以推翻原判决/裁定的
             - 是否存在未提交的关键证据
             - 该证据的发现时间及逾期提交理由

          2. 原判决/裁定认定的基本事实缺乏证据证明的

          3. 原判决/裁定认定事实的主要证据是伪造的

          4. 原判决/裁定认定事实的主要证据未经质证的

          5. 对审理案件需要的主要证据，当事人因客观原因不能自行收集，书面申请法院调查收集，法院未调查收集的

          6. 原判决/裁定适用法律确有错误的

          7. 审判组织的组成不合法的或者依法应当回避的审判人员没有回避的

          8. 无诉讼行为能力人未经法定代理人代为诉讼或者应当参加诉讼的当事人，因不能归责于本人或者其诉讼代理人的事由，未参加诉讼的

          9. 违反法律规定，剥夺当事人辩论权利的

          10. 未经传票传唤，缺席判决的

          11. 原判决/裁定遗漏或者超出诉讼请求的

          12. 据以作出原判决/裁定的法律文书被撤销或者变更的

          13. 审判人员在审理该案件时有贪污受贿，徇私舞弊，枉法裁判行为的

          对每项事由：✅成立 / ❌不成立 / ⚠️需要进一步核实
          给出分析依据。

          第二步：再审策略建议
          - 最有利的再审事由组合（建议选择1-3项最有把握的事由）
          - 再审管辖法院（向上一级法院/原审法院申请）
          - 再审期限审查（6个月内？）
          - 新证据的准备

          第三步：起草再审申请书
          - 再审申请人/被申请人信息
          - 再审请求
          - 再审事由及理由（逐条论述）
          - 新证据清单（如有）

          请使用华宇元典数据库检索相关再审案例。
          输出再审事由审查报告 + 再审申请书（Word文档）。

- id: "00000000-0000-0000-0000-000000000b10"
  name: "再审新证据准备"
  description: "Analyze whether new evidence meets the retrial standard and prepare a submission strategy"
  category: "litigation"
  steps:
    - name: "Search new evidence precedents"
      description: "Search for typical cases on new evidence recognition"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate new evidence analysis"
      description: "Generate a new evidence analysis report"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请协助分析和准备再审申请中的"新证据"：

          案件背景：【简述原审情况和败诉原因】
          拟提交的新证据：【描述新证据的内容和发现经过】

          分析框架：

          1. 新证据的认定标准：
             - 是否符合《民事诉讼法》第207条第1项"新的证据"
             - 参照最高院《关于适用<民事诉讼法>的解释》第387-388条：
               a. 原审庭审结束前已客观存在，庭审结束后新发现的证据
               b. 原审庭审结束前已经发现，但因客观原因无法取得或在规定的期限内不能提供的证据
               c. 原审庭审结束后原作出鉴定意见、勘验笔录者重新鉴定、勘验，推翻原结论的
             - 该证据是否足以推翻原判决

          2. 逾期举证的正当理由：
             - 为何在原审中未提交
             - 是否存在客观障碍
             - 是否存在故意或重大过失

          3. 新证据的证明力分析：
             - 单独能否推翻原判决
             - 与原审证据的综合分析
             - 对方可能的质证意见和应对

          4. 新证据的形式要件：
             - 证据形式合规性（原件/公证/认证等）
             - 证据来源合法性

          5. 提交策略：
             - 与再审申请书一并提交 vs. 申请再审后补充提交
             - 是否需要申请法院调查收集

          请使用华宇元典数据库检索"新证据"认定的典型案例。
          输出新证据分析报告。

- id: "00000000-0000-0000-0000-000000000b11"
  name: "财产保全申请书"
  description: "Draft a property preservation application with necessity, security, and priority analysis"
  category: "litigation"
  steps:
    - name: "Search preservation rules"
      description: "Search legal basis for property preservation"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate preservation application"
      description: "Generate a property preservation application"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请起草一份财产保全申请书：

          保全信息：
          - 申请人：【我方当事人】
          - 被申请人：【对方当事人】
          - 案号/案由：【如：诉前保全/诉中保全，案号XX】
          - 保全请求金额：【XX万元】
          - 拟保全财产：【简述，如：被申请人银行账户/房产/股权】

          申请书结构：
          1. 请求事项：
             - 请求查封/冻结/扣押被申请人价值XX万元的财产
             - 具体财产线索：
               * 财产1：【银行账户、开户行、账号（如已知）】
               * 财产2：【房产地址、不动产权证号（如已知）】
               * 财产3：【股权：公司名称、持股比例】

          2. 事实与理由：
             - 申请人与被申请人之间的纠纷概况
             - 采取财产保全的必要性：
               * 被申请人有转移/隐匿/变卖财产的可能
               * 不采取保全将导致判决难以执行
               * 具体风险信号（如：被申请人近期有大额转账/资产出售/注销公司等行为）
             - 保全财产的价值与诉讼请求的匹配性

          3. 担保情况：
             - 担保方式：【现金担保/保险保函/实物担保/第三人保证】
             - 担保金额：【等于或大于保全金额】
             - 担保财产/保函信息

          4. 保全标的的优先级排序（如有多项财产线索）

          同时请分析：
          - 超标的保全的风险（保全金额不得超过诉讼请求金额）
          - 轮候查封的影响
          - 保全错误的赔偿责任

          输出为Word文档，附担保材料清单。

- id: "00000000-0000-0000-0000-000000000b12"
  name: "强制执行申请书"
  description: "Draft an enforcement application with execution items, asset leads, and special requests"
  category: "litigation"
  steps:
    - name: "Search enforcement rules"
      description: "Search legal basis for enforcement procedures"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate enforcement application"
      description: "Generate an enforcement application"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请基于以下生效法律文书，起草一份强制执行申请书：

          【上传/粘贴生效判决书/调解书/仲裁裁决书】

          执行信息：
          - 申请执行人：【我方当事人】
          - 被执行人：【对方当事人】
          - 执行依据：【判决书/调解书/仲裁裁决书，文号XX】
          - 生效日期：【XX】
          - 申请执行标的：
            1. 金钱给付：【本金XX元 + 利息/违约金（计算至实际付清之日） + 诉讼费XX元】
            2. 行为给付：【如：协助办理股权变更登记/腾退房屋】
            3. 迟延履行金/加倍部分债务利息：【计算依据和金额】

          申请书结构：
          1. 申请执行事项（明确、具体、可执行）
          2. 执行依据概述（判决文号、判项内容、生效情况）
          3. 被执行人未履行情况说明
          4. 被执行人财产线索：
             - 银行账户
             - 不动产
             - 车辆
             - 股权/投资收益
             - 应收账款/到期债权
             - 知识产权
             - 其他财产性权益

          5. 申请执行的特殊请求（如适用）：
             - 限制高消费
             - 纳入失信被执行人名单
             - 限制出境
             - 搜查令申请

          同时请分析：
          - 申请执行期限（2年，是否在期限内）
          - 迟延履行期间债务利息的计算方式
          - 执行不能的风险预案
          - 参与分配（如被执行人有多方债权人）的策略

          引用《民事诉讼法》第243-264条执行程序相关规定。
          输出为Word文档。

- id: "00000000-0000-0000-0000-000000000b13"
  name: "执行异议与复议"
  description: "Draft an enforcement objection application with legal basis and remedy path analysis"
  category: "litigation"
  steps:
    - name: "Search objection rules"
      description: "Search legal basis for enforcement objections and review"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate objection application"
      description: "Generate an enforcement objection application"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请基于以下情况，起草一份执行异议申请书：

          异议背景：
          - 执行案号：【XX】
          - 异议人：【我方当事人：案外人/被执行人/利害关系人】
          - 异议类型：【执行行为异议 / 案外人异议 / 参与分配异议】
          - 执行法院：【XX】
          - 执行行为：【简述，如：查封了异议人的房产/拍卖程序违法/分配方案不合理】

          异议申请书结构：

          1. 异议请求：
             - 明确请求法院撤销/变更/中止的具体执行行为
             - 如为案外人异议：请求中止对XX标的的执行，确认异议人对XX财产享有所有权/其他足以排除执行的权利

          2. 事实与理由：
             - 执行行为的违法性分析（执行行为异议）：
               * 违反法定程序的具体表现
               * 超标的查封/扣押
               * 查封案外人财产
               * 评估/拍卖程序违法

             - 排除执行的权利基础（案外人异议）：
               * 异议人对执行标的享有的实体权利（所有权/用益物权/担保物权/租赁权等）
               * 该权利是否足以排除执行
               * 参照《最高院关于人民法院办理执行异议和复议案件若干问题的规定》相关条款
                 （如第28条一般买受人排除执行的条件、第29条消费者购房人排除执行的条件等）

          3. 证据清单：
             - 证明异议人权利的证据
             - 证明执行行为违法的证据

          4. 法律依据：
             - 《民事诉讼法》第232条（执行行为异议）/第234条（案外人异议）
             - 相关司法解释

          同时请分析：
          - 异议审查期间是否停止执行（一般不停止，但可申请中止）
          - 异议被驳回后的救济路径（向上一级法院申请复议 / 提起案外人执行异议之诉）
          - 异议成功率预判

          输出为Word文档。

- id: "00000000-0000-0000-0000-000000000b14"
  name: "执行不能应对方案"
  description: "Develop a response plan when the judgment debtor has no executable assets, covering enforcement, added parties, and recovery actions"
  category: "litigation"
  steps:
    - name: "Search enforcement remedies"
      description: "Search legal basis for enforcement remedies and recovery actions"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate response plan"
      description: "Generate an enforcement-failure response plan"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          本案判决生效后进入执行程序，但被执行人无可供执行财产，请协助制定应对方案：

          案件信息：
          - 执行标的：【XX万元】
          - 被执行人：【公司/个人】
          - 已穷尽的执行措施：【简述，如：已查封银行账户（余额不足）、已查封房产（轮候查封/有抵押）】
          - 法院态度：【拟终结本次执行程序】

          应对方案：

          1. 终本前争取的执行措施：
             - 申请法院采取的措施清单：
               * 限制高消费
               * 纳入失信被执行人名单
               * 限制出境
               * 罚款/拘留
               * 搜查令
               * 审计令（要求被执行人提交财务报告）
             - 申请法院调查令，律师持令调查：
               * 银行流水（查找转移财产线索）
               * 不动产交易记录
               * 股权变更记录

          2. 追加被执行人：
             - 追加股东（未实缴出资/抽逃出资/一人公司财产混同）
             - 追加合伙人/分支机构/总公司
             - 追加担保人
             - 追加被挂靠方
             - 分析追加的法律依据和证据要求

          3. 撤销权诉讼（《民法典》第538-542条）：
             - 是否发现被执行人无偿转让/低价处分财产
             - 撤销权诉讼的管辖、时效、举证
             - 撤销权诉讼与执行的衔接

          4. 代位权诉讼（《民法典》第535-537条）：
             - 是否存在被执行人对第三人的到期债权
             - 代位权诉讼的条件和策略

          5. 破产申请：
             - 被执行人为企业时，申请其破产清算/重整
             - 通过破产程序发现隐匿财产
             - 破产撤销权（追溯1年内的不当处分行为）

          6. 刑事追诉（如适用）：
             - 拒不执行判决、裁定罪（《刑法》第313条）
             - 合同诈骗罪/职务侵占罪（如涉及）
             - 移送公安的时机和策略

          7. 终本后的监控：
             - 定期查询被执行人财产状况
             - 发现财产后申请恢复执行
             - 终本后的5年时效管理

          请联网搜索被执行人公开信息（工商变更、新增诉讼、资产拍卖等）。
          输出执行应对方案。

- id: "00000000-0000-0000-0000-000000000b15"
  name: "公司控制权争夺"
  description: "Develop a corporate control contest litigation strategy across shareholder, governance, equity, and damages levels"
  category: "litigation"
  steps:
    - name: "Search control contest precedents"
      description: "Search for typical corporate control dispute cases"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate control strategy"
      description: "Generate a corporate control contest litigation strategy"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请基于以下公司情况，制定公司控制权争夺的诉讼策略：

          公司信息：
          - 公司名称：【XX】
          - 股权结构：【A持股60%，B持股40%】
          - 核心争议：【如：B试图夺取控制权/法定代表人变更/公章证照争夺】
          - 我方当事人：【A/B/公司】

          策略分析框架：

          1. 控制权争夺路径分析：
             a. 股东会/董事会层面：
                - 召集权争夺（谁有权召集临时股东会）
                - 表决权争夺（表决权委托/一致行动协议/代理投票）
                - 决议效力之诉（确认无效/撤销/不成立）

             b. 公司治理层面：
                - 法定代表人变更之诉
                - 董事/监事变更之诉
                - 公章证照返还之诉
                - 公司证照补办策略

             c. 股权层面：
                - 股权确认之诉（代持关系确认/否认）
                - 股权转让效力之诉
                - 股东资格确认/否认之诉
                - 股东除名（未出资/抽逃出资）

             d. 损害赔偿层面：
                - 损害公司利益责任之诉（董监高违信义务）
                - 股东代表诉讼
                - 关联交易损害责任之诉

          2. 诉讼组合策略：
             - 主攻诉讼：【核心诉讼请求】
             - 配套诉讼：【辅助诉讼，制造谈判筹码】
             - 保全策略：【财产保全/证据保全/行为保全】
             - 行政举报/投诉（如涉及工商、税务、证券监管）

          3. 关键法律问题：
             - 公司法（2024年修订）相关条款适用
             - 公司章程的特殊约定审查
             - 股东协议/投资协议中的特殊条款

          4. 谈判与诉讼的配合：
             - 诉讼作为谈判杠杆的策略
             - 和解的时机和条件
             - 控制权过渡方案

          请使用华宇元典数据库检索公司控制权纠纷的典型案例。
          输出诉讼策略方案。

- id: "00000000-0000-0000-0000-000000000b16"
  name: "证券虚假陈述责任纠纷"
  description: "Analyze securities misrepresentation liability including materiality, causation, responsible parties, and loss calculation"
  category: "litigation"
  steps:
    - name: "Search securities precedents"
      description: "Search for latest securities misrepresentation cases"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate securities analysis"
      description: "Generate a securities misrepresentation litigation analysis"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请基于以下证券虚假陈述案件情况，进行诉讼分析：

          案件信息：
          - 上市公司：【XX】
          - 虚假陈述行为类型：【虚假记载/误导性陈述/重大遗漏/不正当披露】
          - 虚假陈述实施日：【XX】
          - 虚假陈述揭露日/更正日：【XX】
          - 我方当事人：【投资者/上市公司/董监高/中介机构】
          - 投资损失：【XX万元】

          分析框架：

          1. 虚假陈述行为的认定：
             - 是否具有"重大性"（参照《证券法》第80条/81条重大事件标准）
             - 虚假陈述行为的类型分析
             - 实施日、揭露日/更正日的认定
             - 参照《最高院关于审理证券市场虚假陈述侵权民事赔偿案件的若干规定》（2022年）

          2. 因果关系分析：
             - 交易因果关系（投资者是否因虚假陈述而买入/卖出）
               * 推定因果关系成立的条件
               * 被告的免责抗辩（投资者明知/内幕交易/操纵市场等）
             - 损失因果关系（投资者损失是否由虚假陈述导致）
               * 系统性风险扣除（大盘下跌因素）
               * 非系统性风险扣除（行业因素/公司自身经营因素）
               * 损失计算方法（移动加权平均法/前30日均价法等）

          3. 责任主体分析：
             - 发行人/上市公司的无过错责任
             - 董监高的过错推定责任（如何举证免责）
             - 控股股东/实际控制人的连带责任
             - 中介机构（券商/律所/会所/评估机构）的过错推定责任
               * 各中介机构的责任边界
               * "看门人"责任的最新司法实践

          4. 损失计算：
             - 基准日及基准价的确定
             - 投资差额损失计算
             - 投资差额损失对应的佣金和印花税

          5. 诉讼策略（根据我方身份）：
             - 投资者方：如何最大化赔偿（示范判决+代表人诉讼）
             - 上市公司/董监高方：如何抗辩（重大性抗辩/因果关系抗辩/免责事由）
             - 中介机构方：如何抗辩（勤勉尽责抗辩/责任范围限制）

          请使用华宇元典数据库检索最新证券虚假陈述案例。
          分析中注意2022年司法解释与2003年规定的区别。
          输出诉讼分析报告。

- id: "00000000-0000-0000-0000-000000000b17"
  name: "建设工程施工合同纠纷"
  description: "Analyze construction contract disputes covering validity, price, priority right, schedule, quality, and appraisal"
  category: "litigation"
  steps:
    - name: "Search construction precedents"
      description: "Search for construction contract dispute cases"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate construction analysis"
      description: "Generate a construction contract dispute litigation analysis"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请基于以下建设工程纠纷情况，进行诉讼分析：

          案件信息：
          - 工程名称：【XX】
          - 合同类型：【施工总承包/专业分包/劳务分包】
          - 合同金额：【XX万元】
          - 争议类型：【工程款拖欠/工程质量/工期延误/工程量争议】
          - 我方身份：【承包人/发包人/实际施工人】
          - 工程状态：【已竣工验收/未完工/已使用未验收】

          分析框架：

          1. 合同效力审查：
             - 是否存在挂靠/违法分包/转包（合同无效情形）
             - 是否必须招标而未招标（合同无效）
             - 中标合同 vs. 阴阳合同的效力冲突（黑白合同问题）
             - 合同无效但工程验收合格的处理（《民法典》第793条/建工司法解释一第24条）

          2. 工程价款争议：
             - 结算依据：合同约定 vs. 签证变更 vs. 司法鉴定
             - "黑白合同"结算依据的认定（建工司法解释一第2条）
             - 固定价合同 vs. 可调价合同的结算差异
             - 未完工工程的价款结算
             - 工程量争议的处理（施工日志/签证/监理记录）

          3. 工程价款优先受偿权：
             - 优先受偿权的主体（承包人/实际施工人能否主张）
             - 优先受偿权的范围（工程款本金 vs. 利息/违约金/利润）
             - 优先受偿权的期限（18个月，自发包人应付之日起算）
             - 优先受偿权与抵押权/购房人权利的顺位

          4. 工期争议：
             - 实际工期 vs. 合同工期
             - 工期顺延的签证与索赔
             - 工期延误的损失计算

          5. 质量争议：
             - 质量缺陷的责任归属
             - 是否需要质量鉴定
             - 修复费用 vs. 减少工程款

          6. 实际施工人特殊保护：
             - 实际施工人向发包人主张权利的条件
             - 发包人在欠付工程款范围内的责任

          7. 司法鉴定策略：
             - 是否需要申请工程造价鉴定
             - 鉴定材料的准备
             - 鉴定异议的提出策略

          请使用华宇元典数据库检索建设工程纠纷案例。
          引用《民法典》建工合同章、《最高院关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）》。
          输出诉讼分析报告。

- id: "00000000-0000-0000-0000-000000000b18"
  name: "破产与重整"
  description: "Analyze bankruptcy and reorganization covering causes, claims, avoidance, administrator duties, and restructuring plans"
  category: "litigation"
  steps:
    - name: "Search bankruptcy precedents"
      description: "Search for bankruptcy cases"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate bankruptcy analysis"
      description: "Generate a bankruptcy legal analysis report"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请基于以下破产案件情况，进行法律分析：

          案件信息：
          - 破产企业：【XX公司】
          - 破产类型：【清算/重整/和解】
          - 我方身份：【债务人/债权人/投资人/管理人】
          - 已知负债：【约XX亿元】
          - 主要资产：【简述】

          分析框架：

          1. 破产原因审查（《企业破产法》第2条）：
             - 不能清偿到期债务
             - 资产不足以清偿全部债务
             - 明显缺乏清偿能力
             - 是否存在"僵局"情况下的重整申请

          2. 申报债权分析：
             - 债权类型梳理（职工债权/税款债权/普通债权/有财产担保债权）
             - 各类债权的清偿顺位
             - 待确定债权/争议债权的处理
             - 未到期债权的加速到期
             - 附条件/附期限债权的处理

          3. 破产撤销权与无效行为：
             - 破产申请前1年内的可撤销行为（无偿转让/非正常价格交易/提前清偿/提供担保/放弃债权）
             - 破产申请前6个月内的偏颇清偿（债务人已具备破产原因，仍对个别债权人进行清偿，《企业破产法》第32条）
             - 破产无效行为（隐匿转移财产/虚构债务/承认不真实债务）
             - 追回财产的诉讼策略

          4. 管理人职责（如我方为管理人）：
             - 接管与调查
             - 债权审查与确认
             - 营业管理决定
             - 财产变价方案
             - 分配方案

          5. 重整方案设计（如适用）：
             - 债务重组方案（债转股/展期/减免/分期）
             - 引入投资人的方案
             - 经营方案
             - 各组债权人的清偿率测算
             - 重整方案的通过策略（分组表决）

          6. 债权人权益保护（如我方为债权人）：
             - 申报债权的策略
             - 债权审查异议
             - 债权人会议的表决策略
             - 担保物的取回/暂停行使担保权
             - 对重整方案的反对与谈判

          7. 关联企业实质合并破产（如适用）：
             - 实质合并的条件
             - 实质合并对各企业债权人的影响

          请使用华宇元典数据库检索破产案例。
          引用《企业破产法》及相关司法解释。
          输出破产法律分析报告。

