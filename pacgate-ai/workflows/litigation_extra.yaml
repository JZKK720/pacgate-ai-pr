          请基于以下案件材料，进行庭审模拟（Moot Court）：

          【上传/粘贴：起诉状、答辩状、证据清单、双方代理意见、相关法条】

          模拟庭审要求：

          1. 法官视角预判：
             - 法官可能归纳的争议焦点（2-5个）
             - 法官对每个争议焦点的倾向性预判
             - 法官可能提出的追问
             - 法官关注的程序问题

          2. 对方律师视角预判：
             - 对方可能的核心论点
             - 对方对我方弱点的攻击点
             - 对方可能提交的新证据
             - 对方的庭审策略（进攻型/防守型）

          3. 我方应对策略：
             - 每个争议焦点的我方最佳论述路径
