          案件背景：
          - 我方债权人：【简述债权来源和金额】
          - 债务人：【简述，如：自然人/离岸公司】
          - 已发现的可疑资产转移行为：【简述，如：债务人将房产无偿转让给配偶/将股权低价转让给关联方/在境外设立信托】
          - 债务人资产分布：【境内/境外，涉及哪些法域】

          资产追踪与诉讼策略：

          1. 资产追踪：
             - 境内资产追踪路径：
               * 银行流水分析（大额转出记录）
               * 不动产交易记录（近期过户记录）
               * 股权变更记录（工商档案）
               * 车辆登记变更
               * 保险/理财产品
               * 第三方支付账户
             - 境外资产追踪路径（如适用）：
               * 离岸公司注册信息（BVI/开曼/塞舌尔）
               * 境外不动产
               * 境外银行账户
               * 信托/基金安排

          2. 可撤销/无效行为分析：
             - 民法典撤销权诉讼（第538-542条）：
               * 无偿行为撤销：举证较易，但1年除斥期间
               * 有偿行为撤销：需证明受让人恶意
               * 撤销权诉讼的管辖与诉讼请求设计
             - 合同无效之诉：
               * 恶意串通损害他人利益（《民法典》第154条）
               * 虚假意思表示（《民法典》第146条）
             - 破产撤销权（如债务人已进入破产程序）
             - 刑事追赃（如涉及合同诈骗/职务侵占/洗钱）

          3. 诉讼方案：
             - 主诉讼：债权人撤销权之诉
               * 原告：债权人
               * 被告：债务人 + 受让人
               * 诉讼请求：撤销转让行为 + 返还财产
               * 管辖：被告住所地法院
             - 配套诉讼/措施：
               * 财产保全（查封已转移的财产）
               * 确认之诉（确认转让合同无效）
               * 代位权诉讼（如债务人怠于向受让人追索）
             - 刑事报案（如构成犯罪）

          4. 跨法域协作（如资产在境外）：
             - 境外法院的辅助取证/资产冻结
             - 跨境判决/裁决的承认与执行
             - 与境外律师的协作框架

          5. 证据收集策略：
             - 申请法院调查令
             - 公证保全
             - 委托专业调查机构
             - 境外证据的公证认证

          请联网搜索债务人公开信息。
          输出资产追踪与诉讼策略方案。

- id: "00000000-0000-0000-0000-000000000b1a"
  name: "境内商事仲裁程序专项"
  description: "Provide procedural strategy for domestic commercial arbitration including clause validity, arbitrator selection, and award risk"
  category: "arbitration"
  steps:
    - name: "Search arbitration rules"
      description: "Search for applicable arbitration rules and procedures"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate arbitration procedure memo"
      description: "Generate an arbitration procedure strategy memo and deadline calendar"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请为以下境内商事仲裁案件提供程序策略支持：

          案件信息：
          - 仲裁机构：【贸仲CIETAC/北仲BAC/上仲/深国仲/当地仲裁委】
          - 我方身份：【申请人/被申请人】
          - 争议类型与金额：【XX纠纷，XX万元】
          - 仲裁条款原文：【粘贴】
          - 案件阶段：【拟提起/已受理/组庭/审理中/裁决后】

          程序支持内容：

          1. 仲裁条款效力审查：
             - 机构约定不明/约定了不存在的机构的效力认定
             - "或裁或审"条款的无效风险与应对
             - 仲裁条款效力异议的提出时机（首次开庭前）与管辖路径（机构决定 vs. 法院确认）

          2. 机构与规则要点（按所选机构）：
             - 适用仲裁规则版本、仲裁费计算、审限
             - 简易程序适用门槛与利弊

          3. 仲裁员选定策略：
             - 名册内候选人的背景研究维度（专业领域/裁判倾向/回避风险）
             - 首席仲裁员的产生方式与共同指定策略
             - 仲裁员披露与回避申请的时机

          4. 程序节点管理：
             - 答辩与反请求期限、证据提交轮次、庭审安排
             - 与诉讼的差异提醒（证据规则更灵活/一裁终局/不公开）

          5. 保全衔接：仲裁中财产/证据/行为保全需经仲裁机构转交法院的流程与时间

          6. 裁决后风险防控：
             - 撤销仲裁裁决的法定事由（《仲裁法》第58条）自查——程序瑕疵预防清单
             - 不予执行抗辩的预判
             - 调解书/和解裁决的选择

          输出程序策略备忘录 + 关键期限日历。

- id: "00000000-0000-0000-0000-000000000b1b"
  name: "海事海商纠纷专项"
  description: "Provide litigation strategy for maritime disputes covering jurisdiction, claims, ship arrest, and limitation of liability"
  category: "litigation"
  steps:
    - name: "Search maritime rules"
      description: "Search for maritime law and precedents"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate maritime strategy"
      description: "Generate a maritime litigation strategy memo and preservation plan"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请为以下海事海商纠纷提供诉讼策略支持：

          案件信息：
          - 纠纷类型：【货损货差/提单纠纷（无单放货等）/船舶碰撞/海难救助/共同海损/船舶买卖建造纠纷/船员劳务/海上保险合同/港口作业】
          - 当事人：【托运人/收货人/承运人/船东/货代/保险人】，我方身份：【XX】
          - 涉案船舶/货物：【船名、航次、货物与金额】
          - 涉外因素：【提单适用法/仲裁条款（伦敦仲裁？）/船旗国/方便旗】

          策略支持内容：

          1. 管辖与程序路径：
             - 海事法院专门管辖（11家海事法院的地域分工）与协议管辖/仲裁条款效力
             - 提单背面并入的外国仲裁条款对收货人的约束力认定
             - 涉外案件的法律适用（《海商法》/《涉外民事关系法律适用法》/国际公约）

          2. 关键请求权与抗辩分析（按纠纷类型）：
             - 货损货差：承运人识别（船东/期租人）、适航义务与免责事由（航海过失免责）、单位责任限制（每件/每公斤SDR标准）
             - 无单放货：正本提单持有人的索赔路径、记名提单的特殊规则
             - 碰撞/救助/共同海损：过失比例认定、救助报酬、理算规则（约克-安特卫普规则）

          3. 船舶扣押与海事请求保全：
             - 可扣押情形（海事请求清单）、姊妹船扣押
             - 扣押申请材料与担保、活扣 vs. 死扣的选择
             - 反担保与错误扣船的赔偿风险

          4. 海事赔偿责任限制：
             - 责任限制主体与可限制债权、丧失限制权利的情形
             - 责任限制基金的设立程序与对扣押的解除效果

          5. 特殊时效提醒：海上货物运输向承运人索赔1年、其他海事请求2年等特殊时效

          6. 证据要点：海事事故调查报告、航海日志、检验报告、气象证明

          输出诉讼策略备忘录 + 保全方案 + 时效与程序节点日历。

- id: "00000000-0000-0000-0000-000000000b1c"
  name: "婚姻家事案件初步评估"
  description: "Initial assessment of a family law case covering claims feasibility, key disputes, and path recommendation"
  category: "family_law"
  steps:
    - name: "Search family law basis"
      description: "Search for applicable family law and inheritance provisions"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate family assessment"
      description: "Generate an initial family law case assessment"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请作为婚姻家事律师，对以下案件进行初步评估：

          【案件概述】：【当事人姓名】与【对方姓名】的婚姻/继承/家事纠纷
          【纠纷类型】：【离婚/继承/抚养权/财产分割/家暴等】
          【婚姻状况】：【结婚年限/是否有婚内协议/是否有子女/子女年龄】
          【财产概况】：【房产数量及位置/车辆/存款/股权/保险/债务】
          【对方态度】：【同意离婚/不同意/有调解意愿/态度强硬】
          【特殊因素】：【涉外因素/军人身份/一方失踪/家暴史/出轨证据】

          请输出：
          1. **案件定性**——纠纷的法律性质与适用的主要法律法规
          2. **诉求可行性分析**——各诉求（离婚/财产分割/抚养权/损害赔偿）的胜诉概率评估
          3. **关键争议点预判**——最可能成为庭审焦点的3-5个问题
          4. **调解vs诉讼路径建议**——基于案件情况推荐最优解决路径
          5. **风险提示**——当事人需特别注意的法律风险（如举证难度、时效、财产隐匿）
          6. **预估周期与成本**——各路径的预估时间与费用

- id: "00000000-0000-0000-0000-000000000b1d"
  name: "离婚协议/调解方案起草"
  description: "Draft a complete divorce agreement or mediation plan covering custody, property division, and debts"
  category: "family_law"
  steps:
    - name: "Search family law basis"
      description: "Search for applicable divorce and property division provisions"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate divorce agreement"
      description: "Generate a complete divorce agreement"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请作为婚姻家事律师，起草以下离婚协议/调解方案：

          【当事人信息】：甲方【姓名/年龄/职业】，乙方【姓名/年龄/职业】
          【子女情况】：【子女姓名/年龄/数量/当前抚养安排】
          【财产清单】：
            - 房产：【地址/购买时间/当前市值/产权登记情况/有无贷款】
            - 车辆：【品牌/购买时间/市值/登记方】
            - 银行存款：【各方账户及金额】
            - 股权/投资：【公司名称/持股比例/估值】
            - 保险：【类型/投保人/被保人/现金价值】
            - 其他财产：【珠宝/收藏品/公积金/养老金等】
          【债务清单】：【房贷/车贷/信用卡/民间借贷/担保债务等及金额】
          【特殊诉求】：【抚养权归属/探望安排/子女抚养费标准/一方损害赔偿/婚前财产界定】

          请输出一份完整的离婚协议，包含以下条款：
          1. **自愿离婚声明**
          2. **子女抚养与探望**（抚养权归属、探望时间频率、抚养费金额及支付方式、教育医疗费用分担）
          3. **夫妻共同财产分割**（逐项列明分割方案、过户/交付时间节点）
          4. **夫妻共同债务处理**（债务归属、偿还安排）
          5. **婚前/个人财产确认**（明确不属于共同财产的范围）
          6. **损害赔偿/经济帮助**（如有）
          7. **违约条款与争议解决**（违约责任、后续争议处理方式）
          8. **其他约定**（户口迁移、姓氏变更、保险受益人变更等）

          注意：
          - 各条款需明确、可执行，避免模糊表述导致后续争议
          - 抚养费标准参考当地生活水平和子女实际需要
          - 财产分割需考虑过户税费和时间成本
          - 如有涉外因素，注明适用法律

- id: "00000000-0000-0000-0000-000000000b1e"
  name: "夫妻共同财产分割方案"
  description: "Design a marital property division plan with characterization, options, tax impact, and execution path"
  category: "family_law"
  steps:
    - name: "Search property division rules"
      description: "Search for applicable marital property division provisions"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate division plan"
      description: "Generate a marital property division plan"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请作为婚姻家事律师，针对以下夫妻财产情况设计财产分割方案：

          【财产总览】：
          | 财产类型 | 名称 | 购买时间 | 当前估值 | 产权登记方 | 是否有贷款 | 婚前/婚后取得 |
          |---------|------|---------|---------|-----------|----------|-------------|
          | 【填入所有财产】 |

          【债务总览】：
          | 债务类型 | 金额 | 借款时间 | 借款方 | 用途 | 是否婚内共同债务 |
          |---------|------|---------|-------|------|---------------|
          | 【填入所有债务】 |

          【争议点】：【对哪些财产/债务的归属有争议？争议理由是什么？】
          【分割偏好】：【一方倾向现金补偿/一方倾向保留实物/双方都争取某项财产】

          请输出：
          1. **财产定性表**——逐项判断：婚前个人财产 / 婚后共同财产 / 混合性质财产（注明定性依据）
          2. **分割方案选项**——提供2-3套不同分割方案（如：实物分割、折价补偿、变价分割），每套方案附优缺点
          3. **推荐方案**——综合公平性、可执行性、税费成本、过户难度，推荐最优方案
          4. **税费影响分析**——各方案涉及的契税、个税、增值税等税费估算
          5. **执行路径**——推荐方案中各财产过户/交付的具体操作步骤和时间节点
          6. **隐匿财产排查建议**——对方可能隐匿的财产类型及排查方法（银行流水、股权代持、海外资产等）

- id: "00000000-0000-0000-0000-000000000b1f"
  name: "遗嘱起草与审查"
  description: "Draft or review a will with legal-requirement review, challenge-risk analysis, and execution advice"
  category: "family_law"
  steps:
    - name: "Search inheritance rules"
      description: "Search for applicable will and inheritance provisions"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate will"
      description: "Generate a will draft and review report"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请作为婚姻家事律师，起草/审查以下遗嘱：

          【立遗嘱人信息】：【姓名/年龄/身份证号/住所/健康状况】
          【家庭情况】：【配偶姓名/子女姓名及年龄/父母是否健在/其他法定继承人】
          【财产清单】：【所有财产的类型、位置、估值、产权情况】
          【分配意愿】：【各继承人/受遗赠人应得财产及比例/特殊照顾某位继承人的理由】
          【特殊安排】：【遗嘱执行人指定/信托安排/条件继承/遗产管理/债务清偿顺序】
          【遗嘱类型】：【自书遗嘱/代书遗嘱/公证遗嘱/打印遗嘱/录音录像遗嘱】

          请输出：
          1. **遗嘱正文**——格式规范、表述明确、条款完整
          2. **法律要件审查**——对照《民法典》第1134-1141条，审查该遗嘱的形式要件是否完备
          3. **潜在争议风险分析**——可能被挑战的点（如：特留份侵害、意思表示不明确、见证人资格问题）
          4. **执行建议**——遗嘱执行的操作路径（公证建议、保管方案、告知时机）
          5. **配套文书建议**——是否需要同时准备遗嘱信托协议、遗产清单附件、律师见证备忘录

          > **注意**：如涉及跨境资产（如海外房产、离岸公司股权），需在遗嘱中注明适用法律，并建议同步起草对应法域的补充遗嘱。

- id: "00000000-0000-0000-0000-000000000b20"
  name: "继承纠纷诉讼策略"
  description: "Develop an inheritance dispute litigation strategy covering relationships, will validity, claims, and evidence"
  category: "family_law"
  steps:
    - name: "Search inheritance precedents"
      description: "Search for applicable inheritance provisions and cases"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate inheritance strategy"
      description: "Generate an inheritance dispute litigation strategy"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请作为婚姻家事律师，对以下继承纠纷案件制定诉讼策略：

          【案件概述】：【被继承人姓名】于【死亡时间】死亡，遗留遗产引发继承纠纷
          【法定继承人】：【第一顺序：配偶/子女/父母；第二顺序：兄弟姐妹/祖父母外祖父母】
          【遗嘱情况】：【有无遗嘱/遗嘱类型/遗嘱主要内容/遗嘱争议点】
          【遗产概况】：【房产/存款/股权/保险/债权/其他财产及估值】
          【争议焦点】：【遗嘱效力/遗产范围界定/继承份额/遗赠vs继承/代位继承/转继承等】
          【对方主张】：【各继承人的诉求及理由】
          【已保全/冻结情况】：【是否有遗产被先行处分/冻结/转移】

          请输出：
          1. **法律关系梳理**——绘制继承关系图谱，明确各继承人地位（法定/遗嘱/代位/转继承）
          2. **遗嘱效力审查**——如有遗嘱，逐条审查形式要件和实质要件
          3. **诉讼请求设计**——我方应提出的具体诉讼请求及法律依据
          4. **举证方案**——需准备的证据清单（死亡证明、亲属关系证明、遗嘱原件、财产凭证、债务凭证）
          5. **对方抗辩预判**——对方最可能提出的抗辩及我方应对
          6. **调解方案**——庭前调解的可接受底线和理想方案
