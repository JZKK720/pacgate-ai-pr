[workspace]
members = [
    "crates/pacgate-core",
    "crates/pacgate-api",
    "crates/pacgate-agent",
    "crates/pacgate-docx",
    "crates/pacgate-llm",
    "crates/pacgate-search",
    "crates/pacgate-rag",
    "crates/pacgate-persona",
    "crates/pacgate-workflow",
    "crates/pacgate-template",
    "crates/pacgate-tenant",
    "crates/pacgate-auth",
    "crates/pacgate-redact",
    "wasm-crates/pacgate-doc-validator",
    "wasm-crates/pacgate-rule-engine",
    "wasm-crates/pacgate-citation-check",
    "wasm-crates/pacgate-clause-parser",
]
resolver = "2"

[workspace.package]
version = "0.1.14"
edition = "2021"
authors = ["Cubecloud Limited / 智方云"]
license = "AGPL-3.0-only"
repository = "https://github.com/pacgate-ai/pacgate-ai"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["full"] }
futures = "0.3"

# HTTP / Web
axum = { version = "0.7", features = ["ws", "macros", "multipart"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
hyper = { version = "1", features = ["full"] }
urlencoding = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# Database
sqlx = { version = "0.7", features = [
    "postgres",
    "runtime-tokio",
    "chrono",
    "uuid",
    "json",
] }

# IDs / time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
ulid = "1"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Crypto / auth
argon2 = { version = "0.5", features = ["password-hash"] }
jsonwebtoken = "9"
rand = "0.8"

# DOCX / ZIP / XML
zip = "2"
quick-xml = { version = "0.36", features = ["serialize"] }
similar = "2"

# WASM (shared for wasm-crates only)
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window"] }

# Embeddings / vectors
hf-hub = "0.3"

# Local NER inference (plan 019 T6; shibing624/bert4ner-base-chinese, Apache-2.0)
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"
tokenizers = "0.21"

# Config / env
config = "0.14"
dotenvy = "0.15"

# Utils
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
unicode-normalization = "0.1"
regex = "1"
once_cell = "1"
async-trait = "0.1"
bytes = "1"
