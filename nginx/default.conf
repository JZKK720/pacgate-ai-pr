server {
    listen 80;
    server_name _;

    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header X-Robots-Tag "noindex, noarchive, nosnippet, noimageindex" always;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    error_page 401 = @login_redirect;

    location = /auth/check {
        internal;
        proxy_pass http://pacgate-auth:3000/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }

    location @login_redirect {
        return 302 /login?next=$request_uri;
    }

    location /login {
        proxy_pass http://pacgate-auth:3000;
    }

    location /logout {
        proxy_pass http://pacgate-auth:3000;
    }

    location ~* \.(drawio|md)$ {
        return 403;
    }

    location / {
        auth_request /auth/check;
        try_files $uri $uri/ =404;
    }
}