name: Build & Push GHCR Images

# Builds and pushes all Pacgate runtime images to GHCR whenever a version tag
# (v0.1.x) is pushed. This keeps both AIPCs in sync from a single source of
# truth and needs no local docker login (uses GITHUB_TOKEN).
#
# Images pushed (client namespace = SOURCE OF TRUTH):
#   ghcr.io/pacgate-ai/pacgate-api:<tag>
#   ghcr.io/pacgate-ai/pacgate-mcp:<tag>
#   ghcr.io/pacgate-ai/deer-flow-pacgate:<tag>
#   ghcr.io/pacgate-ai/deer-flow-frontend-pacgate:<tag>
#
# NAMESPACE: the prefix is PINNED to `pacgate-ai` by the workflow-level
# `GHCR_NAMESPACE` below, and falls back to `github.repository_owner` only if that
# is emptied. `pacgate-ai` is a USER account, not an organization.
#
# TWO ACCOUNTS, TWO ROLES (confirmed by the maintainer):
#   jzkk720    - the upstream / DEVELOPER account, where the project originated
#   pacgate-ai - the CLIENT DELIVERY account; this is what the compose files pin
#
# A release therefore populates BOTH. pacgate-ai is authoritative; jzkk720 gets a
# MIRROR of the same tags so the upstream account stays populated and a developer
# pulling from upstream is not stranded on abandoned 0.1.x tags. See the
# `mirror-upstream` job at the bottom of this file - it is deliberately
# NON-BLOCKING, so a mirror failure never breaks a client release.
#
# WHY PINNED RATHER THAN INFERRED. Deriving the owner from the repo was correct
# by luck and wrong in principle. `secrets.GITHUB_TOKEN` can only push to the
# namespace of the account that runs the workflow, so:
#
#   repo JZKK720/pacgate-ai-pr    -> ghcr.io/jzkk720/*   <- upstream, MIRROR only
#   repo pacgate-ai/pacgate-ai-pr -> ghcr.io/pacgate-ai/* <- SOURCE OF TRUTH
#
# The mirror uses a separate PAT secret (`GHCR_MIRROR_PAT`) because GITHUB_TOKEN
# cannot cross namespaces. That secret belongs in the FORK. If it is absent the
# mirror is skipped with a warning and the client release still succeeds.
#
# IMPORTANT: this prefix MUST match the `image:` pins in
# deploy/client-bundle/compose.prod.yaml and compose.bundle.yaml. If the
# workflow publishes to one namespace and compose pins the other, the client
# install pulls nothing. Use the `namespace` dispatch input to override.
#
# NOTE: to publish to an owner OTHER than pacgate-ai you need a PAT with
# write:packages for that owner; GITHUB_TOKEN cannot cross namespaces. See
# deploy/README-BUILD.md.

env:
  # The single source of truth for where a release publishes. See the NAMESPACE
  # note above before changing it.
  GHCR_NAMESPACE: pacgate-ai
  # The upstream/developer namespace that receives a MIRROR of the same tags.
  # Empty this to disable mirroring entirely.
  GHCR_MIRROR_NAMESPACE: jzkk720

on:
  push:
    tags:
      - "v0.1.*"
      - "v0.2.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to build (e.g. the current release). No default on purpose, so a stale tag cannot be dispatched by accident."
        required: true
      namespace:
        description: "GHCR owner override. Empty = the pinned GHCR_NAMESPACE variable (pacgate-ai). Set only to publish elsewhere deliberately - clients pin ghcr.io/pacgate-ai."
        required: false
        default: ""

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Resolve the effective namespace once, so the tag-push and dispatch paths
      # behave identically and every later step agrees on the prefix.
      #
      # Precedence: explicit dispatch input > committed GHCR_NAMESPACE > repo
      # owner. See the NAMESPACE note at the top for why the pin exists.
      #
      # This step ALSO reports the login ACCOUNT, because a GHCR package is owned
      # by the account named in its path: the username for `ghcr.io/<ns>/...` is
      # `<ns>`, not the actor who triggered the run. It deliberately does NOT
      # handle the password - writing a secret into $GITHUB_OUTPUT and reading it
      # back adds a step to the secret's path for no benefit, when the login step
      # can select it inline.
      - name: Resolve image namespace
        id: ns
        env:
          INPUT_NS: ${{ inputs.namespace }}
          OWNER_NS: ${{ github.repository_owner }}
        run: |
          if [ -n "$INPUT_NS" ]; then
            ns="$INPUT_NS"; src="namespace dispatch input"
          elif [ -n "$GHCR_NAMESPACE" ]; then
            ns="$GHCR_NAMESPACE"; src="committed GHCR_NAMESPACE"
          else
            ns="$OWNER_NS"; src="repo owner (GHCR_NAMESPACE is empty)"
          fi
          echo "prefix=ghcr.io/$ns" >> "$GITHUB_OUTPUT"
          echo "actor=$ns" >> "$GITHUB_OUTPUT"
          echo "Resolved image prefix: ghcr.io/$ns  (from: $src)"
          if [ "$ns" != "pacgate-ai" ]; then
            echo "::warning::Publishing to ghcr.io/$ns, which is NOT the namespace the client compose files pin (ghcr.io/pacgate-ai). Clients will not see this release."
          fi
          # WARN IN ADVANCE when the credential provably cannot reach the target.
          # Only a PAT crosses namespaces; GITHUB_TOKEN is scoped to the repo
          # that issued it. Without this the failure is a bare 403 from whichever
          # build step reaches the registry first, which says nothing about why.
          # Note the automatic token IS reachable when GHCR_CLIENT_PAT is set,
          # so this check is about the fallback only.
          if [ "$ns" != "$OWNER_NS" ] && [ -z "${{ secrets.GHCR_CLIENT_PAT }}" ]; then
            echo "::warning::Publishing to ghcr.io/$ns but no GHCR_CLIENT_PAT is set. GITHUB_TOKEN belongs to '$OWNER_NS' and cannot push into '$ns', so the push WILL be rejected with 403. Add a PAT with write:packages for '$ns' as the repository secret GHCR_CLIENT_PAT, or run this workflow from the '$ns' repository."
          fi

      # Compute the image tag: strip the leading 'v' from release tags so it
      # matches the compose pins (v0.1.3 -> 0.1.3). Manual dispatch uses the
      # input as-is. An empty tag is a hard failure - without this guard the
      # build would produce a malformed `image:` reference and fail obscurely.
      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            ref="${{ github.ref_name }}"
            tag="${ref#v}"
          fi
          if [ -z "$tag" ]; then
            echo "::error::No image tag resolved. Pass the 'tag' input when dispatching manually."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved image tag: $tag"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # `id` is needed so the next step can assert the login actually worked.
      # Login is made non-fatal here so a credential problem produces a clear
      # message instead of a raw registry 403 from whichever build step happens
      # to reach the push first.
      - name: Log in to GHCR
        id: login
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # The resolved namespace IS the GHCR username: packages are owned by a
          # user or org account, so the login account must be that owner. The PAT
          # is optional and used when supplied; on the client-delivery repository
          # GITHUB_TOKEN already owns the pinned namespace, so the fallback is
          # the normal path there.
          username: ${{ steps.ns.outputs.actor || github.actor }}
          password: ${{ secrets.GHCR_CLIENT_PAT || secrets.GITHUB_TOKEN }}

      # A failed login is a HARD stop, not a warning. The alternative - carrying
      # on and skipping the pushes - would produce a green run that published
      # nothing, which is far worse than a red one: every downstream signal
      # (the run badge, the step summary, "CI passed") would say the release
      # shipped. An empty release must never look like a successful one.
      - name: Confirm GHCR login
        if: steps.login.outcome != 'success'
        run: |
          echo "::error::GHCR login failed for the resolved namespace. No images were built or pushed."
          echo "Registry: ghcr.io"
          echo "Account attempted: ${{ steps.ns.outputs.actor || github.actor }}"
          echo "If the namespace differs from this repository's owner, GITHUB_TOKEN cannot be used - add a PAT with write:packages for the target owner as the repository secret GHCR_CLIENT_PAT."
          exit 1

      # ── pacgate-api (Rust) ────────────────────────────────────────────────
      - name: Build & push pacgate-api
        uses: docker/build-push-action@v6
        with:
          context: pacgate-ai
          file: pacgate-ai/Dockerfile
          push: true
          # Baked into the binary so GET /version can report the exact commit the
          # running process was built from. The OCI revision label below is NOT
          # a substitute: a label records what was deployed, and the failure this
          # guards against is the deployed artifact disagreeing with the process
          # actually serving traffic.
          build-args: |
            PAC_SOURCE_REVISION=${{ github.sha }}
          tags: |
            ${{ steps.ns.outputs.prefix }}/pacgate-api:${{ steps.tag.outputs.tag }}
            ${{ steps.ns.outputs.prefix }}/pacgate-api:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}

      # ── pacgate-mcp (Python bridge) ──────────────────────────────────────
      - name: Build & push pacgate-mcp
        uses: docker/build-push-action@v6
        with:
          context: deploy/pacgate-mcp
          file: deploy/pacgate-mcp/Dockerfile
          push: true
          tags: |
            ${{ steps.ns.outputs.prefix }}/pacgate-mcp:${{ steps.tag.outputs.tag }}
            ${{ steps.ns.outputs.prefix }}/pacgate-mcp:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}

      # ── deer-flow-pacgate (backend + adapter) ────────────────────────────
      - name: Build & push deer-flow-pacgate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/deer-flow-pacgate/Dockerfile
          push: true
          tags: |
            ${{ steps.ns.outputs.prefix }}/deer-flow-pacgate:${{ steps.tag.outputs.tag }}
            ${{ steps.ns.outputs.prefix }}/deer-flow-pacgate:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}

      # ── deer-flow-frontend-pacgate (Next.js research UI) ─────────────────
      # Clone the pinned bytedance tag into deploy/deer-flow-src/frontend,
      # then build with the gateway URL baked in.
      - name: Clone deer-flow frontend source
        run: |
          git clone --depth 1 --branch v2.0.0 --filter=blob:none --sparse \
            https://github.com/bytedance/deer-flow.git deploy/deer-flow-src
          git -C deploy/deer-flow-src sparse-checkout set frontend

      - name: Build & push deer-flow-frontend-pacgate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/deer-flow-frontend-pacgate/Dockerfile
          build-args: |
            DEER_FLOW_INTERNAL_GATEWAY_BASE_URL=http://deer-flow:8001
          push: true
          tags: |
            ${{ steps.ns.outputs.prefix }}/deer-flow-frontend-pacgate:${{ steps.tag.outputs.tag }}
            ${{ steps.ns.outputs.prefix }}/deer-flow-frontend-pacgate:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}

      - name: Verify image manifest (anonymous HEAD)
        run: |
          # Two things this step must get right, both learned the hard way:
          #
          # 1. GHCR returns 404 for a manifest request sent WITHOUT an OCI/Docker
          #    Accept header, even when the package is public. Omitting it made
          #    every run of this workflow fail on a completely successful
          #    release (7/7 runs red before this fix).
          # 2. GHCR can take a few seconds to propagate a freshly-pushed manifest
          #    across its registry nodes, so retry with backoff instead of racing.
          PREFIX="${{ steps.ns.outputs.prefix }}"
          TAG="${{ steps.tag.outputs.tag }}"
          ACCEPT="application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json"

          echo "Verifying ghcr.io/${PREFIX#ghcr.io/}/*:$TAG"
          for img in pacgate-api pacgate-mcp deer-flow-pacgate deer-flow-frontend-pacgate; do
            ok=0
            for attempt in 1 2 3 4 5; do
              tok=$(curl -s "https://ghcr.io/token?scope=repository:${PREFIX#ghcr.io/}/${img}:pull" | jq -r .token)
              code=$(curl -s -o /dev/null -w "%{http_code}" \
                -H "Accept: $ACCEPT" \
                -H "Authorization: Bearer $tok" \
                "https://ghcr.io/v2/${PREFIX#ghcr.io/}/${img}/manifests/${TAG}")
              echo "attempt $attempt: ${PREFIX#ghcr.io/}/${img}:${TAG} => HTTP $code"
              if [ "$code" = "200" ]; then ok=1; break; fi
              sleep 10
            done
            if [ "$ok" != "1" ]; then
              # 404 = tag absent in this namespace (likely a namespace mismatch
              # between this workflow and the compose pins, or the tag never
              # reached the registry). 401 = the package is still private.
              echo "::error::${img}:${TAG} is not anonymously pullable (last HTTP $code)."
              echo "If 404: check that the namespace above matches the image pins in"
              echo "deploy/client-bundle/compose.prod.yaml."
              echo "If 401: the package exists but is private - flip it to public in the GHCR UI."
              exit 1
            fi
          done

  # ───────────────────────────────────────────────────────────────────────────
  # Mirror the released tags into the upstream / developer namespace.
  #
  # THREE DESIGN DECISIONS, each deliberate:
  #
  # 1. NON-BLOCKING. `continue-on-error: true` and a conditional `if` mean this
  #    job can never fail the client release. pacgate-ai is the source of truth;
  #    the mirror is a convenience for the upstream account. A release that
  #    reaches clients must not be held hostage to a mirror push.
  #
  # 2. NO REBUILD. It retags the images the build job already pushed, using
  #    buildx with `push: true` and a source of `type=registry`. Rebuilding would
  #    double CI time and produce DIFFERENT digests for identical source (docker
  #    builds are not reproducible), which would make the two namespaces
  #    impossible to compare. Retagging keeps one build and one digest.
  #
  # 3. SEPARATE AUTH. GITHUB_TOKEN is scoped to the repo that runs the workflow
  #    and cannot push to another owner's namespace, so the mirror needs a PAT
  #    (GHCR_MIRROR_PAT, write:packages for jzkk720) stored in THIS repo's
  #    secrets. If the secret is absent, the job is skipped with a warning -
  #    which is why the readiness check is a separate step rather than letting
  #    the login fail.
  mirror-upstream:
    name: Mirror tags to upstream namespace
    needs: build-and-push
    runs-on: ubuntu-latest
    # Skip entirely when no mirror namespace is configured. This also keeps the
    # workflow usable from a fork that has no PAT.
    #
    # `vars`, NOT `env`. A job-level `if:` can only read the github / needs /
    # vars / inputs contexts, and referencing `env` there is a PARSE ERROR - not
    # a runtime failure. That distinction is what made this bug expensive: the
    # whole workflow file was rejected as invalid, so EVERY run died before any
    # job started and `build-and-push` never ran at all. Runs #16, #17 and #18
    # failed with "Invalid workflow file", and the 0.1.14 release produced no
    # images.
    #
    # An expression the CI cannot evaluate silently invalidates the entire
    # pipeline, which is the same class as the earlier bugs where a check
    # reported success because the thing it inspected had gone away. The
    # namespace now lives in a repository VARIABLE so this guard can read it;
    # `vars` resolves to an empty string when unset, which is exactly the
    # skip-when-unconfigured behaviour this line is for.
    #
    # The step-level references below keep using `env` deliberately - there the
    # context IS available, and the workflow-level constant still holds the
    # value.
    if: ${{ vars.GHCR_MIRROR_NAMESPACE != '' }}
    permissions:
      contents: read
    steps:
      - name: Check mirror credentials
        id: creds
        env:
          MIRROR_PAT: ${{ secrets.GHCR_MIRROR_PAT }}
        run: |
          if [ -z "$MIRROR_PAT" ]; then
            echo "::warning::GHCR_MIRROR_PAT is not set - skipping the $GHCR_MIRROR_NAMESPACE mirror."
            echo "The client release in ghcr.io/$GHCR_NAMESPACE is unaffected."
            echo "To enable mirroring, add a PAT with write:packages for $GHCR_MIRROR_NAMESPACE"
            echo "as the repository secret GHCR_MIRROR_PAT."
            echo "have=0" >> "$GITHUB_OUTPUT"
          else
            echo "have=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR for the mirror
        if: steps.creds.outputs.have == '1'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.GHCR_MIRROR_NAMESPACE }}
          password: ${{ secrets.GHCR_MIRROR_PAT }}

      - name: Set up Docker Buildx
        if: steps.creds.outputs.have == '1'
        uses: docker/setup-buildx-action@v3

      # Retag, do not rebuild. See decision 2 above.
      #
      # NOTE: the tag is resolved HERE from the event, not taken from
      # `needs.build-and-push.outputs.tag` - that job declares no outputs, so
      # referencing it would silently resolve to an empty string and the mirror
      # would try to push `:latest`-only tags against a missing tag. Resolving it
      # the same way the build job does keeps the two consistent.
      - name: Retag client images into the upstream namespace
        if: steps.creds.outputs.have == '1'
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          TAG="${TAG#v}"
          if [ -z "$TAG" ]; then
            echo "::warning::Could not resolve a tag for the mirror - skipping."
            exit 0
          fi
          echo "Mirroring $GHCR_NAMESPACE -> $GHCR_MIRROR_NAMESPACE at tag $TAG"
          for img in pacgate-api pacgate-mcp deer-flow-pacgate deer-flow-frontend-pacgate; do
            for suffix in "$TAG" latest; do
              echo "--- $img:$suffix"
              docker buildx imagetools create \
                --tag "ghcr.io/$GHCR_MIRROR_NAMESPACE/$img:$suffix" \
                "ghcr.io/$GHCR_NAMESPACE/$img:$suffix"
            done
          done
          echo "Mirror complete. $GHCR_MIRROR_NAMESPACE now carries the same tags as $GHCR_NAMESPACE."

      - name: Verify the mirror is anonymously pullable
        if: steps.creds.outputs.have == '1'
        run: |
          # Same trap as the main verify step: GHCR returns 404 without an
          # OCI Accept header even for public packages.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          TAG="${TAG#v}"
          ACCEPT="application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json"
          for img in pacgate-api pacgate-mcp deer-flow-pacgate deer-flow-frontend-pacgate; do
            ok=0
            for attempt in 1 2 3 4 5; do
              tok=$(curl -s "https://ghcr.io/token?scope=repository:$GHCR_MIRROR_NAMESPACE/${img}:pull" | jq -r .token)
              code=$(curl -s -o /dev/null -w "%{http_code}" \
                -H "Accept: $ACCEPT" -H "Authorization: Bearer $tok" \
                "https://ghcr.io/v2/$GHCR_MIRROR_NAMESPACE/${img}/manifests/${TAG}")
              if [ "$code" = "200" ]; then ok=1; break; fi
              sleep 10
            done
            if [ "$ok" != "1" ]; then
              # Non-blocking by design, but loud: a private mirror package is a
              # real problem for anyone pulling from upstream, and it is the
              # failure that has no other symptom.
              echo "::warning::$GHCR_MIRROR_NAMESPACE/${img}:${TAG} is not anonymously pullable (last HTTP $code)."
              echo "If 401: the mirrored package defaults to PRIVATE and must be flipped to public in the GHCR UI."
            fi
          done

      - name: Mirror summary
        if: always()
        run: |
          if [ "${{ steps.creds.outputs.have }}" = "1" ]; then
            echo "### GHCR mirror" >> "$GITHUB_STEP_SUMMARY"
            echo "Published to \`ghcr.io/$GHCR_NAMESPACE\` (source of truth) and mirrored to \`ghcr.io/$GHCR_MIRROR_NAMESPACE\`." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Client compose files pin \`ghcr.io/$GHCR_NAMESPACE\`. The mirror exists so the upstream" >> "$GITHUB_STEP_SUMMARY"
            echo "developer account stays populated - nothing automated pulls from it." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### GHCR mirror skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "\`GHCR_MIRROR_PAT\` is not set, so \`ghcr.io/$GHCR_MIRROR_NAMESPACE\` was not updated." >> "$GITHUB_STEP_SUMMARY"
            echo "The client release in \`ghcr.io/$GHCR_NAMESPACE\` succeeded and is unaffected." >> "$GITHUB_STEP_SUMMARY"
          fi
