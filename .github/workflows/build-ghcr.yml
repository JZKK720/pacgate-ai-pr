name: Build & Push GHCR Images

# Builds and pushes all Pacgate runtime images to GHCR whenever a version tag
# (v0.1.x) is pushed. This keeps both AIPCs in sync from a single source of
# truth and needs no local docker login (uses GITHUB_TOKEN).
#
# Images pushed:
#   ghcr.io/pacgate-ai/pacgate-api:<tag>
#   ghcr.io/pacgate-ai/pacgate-mcp:<tag>
#   ghcr.io/pacgate-ai/deer-flow-pacgate:<tag>
#   ghcr.io/pacgate-ai/deer-flow-frontend-pacgate:<tag>
#
# The compose files reference ghcr.io/pacgate-ai/* (the repo owner's namespace).
# Because this repo pushes to the `pacgate-ai` org, github.repository_owner is
# `pacgate-ai` and images land under ghcr.io/pacgate-ai/*. See
# deploy/README-BUILD.md for the owner/namespace decision.

on:
  push:
    tags:
      - "v0.1.*"
      - "v0.2.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. 0.1.3)"
        required: true
        default: "0.1.3"

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Compute the image tag: strip the leading 'v' from release tags so it
      # matches the compose pins (v0.1.3 -> 0.1.3). Manual dispatch uses the
      # input as-is.
      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            ref="${{ github.ref_name }}"
            echo "tag=${ref#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── pacgate-api (Rust) ────────────────────────────────────────────────
      - name: Build & push pacgate-api
        uses: docker/build-push-action@v6
        with:
          context: pacgate-ai
          file: pacgate-ai/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/pacgate-api:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}/pacgate-api:latest

      # ── pacgate-mcp (Python bridge) ──────────────────────────────────────
      - name: Build & push pacgate-mcp
        uses: docker/build-push-action@v6
        with:
          context: deploy/pacgate-mcp
          file: deploy/pacgate-mcp/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/pacgate-mcp:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}/pacgate-mcp:latest

      # ── deer-flow-pacgate (backend + adapter) ────────────────────────────
      - name: Build & push deer-flow-pacgate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/deer-flow-pacgate/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/deer-flow-pacgate:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}/deer-flow-pacgate:latest

      # ── deer-flow-frontend-pacgate (Next.js research UI) ─────────────────
      # Clone the pinned bytedance tag into deploy/deer-flow-src/frontend,
      # then build with the gateway URL baked in.
      - name: Clone deer-flow frontend source
        run: |
          git clone --depth 1 --branch v2.0.0 --filter=blob:none --sparse \
            https://github.com/bytedance/deer-flow.git deploy/deer-flow-src
          git -C deploy/deer-flow-src sparse-checkout set frontend

      - name: Build & push deer-flow-frontend-pacgate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/deer-flow-frontend-pacgate/Dockerfile
          build-args: |
            DEER_FLOW_INTERNAL_GATEWAY_BASE_URL=http://deer-flow:8001
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/deer-flow-frontend-pacgate:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}/deer-flow-frontend-pacgate:latest

      - name: Verify image manifest (anonymous HEAD)
        run: |
          # GHCR can take a few seconds to propagate a freshly-pushed manifest
          # across its registry nodes, so retry with backoff instead of racing.
          for img in pacgate-api pacgate-mcp deer-flow-pacgate deer-flow-frontend-pacgate; do
            ok=0
            for attempt in 1 2 3 4 5; do
              tok=$(curl -s "https://ghcr.io/token?scope=repository:${IMAGE_PREFIX#ghcr.io/}/${img}:pull" | jq -r .token)
              code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $tok" \
                "https://ghcr.io/v2/${IMAGE_PREFIX#ghcr.io/}/${img}/manifests/${{ steps.tag.outputs.tag }}")
              echo "attempt $attempt: $img:${{ steps.tag.outputs.tag }} => HTTP $code"
              if [ "$code" = "200" ]; then ok=1; break; fi
              sleep 10
            done
            [ "$ok" = "1" ] || exit 1
          done
