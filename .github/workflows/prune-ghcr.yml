# Prune old GHCR image versions.
#
# WHY THIS RUNS IN ACTIONS AND NOT ON A LAPTOP
# --------------------------------------------
# Deleting a GHCR version needs `delete:packages`. Measured 2026-11-03, no
# credential on the build machine has it:
#   * the machine's git PAT carries `gist, repo, workflow` -> the packages API
#     answers 403;
#   * the registry API cannot delete at all - DELETE /v2/<repo>/manifests/<digest>
#     returns 405 for every credential;
#   * ghcr.io/token?...:delete returns 200 regardless of what the token may do, so
#     a 200 there is not evidence of permission.
#
# The repository's own GITHUB_TOKEN DOES have `packages: write`, and the pinned
# namespace (jzkk720) matches this repo's owner, so the token can act on these
# packages. That is the same guarantee build-ghcr.yml already relies on to publish
# them. Running here also removes the need to hand a delete-capable personal token
# to a workstation.
#
# SAFETY
#   Default is a dry run: the plan is printed to the job summary and nothing is
#   deleted. Deletion requires dispatching with `execute` checked, which the plan
#   step surfaces first. See scripts/prune-ghcr-versions.ps1 for the digest guards
#   (a kept release or `latest` can never be deleted) and
#   scripts/test-prune-ghcr-versions.ps1 for the offline assertions.

name: Prune old GHCR image versions

on:
  workflow_dispatch:
    inputs:
      keep_releases:
        description: "How many of the newest releases to keep (3 = newest + the two before it)."
        required: true
        default: "3"
      execute:
        description: "Actually delete. Leave false to print the plan only."
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  packages: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Probes which packages endpoint this token can actually reach, and prints the
      # answer instead of guessing. GITHUB_TOKEN is installation-scoped: it can use
      # /repos/{owner}/{repo}/packages only for packages LINKED to the repo, and it
      # can never use /user/packages (that path is for a user token). When a package
      # was published before the OCI source label existed, or was never connected in
      # its settings, the link is absent and the repo path answers 404 rather than
      # 403 - which reads like "wrong URL" but means "not associated".
      # continue-on-error: this step is diagnostic output, never the gate.
      - name: Probe package reachability
        continue-on-error: true
        shell: pwsh
        env:
          GHCR_PRUNE_TOKEN: ${{ github.token }}
        run: |
          $h = @{
            Authorization          = "Bearer $env:GHCR_PRUNE_TOKEN"
            Accept                 = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $repo = "${{ github.repository }}"
          $targets = @(
            "https://api.github.com/repos/$repo/packages?package_type=container",
            "https://api.github.com/repos/$repo/packages/container/pacgate-api",
            "https://api.github.com/repos/$repo/packages/container/pacgate-api/versions?per_page=1",
            "https://api.github.com/orgs/JZKK720/packages/container/pacgate-api/versions?per_page=1"
          )
          foreach ($u in $targets) {
            try {
              $r = Invoke-WebRequest -Uri $u -Headers $h -UseBasicParsing -SkipHttpErrorCheck -TimeoutSec 30
              Write-Host ("{0,-95} -> HTTP {1}" -f $u, $r.StatusCode)
              if ($r.StatusCode -eq 200 -and $r.Content.Length -lt 400) {
                Write-Host ("    body: {0}" -f ($r.Content -replace '\s+', ' '))
              }
            }
            catch {
              Write-Host ("{0,-95} -> EXCEPTION {1}" -f $u, $_.Exception.Message)
            }
          }

      - name: Show the plan
        id: plan
        shell: pwsh
        env:
          # `secrets.GITHUB_TOKEN` is not a secret expression on Actions; it errors.
          # The automatic token is exposed to every step as GITHUB_TOKEN, so it is
          # mapped explicitly into the variable the script reads.
          GHCR_PRUNE_TOKEN: ${{ github.token }}
        run: |
          # GITHUB_TOKEN reaches packages only through the repo-scoped path, so the
          # /user form a personal token uses is not available here.
          $base = "https://api.github.com/repos/${{ github.repository }}/packages/container"
          ./scripts/prune-ghcr-versions.ps1 `
            -KeepReleases ${{ inputs.keep_releases }} `
            -ApiBase $base

      - name: Prune
        if: ${{ inputs.execute }}
        shell: pwsh
        env:
          GHCR_PRUNE_TOKEN: ${{ github.token }}
        run: |
          $base = "https://api.github.com/repos/${{ github.repository }}/packages/container"
          # -Force skips the interactive confirmation: in CI the deliberate opt-in
          # is the `execute` input above, and there is no terminal to type into.
          ./scripts/prune-ghcr-versions.ps1 `
            -KeepReleases ${{ inputs.keep_releases }} `
            -ApiBase $base `
            -Execute -Force

      - name: Explain a dry run
        if: ${{ !inputs.execute }}
        run: |
          echo "DRY RUN - nothing was deleted." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Re-run this workflow with \`execute\` checked to apply the plan above." >> "$GITHUB_STEP_SUMMARY"
