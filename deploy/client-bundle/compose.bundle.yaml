# Pacgate-ai bundle — single compose project for the full client runtime.
#
# Combines pacgate-api (metadata), deer-flow (research) + frontend, pacgate-mcp,
# OpenViking, Postgres, and nginx into ONE named compose project so they can be
# started/stopped together as `pacgate-ai-bundle`. QM (co-working workspace) runs
# SEPARATELY via `qm up` from deploy/qm-pacgate/ (its own lifecycle) — see
# setup-qm.ps1.
#
# Usage (from deploy/client-bundle/):
#   docker compose -f compose.bundle.yaml up -d
#   docker compose -f compose.bundle.yaml ps
#   docker compose -f compose.bundle.yaml down
#
# This file uses the SHARED environment variables from .env (same as compose.prod.yaml).

# Pin the Compose project name (same hazard as compose.prod.yaml: without it the
# project derives from the directory name and a second checkout shares this
# stack's named volumes). Found by the v0.1.25 clean-clone proof. Do NOT remove.
name: pacgate-ai-bundle

services:
  pacgate-db:
    image: pgvector/pgvector:pg16
    container_name: pacgate-db
    environment:
      POSTGRES_DB: pacgate
      POSTGRES_USER: pacgate
      POSTGRES_PASSWORD: ${PACGATE_DB_PASSWORD}
    volumes:
      - pacgate-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  pacgate-api:
    image: ghcr.io/jzkk720/pacgate-api:0.1.25
    container_name: pacgate-api
    depends_on: [pacgate-db]
    # Memory ceiling as defence in depth behind the in-process admission bound
    # (SANITIZE_MAX_CONCURRENT in state.rs). A sanitize job holds a 393 MiB NER
    # detector set (measured 2026-09-27) and 2 run concurrently; 4 GiB covers
    # that plus the ~1.3 GiB baseline and OCR/DB headroom. Mirrors
    # compose.prod.yaml - both files define this service, so both need it.
    mem_limit: 4g
    environment:
      DATABASE_URL: postgres://pacgate:${PACGATE_DB_PASSWORD}@pacgate-db:5432/pacgate
      DATA_DIR: /data/tenants
      # Self-registration gate. CLOSED on the client stack. Mirrors
      # compose.prod.yaml - both files define this service, so both need it, or
      # the file that is not running will silently diverge.
      # See deploy/DEFECT-pacgate-api-open-registration.md.
      PACGATE_ALLOW_REGISTRATION: "false"
      PACGATE_JWT_SECRET: ${PACGATE_JWT_SECRET}
      PACGATE_DEFAULT_TENANT: ${PACGATE_TENANT_ID:-default-firm}
      # NER weights are baked into the image at /app/models/ner (SHA-256 verified
      # at build time). This is what turns person/organisation-name detection ON:
      # unset means Tier-1 rules only, 5 of 15 classes instead of 8, with the
      # install still looking healthy. Gate: scripts/test-ner-enabled.ps1.
      # Must match the Dockerfile COPY target exactly - set-but-missing is fatal.
      PACGATE_NER_MODEL_DIR: /app/models/ner
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # Plan 019/021: the extraction lane (cached per document version, fail-closed).
      OCR_SERVICE_URL: http://ocr-service:8100
      # The firm's legal workflow library. WITHOUT THIS the API silently serves
      # only its 10 built-in Rust definitions: workflows.rs takes the
      # `unwrap_or_else(list_workflows)` branch when workflows_dir is None.
      # Measured 10 -> 222 with it set. Mirrors compose.prod.yaml.
      # See deploy/DEFECT-workflow-mount-wrong-service.md.
      WORKFLOWS_DIR: /app/workflows
      # Workflow tier model tags. These live here, not in the Rust source, because
      # the roster is a property of the machine and the repo cannot observe it.
      # While they were compiled in, `origin/main` and each AIPC disagreed as soon
      # as either changed -- and a tag no local Ollama serves returns HTTP 404 with
      # no fallback, so one stale pin failed every workflow at once.
      #
      # Keep these three in sync with deploy/client-bundle/ollama-models.txt (the
      # pre-pull list) and with `ModelConfig::DEFAULT_*_TAG` in pacgate-core.
      # scripts/test-model-roster-consistency.ps1 enforces that.
      PACGATE_MODEL_MAIN: ${PACGATE_MODEL_MAIN:-gemma4:12b-it-qat}
      PACGATE_MODEL_MID: ${PACGATE_MODEL_MID:-qwen3.8:27b-mtp-q4_K_M}
      PACGATE_MODEL_LOW: ${PACGATE_MODEL_LOW:-gemma4:12b-it-qat}
      RUST_LOG: info
    # Load ALL secrets from .env so pacgate-search's default_router() can read
    # the connector API keys (YUANDIAN_API_KEY, PKULAW_API_KEY, QCC_API_KEY,
    # FYOPEN_API_KEY, COURT_LISTENER_API_KEY, VAQUILL_API_KEY, ANSVAR_API_KEY,
    # OPENCORPORATES_API_KEY). Without these, every external legal connector
    # reports available=false and search returns only free sources.
    env_file:
      - .env
    volumes:
      - ./data:/data
      # The firm's 222-workflow library (46 categories, bilingual). Mounted read
      # -only so the operator can add workflows without rebuilding the image.
      - ./workflows:/app/workflows:ro
    restart: unless-stopped

  deer-flow:
    image: ghcr.io/jzkk720/deer-flow-pacgate:0.1.25
    container_name: deer-flow
    depends_on: [pacgate-api, openviking, pacgate-mcp]
    environment:
      PACGATE_API_URL: http://pacgate-api:8080
      PACGATE_TENANT_ID: ${PACGATE_TENANT_ID:-default-firm}
      PACGATE_JWT_TOKEN: ${PACGATE_JWT_TOKEN}
      PACGATE_API_EMAIL: ${PACGATE_API_EMAIL}
      PACGATE_API_PASSWORD: ${PACGATE_API_PASSWORD}
      PACGATE_MATTER_ID: ${PACGATE_MATTER_ID}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      DEER_FLOW_EXTENSIONS_CONFIG_PATH: /app/deer-flow-extensions-config.json
      # Allow the browser (via the frontend proxy) to call auth routes. The
      # gateway rejects cross-site auth POSTs unless the Origin is same-origin or
      # explicitly allowlisted; the frontend proxies /api/* internally so the
      # browser Origin (:8089/:8090) must be allowlisted here.
      # IMPORTANT: clients access the AIPC via IP/hostname (not localhost), which
      # is NOT in the default list. Set GATEWAY_CORS_ORIGINS in .env to the
      # client's actual access origin (e.g. http://192.168.1.10:8089) or login
      # fails with "Cross-site auth request denied" (403). Comma-separated.
      GATEWAY_CORS_ORIGINS: ${GATEWAY_CORS_ORIGINS:-http://localhost:8089,http://localhost:8090}
      # Pacgate (silent-no-reply fix 2026-10-06): bound the first-exchange title
      # generation so a stalled Ollama cloud read cannot leave the pregel loop
      # frozen mid-run with zero user-visible output (run c2a0ced4 evidence in
      # .env comments). Value comes from .env: DEERFLOW_TITLE_INVOKE_TIMEOUT_S.
      DEERFLOW_TITLE_INVOKE_TIMEOUT_S: ${DEERFLOW_TITLE_INVOKE_TIMEOUT_S:-8}
    volumes:
      - ./data:/data
      - ./deer-flow-config.yaml:/app/backend/config.yaml:ro
      - ./deer-flow-extensions-config.json:/app/deer-flow-extensions-config.json:ro
      # Pacgate: add a unified generated-outputs listing endpoint
      # (GET /api/threads/{id}/outputs). Mounted so it survives container
      # recreation without rebuilding the image.
      - ./patches/deer-flow-artifacts.py:/app/backend/app/gateway/routers/artifacts.py:ro
      # Pacgate: default multitask_strategy to "interrupt" so a new message
      # during a long agent run cancels the stale run instead of returning
      # 409 Conflict to the user.
      - ./patches/deer-flow-thread-runs.py:/app/backend/app/gateway/routers/thread_runs.py:ro
      # Pacgate: populate extension/modified/original_filename in the upload
      # response and enrich the upload listing with markdown metadata + original
      # filename, so clients can read/analyze converted docs reliably.
      - ./patches/deer-flow-uploads.py:/app/backend/app/gateway/routers/uploads.py:ro
      # Pacgate: gate self-registration (mirrors upstream 2.1.0 auth.local.allow_registration)
      - ./patches/deer-flow-auth.py:/app/backend/app/gateway/routers/auth.py:ro
      - ./patches/deer-flow-auth-errors.py:/app/backend/app/gateway/auth/errors.py:ro
      # Pacgate: require `description` on write_file/str_replace in the agent
      # system prompt, so the model never drops a required arg and loops on
      # "description: Field required".
      - ./patches/deer-flow-prompt.py:/app/backend/packages/harness/deerflow/agents/lead_agent/prompt.py:ro
      # Pacgate: auto-route local vs cloud model by bound tool count. When
      # model_routing.enabled is true and no model is explicitly requested,
      # large tool surfaces (>= tool_count_threshold) route to the cloud model
      # so a 40K-token prompt does not choke the local GPU; small surfaces stay
      # on the local default.
      - ./patches/deer-flow-agent.py:/app/backend/packages/harness/deerflow/agents/lead_agent/agent.py:ro
      # Pacgate 2026-10-07: mirror max_tokens into extra_body for Ollama targets
      # (langchain-openai renames it to max_completion_tokens, which Ollama's
      # /v1 endpoint ignores - background calls then generate to EOS and hog
      # the single runner slot while chat runs queue behind them).
      - ./patches/deer-flow-model-factory.py:/app/backend/packages/harness/deerflow/models/factory.py:ro
      # Pacgate: inject the conversation-history token estimate into the run
      # config so auto-routing can distinguish simple chats (local) from large
      # multi-step research runs (cloud), instead of relying only on the constant
      # tool-schema count.
      - ./patches/deer-flow-worker.py:/app/backend/packages/harness/deerflow/runtime/runs/worker.py:ro
      # Pacgate (hang fix 2026-10-06): bound the non-streaming title ainvoke()
      # and make CancelledError fall back instead of freezing the pregel loop
      # (run df600939: no output for 11 minutes; only STOP recovered it).
      - ./patches/deer-flow-title-middleware.py:/app/backend/packages/harness/deerflow/agents/middlewares/title_middleware.py:ro
      # Pacgate: run sync tool invocations on a single shared background event
      # loop. The stock wrapper calls asyncio.run() per call (new loop each
      # time), so parallel tool calls to the same stdio MCP server (e.g. two
      # Firecrawl tools) race across loops and cancel the subprocess spawn,
      # hanging the run. Sharing one loop eliminates the cross-loop race.
      - ./patches/deer-flow-sync.py:/app/backend/packages/harness/deerflow/tools/sync.py:ro
      # Pacgate 2026-10-08: prefix-aware skill allowed-tools matching. Skills
      # declare bare MCP server names (pkulaw, yuandian-law, pacgate) but tool
      # names are prefixed (pkulaw_*, pacgate_pacgate_*); exact-match filtering
      # dropped ALL 137 MCP tools once any skill declared allowed-tools (agent
      # left with bash/read_file only). The patch matches exact or
      # "<normalized-declaration>_" prefixes.
      - ./patches/deer-flow-tool-policy.py:/app/backend/packages/harness/deerflow/skills/tool_policy.py:ro
      # Pacgate 2026-10-08: exclude skill-reviewer eval fixtures
      # (*/evals/fixtures/) from skill discovery - they are test data, not
      # user-facing skills (5 phantom skills, one with an empty allowed-tools).
      - ./patches/deer-flow-skill-storage.py:/app/backend/packages/harness/deerflow/skills/storage/skill_storage.py:ro
      # Pacgate: normalize hyphens to underscores in the MCP server-name tool
      # prefix. MCP server keys like "yuandian-law" produce tool names
      # "yuandian-law_yuandian_rh_ft_search" that models hallucinate as
      # "yuandian_law_yuandian_rh_ft_search", causing "not a valid tool" loops.
      # Function names must be underscore-separated for reliable tool-calling.
      - ./patches/langchain-mcp-tools.py:/app/backend/.venv/lib/python3.12/site-packages/langchain_mcp_adapters/tools.py:ro
      # Pacgate (memory-card crash fix 2026-10-10): normalize the matter-memory
      # payload to the deer-flow memory shape on load(). The raw matter payload
      # ({content, revision, tags}) left MemoryResponse defaults as "" and the
      # frontend's formatTimeAgo("") threw RangeError: Invalid time value,
      # killing the settings memory card. Bind-mounted until upstreamed.
      - ./patches/pacgate-adapter-storage.py:/app/adapters/pacgate_deerflow_adapter/storage.py:ro
      # Persist deer-flow's own SQLite state (threads/runs/admin account) across
      # container recreation. Without this, every `docker compose up -d` resets
      # the deer-flow admin account and chat history (first-boot each time).
      - ./data/deer-flow:/app/backend/.deer-flow
    restart: unless-stopped

  deer-flow-frontend:
    image: ghcr.io/jzkk720/deer-flow-frontend-pacgate:0.1.25
    container_name: deer-flow-frontend
    depends_on: [deer-flow]
    environment:
      NEXT_PUBLIC_BACKEND_BASE_URL: http://localhost:8089
      NEXT_PUBLIC_LANGGRAPH_BASE_URL: http://localhost:8089/api
      DEER_FLOW_INTERNAL_GATEWAY_BASE_URL: http://deer-flow:8001
    ports:
      - "8090:3000"
    restart: unless-stopped

  pacgate-mcp:
    image: ghcr.io/jzkk720/pacgate-mcp:0.1.25
    container_name: pacgate-mcp
    depends_on: [pacgate-api]
    environment:
      PACGATE_API_URL: http://pacgate-api:8080
      PACGATE_API_EMAIL: ${PACGATE_API_EMAIL}
      PACGATE_API_PASSWORD: ${PACGATE_API_PASSWORD}
      PACGATE_JWT_TOKEN: ${PACGATE_JWT_TOKEN}
      PACGATE_MCP_PORT: "8000"
      PACGATE_MCP_TIMEOUT: "60"
    restart: unless-stopped

  # ocr-service: PaddleOCR extraction (plan 019). First-class from 0.1.16.
  # The ~1.5GB PaddleOCR model downloads on FIRST EXTRACTION, not at build.
  ocr-service:
    image: ghcr.io/jzkk720/ocr-service:0.1.25
    container_name: ocr-service
    environment:
      # Python logging rejects lowercase level names.
      OCR_LOG_LEVEL: INFO
      OCR_USE_GPU: "0"
    # PaddleOCR downloads its PP-OCRv4 det/rec/cls weights (~18 MB) into
    # /root/.paddleocr on FIRST extraction - they are NOT baked into the image.
    # Without this volume the cache lives in the container's writable layer, so
    # every recreate re-downloads from paddleocr.bj.bcebos.com (the only source)
    # and an offline recreate leaves extraction failing closed.
    volumes:
      - paddleocr-models:/root/.paddleocr
    restart: unless-stopped

  openviking:
    image: ghcr.io/volcengine/openviking@sha256:46f9e34cd37238c28cbd9535033773d179006bdf7f3e528dd1c46567abce7701
    container_name: openviking
    ports:
      - "1933:1933"
    volumes:
      - ./openviking:/app/.openviking
    environment:
      OPENVIKING_CONF_CONTENT: ${OPENVIKING_CONF_CONTENT}
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: pacgate-nginx
    depends_on: [pacgate-api, deer-flow, deer-flow-frontend]
    ports:
      - "8089:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  # Persists PaddleOCR's downloaded model weights across container recreation.
  paddleocr-models:
  pacgate-db-data:

