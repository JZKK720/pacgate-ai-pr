# Pacgate-ai runtime nginx — client AIPC ingress
#
# Routes:
#   /         → deer-flow web UI (Next.js frontend, at root so /_next assets load)
#   /api/     → deer-flow gateway (the frontend's browser-facing /api/* calls)
#   /research/→ deer-flow web UI (alias for the documented research URL)
#   /pacgate/ → pacgate-api metadata API (machine-to-machine, separate prefix so it
#               does not collide with the deer-flow frontend's /api/*)
#
# The deer-flow frontend rewrites /api/* to the deer-flow gateway internally, so the
# browser's /api/* must reach deer-flow (not pacgate-api). pacgate-api's metadata
# endpoints (matters/workflows/connectors) are machine-to-machine and live under
# /pacgate/. The pacgate-mcp bridge talks to pacgate-api:8080 directly on the compose
# network and never uses this ingress.
#
# qm (co-working workspace) runs on port 8182 via `qm up`, NOT behind this nginx.

# Map for WebSocket/SSE upgrade support (used by the frontend proxy).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS (127.0.0.11). Re-resolve upstream hostnames every
    # 10s so nginx picks up new container IPs after `docker compose up -d`
    # recreates a service. Without this, nginx caches the old IP at startup and
    # returns 502 "connect() failed (111: Connection refused)" — e.g. after a
    # frontend redeploy. ipv6=off avoids nginx trying a stale AAAA record on the
    # compose network (Docker's DNS returns no AAAA for these aliases).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Research surface → deer-flow web UI (Next.js frontend on :3000, published
    # on host :8090). Served at the root so the frontend's absolute /_next/* and
    # /images/* asset paths resolve. The frontend rewrites /api/* to the deer-flow
    # gateway (DEER_FLOW_INTERNAL_GATEWAY_BASE_URL).
    location / {
        # Variable proxy_pass forces nginx to use `resolver` at request time
        # instead of caching the IP at startup. The request URI is passed
        # unchanged, which the frontend expects (it rewrites /api/* internally).
        set $frontend_upstream http://deer-flow-frontend:3000;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # pacgate-api metadata API (machine-to-machine) → pacgate-api, under /pacgate/
    # so it does not collide with the deer-flow frontend's /api/*. Strip the
    # /pacgate prefix before proxying to pacgate-api's /api/* routes.
    location /pacgate/ {
        # Same resolver-driven upstream as the frontend, so /pacgate/ also picks
        # up a recreated pacgate-api container IP instead of returning 502.
        # NOTE: `set` MUST come before `rewrite ... break` — `break` stops the
        # rewrite phase, so a `set` after it would leave the variable
        # uninitialized ("using uninitialized ... variable" → 500).
        set $pacgate_api_upstream http://pacgate-api:8080;
        rewrite ^/pacgate/(.*)$ /$1 break;
        proxy_pass $pacgate_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Research surface alias (documented URL) → deer-flow web UI
    location /research/ {
        # Preserve the alias semantics (strip /research/ so the frontend serves
        # the root). `set` MUST come before `rewrite ... break` (see /pacgate/).
        set $frontend_upstream http://deer-flow-frontend:3000;
        rewrite ^/research/(.*)$ /$1 break;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}