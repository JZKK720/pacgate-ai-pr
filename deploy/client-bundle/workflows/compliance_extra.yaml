- id: "00000000-0000-0000-0000-000000000d01"
  name: "数据安全事件应急预案"
  description: "Data security incident emergency response plan — grading, org structure, handling flow, notification duties"
  category: "data_compliance"
  steps:
    - name: "Search legal basis"
      description: "Search for Data Security Law and PIPL incident response provisions"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate plan"
      description: "Generate data security incident emergency response plan"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请起草一份数据安全事件应急处置预案，适用于【互联网企业/金融机构/医疗机构】：

          预案结构：

          1. 总则
             - 适用范围
             - 工作原则（及时性、最小损害、合法合规）

          2. 事件分级标准
             - 特别重大（红色）：泄露【100万条以上个人信息 / 重要数据 / 核心数据】
             - 重大（橙色）：泄露【10万-100万条个人信息 / 敏感个人信息1万条以上】
             - 较大（黄色）：泄露【1万-10万条个人信息】
             - 一般（蓝色）：泄露【1万条以下个人信息】
             - 每级对应的响应级别和审批层级

          3. 应急响应组织架构
             - 应急领导小组（CEO/CTO/CPO/DPO）
             - 应急执行小组（安全/法务/公关/客服/IT）
             - 各角色职责矩阵

          4. 处置流程
             阶段一：发现与报告（0-1小时）
             - 发现渠道（内部监测/外部报告/用户投诉）
             - 初步评估与上报流程
             - 启动应急响应的决策机制

             阶段二：评估与遏制（1-4小时）
             - 事件影响范围评估
             - 证据保全措施
             - 遏制措施（断网/封禁/删除/回滚）

             阶段三：处置与恢复（4-24小时）
             - 系统修复与漏洞修补
             - 数据恢复方案
             - 影响用户范围确认

             阶段四：通知（依法及时）
             - 监管报告义务：
               * 网信部门报告（触发条件、报告内容、时限）
               * 行业主管部门报告
               * 公安机关报告（如涉犯罪）
             - 数据主体通知义务：
               * 通知触发条件
               * 通知内容（事件描述、影响范围、应对措施、用户自我保护建议）
               * 通知方式（短信/邮件/公告/电话）

             阶段五：总结与改进（事后7-30天）
             - 事件调查报告
             - 根因分析
             - 整改措施与跟进
             - 内部问责

          5. 对外沟通口径
             - 媒体回应原则与模板
             - 用户沟通模板（短信/邮件/公告）
             - 监管沟通策略

          6. 附件
             - 应急联系人名单（模板）
             - 监管部门联系方式清单
             - 数据安全事件报告模板
             - 用户通知模板

          引用《数据安全法》第29条、《个人信息保护法》第57条等。
          输出为Word文档。

- id: "00000000-0000-0000-0000-000000000d02"
  name: "欧盟 AI Act 合规评估"
  description: "EU AI Act compliance assessment — risk classification, obligations matrix, timeline"
  category: "ai_compliance"
  steps:
    - name: "Search EU AI Act"
      description: "Search for EU AI Act provisions and implementation timeline"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate assessment"
      description: "Generate EU AI Act compliance assessment"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请对以下AI系统进行欧盟AI Act合规评估，确定其风险分级和合规义务：

          AI系统信息：
          - 系统名称：【XX】
          - 系统功能：【简述核心功能】
          - 部署场景：【如：招聘筛选/信用评估/医疗诊断/执法辅助/教育评估/情绪识别/内容推荐】
          - 使用范围：【仅在欧盟使用 / 全球使用但服务欧盟用户 / 欧盟企业采购】
          - 部署方式：【自研自用 / 作为产品对外提供 / 嵌入第三方平台】

          EU AI Act合规评估框架：

          一、风险分级判断（Article 6-7）：

            1. 是否属于"禁止的AI实践"（Article 5）——以下AI实践在欧盟绝对禁止：
               - 操纵人类行为的潜意识技术
               - 利用年龄/残疾/社会经济状况的剥削性技术
               - 社会评分（Social Scoring）系统
               - 实时远程生物识别（执法例外但有严格条件）
               - 基于敏感特征推断情绪的职场/教育评估
               - 预测性 policing（基于 profiling 预测犯罪）

            2. 是否属于"高风险AI系统"（Article 6 Annex III）——以下场景自动被归类为高风险：
               - 生物识别/身份验证
               - 关键基础设施管理
               - 教育/职业培训的评估与筛选
               - 就业/员工管理/自雇机会
               - 信用评估/保险定价
               - 执法/移民/边境管理
               - 司法/民主过程
               - 医疗设备的AI组件

            3. 是否属于"有限风险"（需要透明度义务）：
               - 聊天机器人/生成式AI
               - 情绪识别系统
               - 深度伪造/合成内容生成
               - 生物识别分类（非高风险场景）

            4. 是否属于"最小风险"（无特别义务）：
               - AI驱动的垃圾邮件过滤
               - AI辅助的库存管理
               - 游戏AI

          二、对应合规义务矩阵：

          | 风险级别 | 适用条款 | 核心合规义务 | 实施时间线 |
          | 禁止 | Art.5 | 停止使用 | 立即 |
          | 高风险 | Art.8-15, Art.20-27 | 风险管理体系+质量管理体系+数据治理+技术文档+人类监督+准确性/鲁棒性/安全性+注册+上市后监测+严重事件报告 | 2026年8月前 |
          | 有限风险 | Art.50 | 透明度义务（告知用户正在与AI交互/标注AI生成内容） | 2025年8月前 |
          | 最小风险 | 无 | 自愿遵守AI伦理准则 | 无强制时间 |

          三、高风险AI系统的详细合规要求（如被归类为高风险）：

            1. 风险管理体系（Art.9）：
               - 持续识别/分析/评估风险
               - 预防/减轻风险的措施
               - 风险评估的测试方案

            2. 数据治理（Art.10）：
               - 训练/验证/测试数据集的质量要求
               - 数据收集/清洗/标注的治理流程
               - 偏见检测与纠正措施

            3. 技术文档（Art.11）：
               - 系统描述/设计/开发的全流程记录
               - 文档模板（Annex IV）

            4. 记录保存与日志（Art.12）：
               - 自动生成日志
               - 日志保存期限

            5. 透明度与用户信息（Art.13）：
               - 使用说明的格式与内容要求
               - 预期用途/准确度/风险的告知

            6. 人类监督（Art.14）：
               - 人类可理解的操作方式
               - 人类干预/停止/断开的能力
               - "human-in-the-loop"/"human-on-the-loop"/"human-over-the-loop"的选择

            7. 准确性/鲁棒性/安全性（Art.15）：
               - 性能指标声明
               - 对抗性测试
               - 故障安全机制

            8. 上市后监测（Art.72）：
               - 持续监测系统性能
               - 严重事件的报告义务

          四、生成式AI的额外义务（如属于生成式AI）：
            - Art.53 通用AI模型义务：
              * 技术文档
              * 向AI Office提供信息
              * 版权合规（公开训练数据的摘要）
            - Art.50 有限风险透明度：
              * 标注AI生成内容
              * 告知用户正在与AI交互

          五、合规时间线：
            - 2025年2月：禁止实践条款生效
            - 2025年8月：有限风险/通用AI模型义务生效
            - 2026年8月：高风险AI系统义务生效
            - 2027年8月：高风险AI系统义务全部适用（含医疗/生物识别等延期领域）

          请输出：风险分级判定结论 + 合规义务清单 + 实施时间线 + 预估合规成本。

- id: "00000000-0000-0000-0000-000000000d03"
  name: "美国 AI 合规与风险管理"
  description: "US AI compliance and risk management — NIST AI RMF, federal/state dual-track, contract clauses"
  category: "ai_compliance"
  steps:
    - name: "Search US AI regulations"
      description: "Search for US federal and state AI regulations"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate compliance path"
      description: "Generate US AI compliance and risk management analysis"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请分析以下AI产品在美国的合规与风险管理路径：

          AI产品信息：
          - 产品类型：【简述】
          - 部署场景：【如：消费者产品/B2B企业服务/金融/医疗/教育/招聘】
          - 服务范围：【仅美国市场/全球市场含美国】
          - 是否涉及联邦监管领域：【如：金融（SEC/CFTC/FINCEN）/医疗（FDA）/就业（EEOC）/教育/国防】

          美国AI合规评估框架（联邦+州级双轨制）：

          一、联邦层面合规：

            1. NIST AI Risk Management Framework（AI RMF 1.0）对标：
               - MAP函数（映射AI风险语境）：
                 * 应用场景的风险识别
                 * 受影响利益方的分析
                 * 风险容忍度设定
               - MEASURE函数（测量AI风险）：
                 * 信任度评估（可靠/安全/公平/透明/隐私/可问责）
                 * 性能指标与测试方法
               - MANAGE函数（管理AI风险）：
                 * 风险响应策略
                 * 持续监测机制

            2. 行业监管机关的AI专项要求（如适用）：
               - FDA：AI/ML驱动的医疗设备（SaMD）的监管路径
               - SEC：AI在投资建议/交易中的监管要求
               - EEOC：AI招聘工具的反歧视合规指引
               - CFPB：AI在信贷决策中的公平贷款合规
               - FTC：AI产品的消费者保护执法重点
                 * 虚假声称AI能力（deceptive claims）
                 * AI生成内容的欺骗性
                 * 算法歧视的执法行动

            3. 联邦立法动态（关注但尚未统一立法）：
               - 《AI研发法案》进展
               - 《AI透明度法案》进展
               - 《算法问责法案》进展

          二、州级合规（各州独立立法趋势）：

            1. Colorado AI Act（2024年5月签署，2026年2月生效）——目前最全面的州级AI立法：
               - 适用范围："高风险AI系统"的定义
               - 部署者义务：影响评估/消费者告知/歧视审查/年度报告
               - 开发者义务：风险分析/透明度文档/持续监测
               - 执行机关：Colorado Attorney General

            2. 其他州级立法关注：
               - California：AI透明度/偏见审计提案
               - Illinois：AI招聘视频分析法（AIVAA）
               - New York City：本地AI招聘工具偏见审计法（Local Law 144）
               - Texas/Connecticut/Virginia等州的AI相关条款

            3. 多州运营的合规策略：
               - 以最严格州为基准的"最高标准"策略
               - 州级合规地图制作

          三、合同与商业合规：
            1. AI服务协议的关键条款：
               - AI性能保证条款（准确性/延迟/可用性）
               - AI输出责任的分配
               - 数据使用与IP归属条款
               - AI更新/模型迭代的变更通知机制
               - AI审计权条款

            2. AI保险与责任：
               - AI产品的责任保险
               - E&O保险的AI特别条款

          四、行业自律标准对标：
            - ISO/IEC 42001（AI管理体系标准）
            - IEEE AI伦理标准
            - OECD AI原则

          请输出：联邦合规义务清单 + 州级合规地图 + NIST AI RMF对标评估 + 合同条款模板建议。

- id: "00000000-0000-0000-0000-000000000d04"
  name: "东南亚 AI 合规路径分析"
  description: "Southeast Asia AI compliance path — Singapore, Vietnam, Thailand, Malaysia, Indonesia"
  category: "ai_compliance"
  steps:
    - name: "Search SEA AI regulations"
      description: "Search for Southeast Asia AI governance regulations"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate compliance path"
      description: "Generate Southeast Asia AI compliance path analysis"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请分析以下AI产品在东南亚主要市场的合规路径：

          AI产品信息：
          - 产品类型：【简述】
          - 目标市场：【新加坡/越南/泰国/马来西亚/印尼/菲律宾，可多选】
          - 服务模式：【面向消费者/企业服务/嵌入本地平台】
          - 是否涉及敏感领域：【如：金融/医疗/教育/政务】

          东南亚AI合规评估框架（四国重点）：

          一、新加坡：
            1. 核心法规与政策：
               - PDPA（个人数据保护法）+ 2024年修正案对AI的影响
               - IMDA AI Verify（AI验证框架）——自愿性AI治理测试工具箱
               - Model AI Governance Framework（2019/2020更新）——新加坡AI治理模型框架
               - National AI Strategy 2.0（2023年12月发布）

            2. AI治理要求：
               - 透明度（决策过程的可解释性）
               - 人类监督（重大决策的人类介入）
               - 公平性（无偏见/歧视）
               - 安全性（网络安全/可靠性）
               - 可问责性（责任分配清晰）

            3. 金融AI特别要求：
               - MAS（金管局）FEAT原则（公平/伦理/问责/透明）
               - AI在金融服务的指引文件

          二、越南：
            1. 核心法规：
               - 《网络安全法》（2018年）对AI数据的影响
               - 《数字技术产业法草案》（含AI条款，2025年待通过）
               - 国会AI法规立法进程

            2. 数据本地化要求：
               - AI系统处理越南用户数据的数据本地化义务
               - 跨境数据传输限制

            3. 内容管控：
               - AI生成内容的审查与过滤义务

          三、泰国：
            1. 核心政策：
               - PDPA（个人数据保护法，2022年6月全面生效）
               - Thailand AI Ethics Guideline（2021年发布，2023年更新）
               - National AI Strategy（2022-2027）

            2. AI伦理框架：
               - 六项原则：安全/安保/透明/公平/问责/隐私
               - AI分级治理建议

            3. 金融AI：
               - BOT（泰国银行）金融科技监管沙盒
               - AI在金融服务的准入要求

          四、马来西亚与印尼（补充）：
            1. 马来西亚：
               - PDPA 2010对AI数据的适用
               - Malaysia AI Roadmap 2021-2025
               - MDEC的AI治理指引

            2. 印尼：
               - PDP Law 2022（个人数据保护法）对AI的影响
               - 印尼AI国家战略（Stranas KA 2020-2045）
               - 通信部对AI内容的监管

          五、多国部署合规策略：
            1. "新加坡为锚点"策略：
               - 以新加坡的AI Verify为合规基线
               - 其他市场叠加本地化要求
            2. 合规地图制作方法：
               - 各国法规对照矩阵
               - 各国数据本地化要求对照表
            3. 东南亚AI合规日历：
               - 各国法规生效时间线
               - 年度合规审查节点

          请输出多法域合规对比矩阵 + 各国合规义务清单 + 合规路径推荐方案。
          联网搜索东南亚各国最新AI法规动态。

- id: "00000000-0000-0000-0000-000000000d05"
  name: "AI 训练数据与知识产权合规专项审查"
  description: "AI training data compliance review — personal information, IP, open source, cross-border risks"
  category: "ai_compliance"
  steps:
    - name: "Search training data regulations"
      description: "Search for AI training data and IP regulations"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate review report"
      description: "Generate AI training data compliance review report"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请对以下AI模型的训练数据进行合规审查，重点评估知识产权与个人信息风险：

          AI模型信息：
          - 模型名称：【XX】
          - 模型类型：【大语言模型/图像生成模型/多模态模型/代码生成模型】
          - 训练数据规模：【约XX TB / XX亿条 / XX万条】
          - 训练数据来源：【公开互联网爬取 / 采购第三方数据集 / 自有业务数据 / 用户生成内容 / 开源数据集】

          合规审查框架：

          一、个人信息合规审查：
            1. 训练数据中的个人信息识别：
               - 是否包含可识别个人信息的数据集
               - 个人信息类型（姓名/联系方式/行为数据/生物识别/健康数据）
            2. 合法性基础分析：
               - 同意机制（是否获取数据主体的同意）
               - 去标识化/匿名化处理（是否实施、实施程度）
               - 合同必要/法定义务等其他合法性基础
            3. 跨境训练数据合规：
               - 训练数据是否跨境传输（如数据在境外服务器处理）
               - 中国数据出境合规要求
               - 欧盟GDPR跨境要求（如涉及欧盟居民数据）

          二、知识产权合规审查：
            1. 版权作品使用分析：
               - 训练数据中受版权保护作品的识别
               - "合理使用"（Fair Use/Fair Dealing）论证：
                 * 使用目的与性质（商业 vs. 研究）
                 * 受版权保护作品的性质
                 * 使用的数量与实质性
                 * 对原作品市场的影响
               - 中国《著作权法》对训练数据使用的解释空间
               - 欧盟DSM Directive Article 4（文本与数据挖掘例外）的适用
            2. 开源合规审查：
               - 训练数据中开源软件/数据集的License审查
               - GPL/CC系列/Apache/MIT等不同License对AI训练的限制
               - 开源License的传染性风险分析
            3. 生成内容的知识产权风险：
               - 模型输出与训练数据中版权作品的相似度风险
               - 生成内容本身的可版权性（当前各国立场差异）
               - 生成内容侵权的归责逻辑

          三、行业特殊数据合规（如适用）：
            - 医疗数据：HIPAA/《人类遗传资源管理条例》
            - 金融数据：金融数据使用的行业限制
            - 政务数据：政府采购数据的使用授权链

          四、风险等级矩阵：

          | 数据来源 | 个人信息风险 | 知识产权风险 | 跨境合规风险 | 综合风险等级 | 处理建议 |

          请输出训练数据合规审查报告 + 风险矩阵 + 合规改进路线图。

- id: "00000000-0000-0000-0000-000000000d06"
  name: "贸易救济——反倾销/反补贴应对"
  description: "Anti-dumping / countervailing duty response plan — procedure timeline, margin defense, injury defense"
  category: "trade_compliance"
  steps:
    - name: "Search trade remedy cases"
      description: "Search for anti-dumping and countervailing duty regulations and cases"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate response plan"
      description: "Generate anti-dumping / countervailing duty response plan"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请为以下企业制定反倾销/反补贴调查应对方案：

          案件信息：
          - 出口企业：【XX公司】
          - 出口产品：【XX产品】
          - 出口目的国：【如：美国/欧盟/印度/巴西/澳大利亚】
          - 调查发起方：【如：目的国某行业协会/目的国商务部】
          - 调查类型：【反倾销 / 反补贴 / 保障措施】
          - 我方角色：【出口商/出口国政府/进口商】

          应对方案框架：

          一、调查程序时间线：
            1. 【目的国】反倾销/反补贴调查的法定程序：
               - 发起调查→立案→初裁→终裁→日落复审的时间节点
               - 各阶段企业应提交的材料和截止日期
            2. 关键时间窗口：
               - 立案后【XX日】内提交调查问卷
               - 【XX日】内申请听证
               - 【XX日】内提交评论意见

          二、倾销/补贴幅度的抗辩：
            1. 正常价值确定抗辩：
               - 出口国国内销售价格的可比性
               - 替代国/替代价格的选择（如目的国不认可中国市场经济地位）
               - 成本数据的准备（生产成本+SGA+利润）
            2. 出口价格抗辩：
               - 出口价格的调整项目
               - 出口商→进口商之间的关联交易审查
            3. 补贴项目审查（反补贴案件）：
               - 政府补贴项目的逐项审查
               - 专向性（Specificity）抗辩
               - 补贴利益计算的抗辩

          三、损害抗辩：
            1. 目的国国内产业状况分析：
               - 目的国产业的产量/销售/利润/就业趋势
               - 是否存在非进口因素导致的损害
            2. 因果关系抗辩：
               - 进口与损害之间的因果关系论证
               - 其他因素的排除论证（需求萎缩/技术变化/本国企业竞争等）

          四、替代策略：
            1. 价格承诺/数量承诺（如目的国允许）
            2. 市场经济地位申请（如目的国有此制度）
            3. 供应链调整（通过第三国加工/原产地变更规避）

          五、日落复审应对（终裁后的长期策略）：
            - 反倾销措施的5年到期复审
            - 持续参与复审的必要性评估

          请输出反倾销/反补贴应对方案 + 问卷填写指南 + 时间线日历。
          使用华宇元典和联网搜索检索目的国的同类调查案例。

- id: "00000000-0000-0000-0000-000000000d07"
  name: "产品合规认证——多法域路径分析"
  description: "Multi-jurisdiction product compliance certification path — CCC, CE, FCC, FDA, SEA certifications"
  category: "trade_compliance"
  steps:
    - name: "Search product certification requirements"
      description: "Search for product certification requirements across markets"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate certification path"
      description: "Generate multi-jurisdiction product certification path analysis"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请分析以下产品在目标市场的合规认证路径：

          产品信息：
          - 产品名称：【XX】
          - 产品类型：【如：消费电子/医疗器械/工业设备/玩具/化妆品/食品/汽车零部件/AI设备】
          - 目标市场：【中国/欧盟/美国/东南亚，可多选】
          - 产品用途：【简述】
          - 是否含无线/通信功能：【是/否】
          - 是否涉及食品/药品/化妆品：【是/否】

          多法域产品合规认证路径分析：

          一、中国市场：
            1. CCC强制认证（中国强制性产品认证）：
               - CCC认证目录查询（是否属于强制认证范围）
               - 认证流程（型式试验→工厂审查→获证→监督）
               - 认证时间和费用估算
            2. 其他认证要求（如适用）：
               - SRRC无线电型号核准
               - NAL网络接入许可
               - 医疗器械NMPA注册
               - 化妆品备案/注册
               - 食品生产许可
               - 工业产品生产许可
            3. GB国标对标：
               - 产品须符合的强制性国家标准清单
               - 推荐性标准的合规考量

          二、欧盟市场：
            1. CE标志认证：
               - CE适用指令/法规判定：
                 * LVD（低电压指令）/ EMC（电磁兼容）/ RED（无线电设备）
                 * MDR（医疗器械）/ PPE（个人防护设备）/ Toy Safety（玩具安全）
                 * RoHS（有害物质限制）/ WEEE（废弃电子设备）
                 * CPR（建筑产品）/ Machinery（机械指令）
               - 合格评定程序选择（模式A/B/C/D/E/F等）
               - 技术文档（Technical File）编制要求
               - EU符合性声明（Declaration of Conformity）
            2. 新立法框架（NLF）合规：
               - 授权代表（Authorized Representative）的指定
               - CE标志的使用规范

          三、美国市场：
            1. FCC认证（含无线功能的产品）：
               - FCC SDoC vs. FCC Certification路径选择
               - FCC ID申请流程
            2. FDA合规（如适用）：
               - 医疗器械的FDA注册/510(k)/PMA路径
               - 食品的FDA注册/FSMA合规
               - 化妆品的MoCRA注册（2023年新规）
            3. UL/ETL认证（非强制但市场需要）：
               - 安全认证的选择
               - 认证成本和时间

          四、东南亚市场（补充）：
            - 印尼：SNI认证/POSTEL认证
            - 泰国：TIS认证/NBTC认证
            - 越南：CR标志/QCVN标准
            - 马来西亚：SIRIM认证/MCMC认证

          五、认证时间线与成本对比矩阵：

          | 市场 | 认证类型 | 法定/自愿 | 时间预估 | 成本预估 | 关键材料 | 优先级建议 |

          请输出多法域认证对比矩阵 + 各市场的认证流程图 + 材料清单表格。

- id: "00000000-0000-0000-0000-000000000d08"
