- id: "00000000-0000-0000-0000-000000000d09"
  name: "制裁合规筛查"
  description: "Sanctions compliance screening — OFAC, EU, UK, China counter-sanctions, export control screening"
  category: "trade_compliance"
  steps:
    - name: "Search sanctions lists"
      description: "Search for current sanctions lists and regulations"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate screening report"
      description: "Generate sanctions compliance screening report"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请对以下交易/合作方进行制裁合规筛查：

          交易/合作信息：
          - 交易类型：【如：向某国出口设备/与某公司签订合同/收购某公司股权/向某个人支付服务费】
          - 合作方名称：【XX公司/个人】
          - 合作方国籍/注册地：【如：俄罗斯/伊朗/某BVI公司实际控制人为中国公民】
          - 交易标的：【简述】
          - 涉及资金路径：【如：美元通过美国银行清算/人民币直接支付】

          筛查维度：

          1. 美国OFAC制裁筛查：
             - SDN名单（特别指定国民名单）筛查
             - Sectoral Sanctions筛查（行业制裁）
             - Non-SDN菜单式制裁筛查
             - 50%规则适用（SDN名单实体持有50%以上股权的子公司也受制裁）
             - 次级制裁风险（非美国主体与SDN交易的制裁风险）

          2. 欧盟制裁筛查：
             - 欧盟制裁名单筛查
             - 行业制裁措施（如对俄罗斯的贸易限制）

          3. 英国制裁筛查：
             - UK制裁名单筛查

          4. 中国反制裁筛查：
             - 中国反制清单（《反外国制裁法》）
             - 不可靠实体清单

          5. 出口管制筛查（美国EAR）：
             - 是否涉及管制物项（ECCN编码）
             - 目的地管制
             - 最终用途管制（军事用途/大规模杀伤性武器）
             - 最终用户管制（军事最终用户清单MEU）

          6. 风险等级评估：
             - 🔴禁止交易（合作方在制裁名单上或涉及管制物项）
             - 🟡高风险（合作方有制裁关联风险/交易涉及敏感国家）
             - 🟢低风险（筛查通过但仍需持续监控）

          7. 合规建议：
             - 是否需要拒绝交易
             - 是否需要申请OFAC许可证
             - 合同中的制裁合规条款
             - 持续监控机制

          请联网搜索最新制裁名单动态。
          输出制裁合规筛查报告。

- id: "00000000-0000-0000-0000-000000000d0a"
  name: "合同制裁条款起草"
  description: "Draft sanctions compliance clauses for contracts — representations, termination rights, bilingual"
  category: "trade_compliance"
  steps:
    - name: "Generate sanctions clauses"
      description: "Generate sanctions compliance contract clauses"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请为以下合同起草制裁合规条款：

          合同类型：【如：国际货物买卖合同/技术服务合同/投资协议/银行贷款协议】
          我方身份：【如：中国出口方/中国投资方/国际银行】
          风险场景：【如：交易涉及美元清算/合作方可能受到制裁/需预防未来制裁影响】

          条款起草要求：

          1. 制裁陈述与保证条款：
             - 合作方当前不受制裁的陈述
             - 合作方不会从事导致受制裁行为的承诺
             - 交易不涉及管制物项的陈述（如适用）

          2. 制裁终止权条款：
             - 如合作方受到制裁，我方有权终止合同
             - 终止后的费用结算安排
             - 终止不构成违约的明确约定

          3. 制裁合规义务条款：
             - 合作方配合制裁筛查的义务
             - 合作方及时通知受制裁风险的义务
             - 制裁名单变更的持续监控义务

          4. 制裁合规审查权条款：
             - 我方有权对合作方进行定期制裁合规审查
             - 合作方提供相关信息和文件的义务

          5. 间接制裁风险条款：
             - 次级制裁风险的通知和处理
             - 美元清算受阻的替代支付安排

          6. 责任限制条款：
             - 因制裁导致的不可抗力处理
             - 制裁导致的履约障碍的风险分配

          请提供中英双语版本（英文为谈判和合同主要语言）。
          输出条款文本及起草说明。

- id: "00000000-0000-0000-0000-000000000d0b"
  name: "游戏版号与内容审查合规路径"
  description: "Game license approval and content review compliance path — publication approval, content review, operation qualifications"
  category: "gaming_compliance"
  steps:
    - name: "Search game regulations"
      description: "Search for game publication approval and content review regulations"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate compliance path"
      description: "Generate game license and content review compliance path"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请分析以下游戏产品在中国境内的版号审批与内容审查合规路径：

          游戏产品信息：
          - 游戏名称：【XX】
          - 游戏类型：【MMORPG/手游/端游/主机游戏/小游戏/VR游戏】
          - 游戏题材：【如：武侠/玄幻/科幻/军事/历史/体育/休闲/益智】
          - 目标用户：【全年龄/12+/18+】
          - 运营模式：【免费+内购/买断制/订阅制/广告变现】
          - 是否含联网功能：【单机/弱联网/强联网/MMO】
          - 开发商：【XX公司，是否已有版号资质】
          - 运营资质：【是否已取得《网络文化经营许可证》/ICP证】

          合规路径分析框架：

          一、版号审批路径：
            1. 出版审批（国家新闻出版署）：
               - 游戏出版审批的申报条件
               - 申报材料清单：
                 * 游戏出版申报表
                 * 游戏选题报告/内容审查报告
                 * 游戏防沉迷系统说明
                 * 游戏测试账号
                 * 著作权登记证书
                 * ICP证复印件
                 * 《网络文化经营许可证》复印件
               - 审批流程时间线（当前平均审批周期）
               - 国产游戏 vs. 进口游戏的审批差异
            2. 版号审批的常见问题与风险：
               - 题材敏感风险（暴力/血腥/色情/政治/宗教/赌博暗示）
               - 角色造型审查（暴露/敏感标志/历史人物处理）
               - 地名/国旗/国徽的合规使用
               - 游戏名称的合规审查（不得含有违规用语）

          二、内容审查合规：
            1. 《网络游戏管理暂行办法》合规要点：
               - 游戏内容的合法性审查清单
               - 不得含有的内容类型（淫秽/暴力/赌博/违禁/歧视等）
               - 历史题材的特殊审查要求
            2. 游戏命名合规：
               - 《关于严格规范网络游戏名称的通知》要求
            3. 广告合规：
               - 游戏内广告的合规要求
               - 游戏推广素材的合规审查

          三、运营资质合规：
            1. 《网络文化经营许可证》申请
            2. ICP经营许可证申请
            3. 游戏版号的年度报告义务

          四、审批策略建议：
            - 不同题材的审批风险等级评估
            - 内容自审查清单（提交前的自查）
            - 版号获批后的持续合规义务

          请输出版号审批合规路径图 + 申报材料清单 + 内容自查清单 + 风险评估矩阵。

