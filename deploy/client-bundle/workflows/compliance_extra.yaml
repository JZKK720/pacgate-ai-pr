          - 游戏名称：【XX】
          - 运营模式：【免费+内购】
          - 虚拟道具类型：【角色皮肤/装备/道具/通行证/抽奖/宝箱/代币/金币】
          - 是否含抽奖/随机机制：【是/否】
          - 抽奖机制详情：【如：每抽XX元，SSR概率XX%，保底XX次】
          - 是否含交易功能：【禁止交易/游戏内交易/外部交易平台】
          - 是否含未成年人充值功能：【是/否】

          合规审查框架：

          一、抽奖/随机机制合规（《关于规范网络游戏运营加强事中事后监管的通知》/各地抽奖规范）：
            1. 信息披露合规：
               - 是否公示抽取概率/合成概率
               - 是否公示虚拟道具的名称/性能/获取方式
               - 概率公示的位置和方式要求
            2. 限制性要求：
               - 单次抽取/多次抽取的价格限制
               - 保底机制的合规要求
               - 是否存在"诱导过度消费"的设计
            3. 盲盒合规联动：
               - 是否适用《盲盒经营活动规范指引（试行）》
               - 未成年人购买盲盒的限制

          二、虚拟道具交易合规：
            1. 游戏内交易：
               - 交易规则与限制
               - 交易手续费合规性
            2. 虚拟道具的财产属性分析：
               - 虚拟道具的法律性质（虚拟财产/服务内容/数据）
               - 用户对虚拟道具的权利边界
            3. 外部交易平台的风险：
               - 是否允许第三方平台交易
               - 交易安全与纠纷处理

          三、充值合规与未成年人保护：
            1. 未成年人充值限制（《关于进一步严格管理切实防止未成年人沉迷网络游戏的通知》）：
               - 8-16岁：单次充值≤50元，月累计≤200元
               - 16-18岁：单次充值≤100元，月累计≤400元
               - 不得为未满8岁用户提供充值
            2. 实名认证与充值关联：
               - 实名制对充值的强制性关联
               - 充值时的年龄验证机制
            3. 退款机制：
               - 未成年人未经监护人同意充值的退款规则
               - 退款申请的处理流程

          四、定价合规：
            1. 虚拟道具定价的合理性
            2. 是否存在误导性定价
            3. "首充优惠"/"限时折扣"的合规性

          请输出合规审查清单（逐项标注 🔴违法 / 🟡风险 / 🟢合规）+ 未成年人充值合规方案 + 抽奖概率公示模板。

- id: "00000000-0000-0000-0000-000000000d0d"
  name: "游戏出海合规——多法域分析"
  description: "Game overseas compliance — content rating, data, payment, minor protection across jurisdictions"
  category: "gaming_compliance"
  steps:
    - name: "Search game overseas regulations"
      description: "Search for game regulations in target overseas markets"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate compliance analysis"
      description: "Generate multi-jurisdiction game overseas compliance analysis"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请对以下游戏产品出海的多法域合规路径进行分析：

          游戏产品信息：
          - 游戏名称：【XX】
          - 游戏类型：【如：RPG/SLG/休闲/竞技/二次元】
          - 目标市场：【美国/欧盟/日本/韩国/东南亚/中东/巴西，可多选】
          - 发行方式：【自发行/通过平台发行（App Store/Google Play/Steam）/代理发行】
          - 是否含实时社交功能：【是/否】
          - 是否含随机抽取机制：【是/否】
          - 是否含支付/充值功能：【是/否】

          多法域合规分析框架：

          一、内容审查合规（各国差异最大）：
            1. 日本：
               - CERO分级制度（内容审查与分级）
               - PC游戏的内容审查（EOCS/CSRR）
               - 赌博性要素的合规界限（"ガチャ"的概率公示要求）
            2. 韩国：
               - GRAC分级制度
               - 韩国强制关机制度（Shutdown Law）已于2021年修法废止，改为家长选择制
               - 韩国游戏物管理委员会（GRAC）的登记与分级要求
            3. 欧盟/英国：
               - PEGI分级
               - 暴力/色情内容的分级标准
               - 欧盟对 loot box 的监管态度（比利时认定为赌博予以禁止；荷兰曾禁止但2022年法院改判；其他国家态度不一）
            4. 中东：
               - 伊斯兰文化审查要点
               - 阿联酋/NMC的游戏内容审查
               - 沙特/GSA的游戏许可
            5. 美国：
               - ESRB分级（自愿但App Store/Google Play要求）
               - COPPA合规（13岁以下儿童数据的特殊要求）
               - loot box的州级立法动态

          二、数据合规（出海数据挑战）：
            1. GDPR合规（欧盟）：
               - 游戏内个人数据处理合规
               - 儿童数据的特殊要求（13-16岁需监护人同意）
               - 游戏内广告的数据合规
            2. 各国数据本地化要求
            3. 中国数据出境合规（游戏服务器在境外）

          三、支付/充值合规：
            1. 各国对游戏内支付的监管：
               - 欧盟PSD2对游戏支付的影响
               - 日本/韩国的游戏支付合规
            2. 跨境支付合规：
               - 游戏内虚拟货币的跨境收付路径
               - Apple/Google的支付规则合规
            3. 退款政策的各国要求

          四、未成年人保护合规：
            1. 各国游戏时间限制对比：
               - 中国：1小时（周五/六/日+节假日8-9PM）
               - 韩国：游戏选择制（选择性限制）
               - 日本：无统一限制但有行业指引
               - 欧盟/美国：无统一限制但平台有家长控制
            2. 各国充值限制对比

          五、发行合规：
            1. 各平台合规要求：
               - App Store审核指南
               - Google Play政策
               - Steam发行合规
            2. 本地化运营的合规要求：
               - 本地客服/举报机制
               - 本地隐私政策/条款的翻译合规

          请输出多法域合规对比矩阵 + 各市场合规优先级排序 + 合规改进路线图。
          联网搜索各国最新游戏监管动态。

- id: "00000000-0000-0000-0000-000000000d0e"
  name: "未成年人保护与防沉迷合规专项"
  description: "Minor protection and anti-addiction compliance — real-name verification, time limits, recharge limits, parental tools"
  category: "gaming_compliance"
  steps:
    - name: "Search minor protection regulations"
      description: "Search for minor protection and anti-addiction regulations"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate compliance plan"
      description: "Generate minor protection and anti-addiction compliance plan"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请对以下游戏的未成年人保护体系进行合规审查与建设方案设计：

          游戏信息：
          - 游戏名称：【XX】
          - 当前防沉迷系统状态：【已有系统/需要建设/需要升级】
          - 用户实名认证方式：【身份证号/手机号/其他】
          - 当前未成年人占比预估：【约XX%】

          合规审查与建设方案框架：

          一、实名认证合规：
            1. 《关于进一步严格管理切实防止未成年人沉迷网络游戏的通知》合规：
               - 实名注册系统的技术标准
               - 与国家新闻出版署防沉迷实名验证系统的对接
               - 实名信息的安全存储与使用合规
            2. 实名认证的技术实现：
               - 接入公安数据源的身份核验
               - 人脸识别辅助验证（触发条件）
               - 实名认证失败的处理流程

          二、游戏时间限制合规：
            1. 服务时段限制：
               - 仅周五/周六/周日和法定节假日的20:00-21:00提供服务
               - 技术实现方案（登录控制/强制退出）
            2. 限制的对象：
               - 未满18周岁的用户
               - 不同年龄段的差异化限制

          三、充值限制合规：
            1. 年龄分档充值限制：
               - 8岁以下：禁止充值
               - 8-16岁：单次≤50元，月累计≤200元
               - 16-18岁：单次≤100元，月累计≤400元
            2. 充值触发前的身份验证机制
            3. 退款机制：
               - 退款申请渠道
               - 退款审核流程
               - 退款时效承诺

          四、内容分级合规：
            1. 游戏内容的适龄提示制度
            2. 不同年龄段的差异化内容策略
            3. 游戏内社交功能的未成年人保护措施

          五、家长监控工具：
            1. 家长端功能设计：
               - 查看游戏时长
               - 查看充值记录
               - 设置游戏时段限制
            2. 家长与未成年人账号的关联机制

          六、合规审计与持续监测：
            1. 防沉迷系统运行监测
            2. 未成年人保护合规年度自查
            3. 监管检查应对预案

          请输出未成年人保护合规方案 + 防沉迷系统技术合规要求清单 + 退款流程模板 + 合规自查报告框架。

- id: "00000000-0000-0000-0000-000000000d0f"
  name: "代币发行合规分析"
  description: "Token issuance compliance analysis — legal characterization, licensing, AML/KYC, tax across jurisdictions"
  category: "web3_compliance"
  steps:
    - name: "Search token regulations"
      description: "Search for token issuance regulations across jurisdictions"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate compliance analysis"
      description: "Generate token issuance compliance analysis"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请分析在以下法域发行【utility token / governance token / security token】的合规路径：

          代币基本信息：
          - 代币名称：【XXX】
          - 代币用途：【支付网络服务费/治理投票/质押收益/...】
          - 发行规模：【总量10亿枚，公开发行2亿枚】
          - 是否涉及融资：【是/否】
          - 目标投资者：【散户/合格投资者/机构】

          分析法域：【新加坡、中国香港、开曼群岛、美国、欧盟MiCA】

          每个法域需分析：
          1. 代币法律性质认定：
             - 是否构成"证券"（Howey Test / SFC定义 / MAS定义）
             - 是否构成"虚拟资产"（VASP定义）
             - 是否构成"数字代币"（PSA定义）

          2. 合规路径：
             - 需要取得的牌照或注册（MAS PSA牌照 / SFC Type 1 / VASP注册）
             - 可用的豁免/例外（Accredited Investor / Professional Investor / Regulation S / Regulation D）
             - 白皮书披露要求
             - 营销与分销限制

          3. AML/KYC要求：
             - 适用规则（FATF Travel Rule / 本地AML法规）
             - 实施方案

          4. 税务处理：
             - 代币发行的税务影响
             - 代币交易的GST/VAT处理

          5. 后续合规义务：
             - 持续披露要求
             - 投资者保护措施
             - 智能合约审计要求

          请输出多法域对比矩阵，并推荐最优发行架构。

- id: "00000000-0000-0000-0000-000000000d10"
  name: "NFT 平台合规意见书"
  description: "NFT platform legal compliance opinion — legal characterization, IP, consumer protection, AML, platform liability"
  category: "web3_compliance"
  steps:
    - name: "Search NFT regulations"
      description: "Search for NFT and digital collectible regulations"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate legal opinion"
      description: "Generate NFT platform legal compliance opinion"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请起草一份关于NFT数字藏品平台的法律合规意见书框架：

          平台信息：
          - 运营主体：【XX公司，注册地：XX】
          - NFT类型：【数字艺术品 / 游戏道具 / 虚拟地产 / 粉丝通证】
          - 交易模式：【一级发行 / 二级交易 / 盲盒/合成】
          - 支付方式：【法币 / 加密货币 / 平台币】

          意见书结构：
          1. NFT的法律性质认定：
             - 中国法下：虚拟商品 / 数字资产 / 网络虚拟财产（《民法典》第127条）
             - 是否构成证券（证券化NFT的分析）
             - 是否涉及虚拟货币交易（中国禁令的适用边界）

          2. 知识产权：
             - NFT铸造的版权授权链（原创 vs. 二创 vs. 代理）
             - NFT持有者的版权范围（展示权 / 复制权 / 商业使用权）
             - 智能合约中IP许可条款的法律效力

          3. 消费者权益保护：
             - 信息披露义务（NFT的稀缺性、链上验证方法）
             - 退换货政策（数字商品的七天无理由退货适用性）
             - 盲盒/随机性产品的合规要求

          4. 反洗钱合规：
             - 法币入金通道的AML要求
             - NFT交易的反洗钱风险评估
             - 大额交易报告义务

          5. 跨境销售合规：
             - 不同法域对NFT的监管态度
             - 跨境支付的合规路径
             - 数据跨境传输

          6. 平台责任：
             - 平台作为ISP的"避风港"保护
             - 内容审核义务
             - 知识产权侵权通知-删除机制

          请引用最新法律法规和监管政策。

- id: "00000000-0000-0000-0000-000000000d11"
  name: "RWA 多法域合规路径分析"
  description: "RWA multi-jurisdiction compliance path — token characterization, licensing, investor access, secondary market"
  category: "web3_compliance"
  steps:
    - name: "Search RWA regulations"
      description: "Search for RWA and tokenization regulations across jurisdictions"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate compliance path"
      description: "Generate RWA multi-jurisdiction compliance path analysis"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请分析以下RWA项目在目标发行法域的合规路径：

          RWA项目信息：
          - 底层资产：【XX类资产】，所在地：【XX法域】
          - 代币性质：代表【SPV股权 / 信托受益权 / 债权 / 收益分享权】
          - 发行规模：【XX万美元/元】
          - 目标投资者范围：【全球合格投资者 / 仅特定法域投资者】

          分析法域：【中国香港、新加坡、开曼群岛、瑞士、美国、欧盟、中国大陆】

          每个法域需分析：

          1. 代币法律性质认定：
             - 是否构成"证券"（香港SFC定义 / 美国Howey Test / 欧盟MiCA定义 / 新加坡MAS定义）
             - 是否构成"虚拟资产"（香港VASP定义 / MiCA虚拟资产定义）
             - 是否构成"集体投资计划"（CIS）
             - RWA代币的特殊性：是否有底层资产支撑→是否降低"证券"认定风险？

          2. 合规路径选择：
             - 香港：
               * SFC Type 1/9牌照（如构成证券型代币）
               * VASP牌照（如构成虚拟资产）
               * Ensemble沙盒项目的参与路径
               * 专业投资者豁免适用条件
             - 新加坡：
               * MAS PSA下数字代币发行牌照/豁免
               * Project Guardian沙盒参与路径
               * SFA下的资本市场服务牌照
             - 开曼：
               * 开曼基金法下的代币化基金注册
               * SIBL下的证券发行豁免
             - 瑞士：
               * FINMA下的DTA（Digital Token Offering）框架
               * 链上资产登记的法律认可度
             - 美国：
               * Regulation D/S/A+的适用路径分析
               * SEC对RWA的最新立场（是否构成证券的分析）
             - 欧盟：
               * MiCA框架下的RWA合规路径
               * DLT Pilot Regime的试点路径
               * UCITS/ELTIF代币化基金框架
             - 中国大陆：
               * 禁止虚拟货币交易的法律红线（924公告）对RWA的影响
               * 联盟链上的资产数字化（非公链代币化）的合规空间
               * 数字人民币+联盟链RWA的可行性分析

          3. 投资者准入限制：
             - 各法域对散户 vs. 专业/合格投资者的准入规则
             - KYC/AML要求（FATF Travel Rule的适用）
             - 投资者数量上限（如美国12(g)门槛、香港CIS的50人限制等）

          4. 二级市场合规：
             - 代币在各法域二级交易的法律限制
             - 交易所/ATS牌照要求
             - 做市与交易撮合的合规边界

          5. 底层资产跨境合规：
             - 底层资产所在法域对"外国SPV持有"的规则
             - 资产跨境转移的审批/税务问题
             - 数据出境合规（资产信息上链涉及的跨境数据传输）

          请输出多法域合规对比矩阵，标注各法域的"可行性评级"（✅可行 / ⚠️有条件可行 / ❌不可行）和"合规成本估算"，给出最优发行架构组合方案。

- id: "00000000-0000-0000-0000-000000000d12"
  name: "RWA 投资者保护与风险披露"
  description: "RWA investor protection and risk disclosure — risk disclosure document, protection mechanisms"
  category: "web3_compliance"
  steps:
    - name: "Search RWA investor protection frameworks"
      description: "Search for RWA investor protection and disclosure frameworks"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate disclosure framework"
      description: "Generate RWA risk disclosure and investor protection framework"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请起草一份RWA项目的投资者风险披露文件框架，并设计投资者保护机制：

          RWA项目信息：
          - 底层资产：【XX类资产】
          - 代币代表：【SPV股权/信托受益权/债权/收益分享权】
          - 代币化架构：【XX法域SPV + XX链上代币】
          - 二级市场：【有/无】

          一、风险披露文件框架（Risk Disclosure Document）：

          1. 底层资产风险：
             - 资产价值波动风险（不动产贬值/债券违约/艺术品估值不确定等）
             - 资产流动性风险（底层资产本身可能难以快速变现）
             - 资产管理风险（SPV/受托人的管理不善）
             - 资产权属争议风险（底层资产存在优先债权人/产权瑕疵）
             - 资产灭失/毁损风险（自然灾害/意外事故）

          2. 代币化架构风险：
             - SPV/信托的法律风险（设立法域法律变更、破产隔离效力）
             - 链上与链下权利衔接风险（智能合约条款与法律协议的不一致）
             - 代币法律性质不确定性风险（监管认定变更）
             - 代币持有者权利行使风险（权利链条过长、行使程序复杂）
             - 代币持有者间权利不平等风险（不同批次代币的权利差异）

          3. 技术风险：
             - 智能合约漏洞/黑客攻击风险
             - 预言机（Oracle）数据失真风险（底层资产价值上链的准确性）
             - 区块链网络故障/升级风险
             - 密钥丢失/被盗风险（代币持有者端）
             - 链上清算机制的触发条件与执行风险

          4. 市场风险：
             - 代币二级市场流动性不足风险
             - 代币价格与底层资产净值偏离风险
             - 市场操纵风险（低流动性市场更易操纵）
             - 代币赎回/退出的排队与延迟风险

          5. 合规风险：
             - 监管政策变更风险（RWA监管仍在快速演变）
             - 代币被追溯认定为证券的风险
             - 税务处理变更风险
             - 跨境合规冲突风险

          6. 运营风险：
             - 项目方/SPV管理团队风险（团队变动、失职、利益冲突）
             - 服务提供商风险（托管人、审计师、预言机供应商）
             - 信息披露不及时/不完整风险
             - 反洗钱/制裁合规风险

          二、投资者保护机制设计：

          1. 信息披露机制：
             - 定期披露要求（底层资产估值更新频率、NAV计算与公布、财务报表）
             - 重大事项临时披露触发条件
             - 链上可验证的信息披露（预言机+链上证明机制）

          2. 代币持有者治理权：
             - 代币持有者投票机制（底层资产重大处置的审批权）
             - 代币持有者委员会/代表机制
             - 信息权与检查权

          3. 资产保护机制：
             - 破产隔离设计（SPV/信托的破产隔离效力保障）
             - 底层资产独立托管/监管安排
             - 保险覆盖（底层资产保险 + 智能合约保险）

          4. 退出与赎回机制：
             - 代币赎回触发条件与程序
             - 赎回排队机制与公平性保障
             - 二级市场退出的可行性保障
             - 底层资产清算分配机制（项目终止时）

          5. 争议解决机制：
             - 链上仲裁机制（如适用）
             - 链下法律仲裁条款（仲裁机构、仲裁地选择）
             - 投资者集体维权机制

          6. 合规审计与监督：
             - 定期合规审计要求
             - 外部审计师的选聘与轮换
             - 监管报告义务

          请输出完整的风险披露文件模板和投资者保护机制方案。
          引用香港SFC《虚拟资产交易平台指引》、新加坡MAS Project Guardian框架、瑞士FINMA DTA指南、欧盟MiCA等最新RWA监管框架。

- id: "00000000-0000-0000-0000-000000000d13"
  name: "反垄断经营者集中申报"
  description: "Antitrust merger control filing — filing obligation, market definition, competition assessment, materials"
  category: "antitrust"
  steps:
    - name: "Search merger control regulations"
      description: "Search for merger control filing regulations and thresholds"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate filing assessment"
      description: "Generate merger control filing assessment and materials framework"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请评估以下交易是否需要进行反垄断经营者集中申报，并起草申报材料框架：

          交易信息：
          - 交易类型：【合并/股权收购/资产收购/合同控制/VIE】
          - 收购方：【XX公司，中国营业额约XX亿元，全球营业额约XX亿元】
          - 目标公司：【XX公司，中国营业额约XX亿元，全球营业额约XX亿元】
          - 收购比例：【XX%】
          - 是否取得控制权：【是/否】
          - 相关市场：【如：中国乘用车市场/中国在线外卖平台市场】

          分析框架：

          1. 申报义务判断：
             - 是否构成"经营者集中"（合并/取得控制权/施加决定性影响）
             - 是否达到申报标准（营业额测试）
             - 是否属于豁免情形

          2. 相关市场界定：
             - 商品市场界定（替代性分析）
             - 地域市场界定
             - 市场份额估算
             - 市场集中度（HHI指数计算）

          3. 竞争影响评估：
             - 单方效应（合并后是否可能单方面提高价格/降低质量）
             - 协同效应（是否增加与竞争对手协同行为的风险）
             - 进入壁垒评估
             - 买方力量评估

          4. 申报材料清单：
             - 申报书
             - 营业额证明文件
             - 相关市场界定说明
             - 竞争影响分析报告
             - 交易协议
             - 当事人说明

          5. 时间线与策略：
             - 申报时间节点
             - 审查流程预估（初步审查30日/进一步审查90日/延长60日）
             - 是否需要主动提出救济措施
             - 简易程序申请条件评估

          引用《反垄断法》《经营者集中审查规定》《经营者集中申报指南》。
          输出经营者集中申报评估报告 + 申报材料框架。

- id: "00000000-0000-0000-0000-000000000d14"
  name: "供应链ESG尽职调查"
  description: "Supply chain ESG due diligence — scope, tools, core checks, risk grading, remediation, monitoring"
  category: "esg_compliance"
  steps:
    - name: "Search ESG supply chain requirements"
      description: "Search for supply chain ESG due diligence requirements"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate DD plan"
      description: "Generate supply chain ESG due diligence plan"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请设计一份供应链ESG尽职调查方案：

          企业信息：
          - 采购方：【XX公司】
          - 供应链规模：【约XX家一级供应商/XX家二级供应商】
          - 供应商地域分布：【中国XX省/东南亚/非洲/...】
          - 行业：【如：电子制造/服装/食品/矿产】
          - 客户/投资人的ESG要求：【如有，如：某国际品牌要求供应商符合XX标准】

          尽职调查方案：

          1. 尽调范围确定：
             - 一级供应商全覆盖/抽样
             - 二级供应商的尽调触发条件
             - 高风险供应商的筛选标准

          2. 尽调工具：
             - 供应商ESG自评问卷设计（核心问题清单）
             - 现场审计清单
             - 文件核查清单

          3. 核心核查事项：

             环境方面：
             - 环评/排污许可合规
             - 环境处罚记录
             - 碳排放数据
             - 有害物质管理
             - 水资源使用与废水处理

             社会方面：
             - 劳动合同签署率
             - 工时与工资合规
             - 安全生产记录
             - 童工/强迫劳动风险
             - 员工申诉机制
             - 外籍/女工/未成年工特殊保护

             治理方面：
             - 反腐败机制
             - 商业合规制度
             - 信息透明度

          4. 风险分级标准：
             🔴高风险：存在严重ESG违规/可能导致供应链中断/客户品牌受损
             🟡中风险：存在ESG合规缺口但可改进
             🟢低风险：ESG合规基本达标

          5. 供应商整改方案：
             - 整改通知模板
             - 整改期限设定
             - 整改验证机制
             - 不整改的后果（终止合作）

          6. 持续监控机制：
             - 定期审计频率
             - 年度ESG报告要求
             - 突发事件通知机制

          输出供应链ESG尽调方案，含自评问卷模板。

- id: "00000000-0000-0000-0000-000000000d15"
  name: "广告与宣传物料合规审查"
  description: "Advertising and promotional material compliance review — absolute terms, false claims, industry restrictions, pricing"
  category: "advertising_compliance"
  steps:
    - name: "Search advertising regulations"
      description: "Search for Advertising Law and marketing regulations"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate review"
      description: "Generate advertising material compliance review"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请对以下广告/宣传物料进行合规审查：

          物料信息：
          - 物料类型：【广告文案/电商详情页/直播话术脚本/短视频脚本/产品包装/新闻稿/朋友圈推文/招商宣传】
          - 产品/服务类型：【普通消费品/食品/保健食品/化妆品/医疗器械/药品/金融产品/教育培训/房地产/汽车】
          - 投放渠道：【电商平台/社交媒体/线下/电视/户外】
          - 是否使用代言人/KOL：【是/否】

          【粘贴物料文本或上传物料】

          审查清单：

          1. 绝对化用语（《广告法》第9条）：
             - "最/第一/顶级/国家级/独家/唯一"等用语逐一排查
             - 可豁免情形辨析（客观时空顺序表述、自我比较、已获认证的表述）

          2. 虚假与引人误解宣传（《广告法》第4/28条、《反不正当竞争法》第8条）：
             - 功效/性能表述是否有依据支撑
             - 引证内容（数据、统计、调查结果、荣誉）是否标明出处和有效期限
             - 用户评价/案例的真实性

          3. 行业特殊禁区（按产品类型适用）：
             - 食品/保健食品：不得涉及疾病预防治疗功能、"蓝帽子"标识与功能声称范围
             - 化妆品：功效宣称的备案依据（美白/防脱等特殊化妆品）、禁用"医学护肤"等医疗术语
             - 医疗/药品/医疗器械：广告审查批文、适应症表述边界
             - 金融产品：不得承诺保本保收益、收益率展示规范、风险提示义务
             - 教育培训：不得承诺通过率/升学效果、不得利用教师名义推荐
             - 房地产：不得承诺升值回报、学区表述风险、距离表述（不得以时间表示距离）

          4. 价格宣传（《价格法》/《明码标价和禁止价格欺诈规定》）：
             - 划线价/原价的真实性（近期成交价要求）
             - "全网最低"等价格比较的风险
             - 促销规则的明示（满减/定金规则）

          5. 代言与推广合规：
             - 代言人资格（是否使用过该商品、劣迹艺人风险）
             - 不得代言的品类（医疗/药品/保健食品不得用代言人）
             - KOL种草/软文的"广告"标识义务（《互联网广告管理办法》）

          6. 特殊人群与场景：未成年人相关限制、弹窗广告一键关闭要求

          输出：逐条标注 🔴违法（引法条+处罚幅度）/ 🟡风险 / 🟢合规 + 每条给出可直接替换的修改文案。

- id: "00000000-0000-0000-0000-000000000d16"
  name: "反商业贿赂合规专项方案"
  description: "Anti-bribery compliance program — risk identification, policies, third-party management, financial controls"
  category: "compliance_system"
  steps:
    - name: "Search anti-bribery regulations"
      description: "Search for anti-bribery regulations (FCPA, UKBA, Criminal Law, ISO 37001)"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate program"
      description: "Generate anti-bribery compliance program"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请为以下企业设计反商业贿赂合规专项方案：

          企业信息：
          - 企业名称：【XX】
          - 行业：【如：医药/医疗器械/工程建设/政府采购/矿产/金融】
          - 业务模式：【简述核心业务和客户类型】
          - 已有合规措施：【简述，如：仅有员工手册中的零散规定】

          方案框架：

          1. 反贿赂风险识别：
             - 与政府官员/公职人员交往的场景清单
             - 与客户/供应商/渠道商的礼品/招待/赞助场景
             - 第三方中介/代理的使用场景
             - 高风险国家/地区的业务场景

          2. 反贿赂合规制度：
             - 反贿赂合规政策（原则性声明）
             - 礼品与招待管理制度（限额+审批+记录）
             - 政治捐赠管理制度
             - 商业赞助管理制度
             - 招投标合规管理制度

          3. 第三方管理：
             - 第三方尽职调查程序
             - 第三方合规承诺书/协议条款
             - 第三方合规审计权

          4. 财务控制：
             - 费用报销审核机制（关联费用审批增加合规审查节点）
             - 现金支出控制
             - 账簿与记录的准确性要求

          5. 培训与沟通：
             - 全员反贿赂培训（入职+年度）
             - 重点岗位专项培训（销售/采购/政府关系/招投标）
             - 管理层合规承诺声明签署

          6. 监测与审计：
             - 合规审计
             - 举报机制与调查程序
             - 违规处理与纪律处分

          引用FCPA（美国反海外腐败法）、UKBA（英国反贿赂法）、《刑法》第389/393条、ISO 37001（反贿赂管理体系）等。
          输出反贿赂合规专项方案（Word文档）。

- id: "00000000-0000-0000-0000-000000000d17"
  name: "企业刑事合规风险评估"
  description: "Corporate criminal compliance risk assessment — screening key offenses, risk matrix, compliance system"
  category: "criminal_compliance"
  steps:
    - name: "Search criminal law provisions"
      description: "Search for Criminal Law provisions on corporate offenses"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate risk assessment"
      description: "Generate corporate criminal compliance risk assessment report"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请对以下企业进行刑事合规风险评估：

          企业信息：
          - 企业名称：【XX】
          - 行业：【如：金融/P2P/电商/医药/矿产/数据服务】
          - 业务模式：【简述核心业务模式】
          - 已有合规措施：【简述】

          风险评估框架——重点罪名筛查：

          1. 经营类犯罪风险：
             - 非法经营罪（《刑法》第225条）
               * 是否涉及特许经营/许可/资质要求
               * 业务模式是否可能被认定为"非法经营"
             - 非法吸收公众存款罪/集资诈骗罪（《刑法》第176/192条）
               * 是否涉及向公众募集资金
               * 是否有合规的融资渠道

          2. 财税类犯罪风险：
             - 虚开发票罪（《刑法》第205条）
               * 发票管理合规性
               * 是否存在"票货分离"风险
             - 逃税罪（《刑法》第201条）
               * 税务合规评估
               * 初次违法的补缴免罪条款适用

          3. 商业贿赂类犯罪风险：
             - 行贿罪/单位行贿罪（《刑法》第389/393条）
               * 政府关系交往合规
               * 第三方中介合规
             - 非国家工作人员受贿罪（《刑法》第163条）
               * 内部反腐机制

          4. 数据与网络安全犯罪风险：
             - 侵犯公民个人信息罪（《刑法》第253条之一）
               * 个人信息收集与使用的合规性
               * 是否存在"非法获取/出售/提供"个人信息的行为
             - 非法侵入计算机信息系统罪/破坏计算机信息系统罪
             - 拒不履行信息网络安全管理义务罪（《刑法》第286条之一）

          5. 证券类犯罪风险（如适用）：
             - 内幕交易/泄露内幕信息罪
             - 操纵证券市场罪
             - 欺诈发行证券罪

          6. 知识产权犯罪风险（如适用）：
             - 侵犯著作权罪
             - 侵犯商业秘密罪
             - 假冒注册商标罪

          7. 其他行业特定犯罪风险：
             - 【如：金融行业的洗钱罪/违法发放贷款罪；医药行业的生产销售假药罪】

          8. 风险矩阵：
             | 罪名 | 风险等级 | 触发条件 | 预防措施 | 合规建议 |

          9. 刑事合规体系建设建议：
             - 紧急整改事项
             - 中长期合规建设路线图
             - 刑事合规不起诉的申请条件（如已涉嫌犯罪）

          输出企业刑事合规风险评估报告。

- id: "00000000-0000-0000-0000-000000000d18"
  name: "刑事合规不起诉申请"
  description: "Criminal compliance non-prosecution application — eligibility review, remediation plan, application strategy"
  category: "criminal_compliance"
  steps:
    - name: "Search non-prosecution policy"
      description: "Search for criminal compliance non-prosecution pilot policy"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate application"
      description: "Generate non-prosecution feasibility assessment and remediation plan"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请基于以下涉嫌犯罪情况，评估刑事合规不起诉的可行性，并起草合规整改方案：

          涉嫌犯罪信息：
          - 企业名称：【XX】
          - 涉嫌罪名：【如：虚开发票罪/侵犯公民个人信息罪/单位行贿罪/非法经营罪】
          - 案件阶段：【侦查阶段/审查起诉阶段/已起诉】
          - 检察机关态度：【如：已提示可适用合规不起诉】
          - 涉案金额/情节：【简述】

          第一步：合规不起诉适用条件审查：

          1. 适用条件（《刑事诉讼法》第177条 + 最高检合规不起诉试点政策）：
             - 企业是否愿意合规整改
             - 涉嫌犯罪是否属于适用范围（三年以下有期徒刑的轻微犯罪/涉企犯罪）
             - 企业是否具有合规整改的意愿和能力
             - 是否初犯/偶犯
             - 是否已弥补损失/修复社会关系

          2. 不适用情形审查：
             - 涉嫌严重犯罪（可能判处三年以上）
             - 惯犯/累犯
             - 敷衍整改/拒不配合

          第二步：合规整改方案起草：

          1. 停止犯罪行为并弥补损失：
             - 具体措施
             - 已采取的措施

          2. 合规整改方案：
             - 合规组织架构调整
             - 专项合规制度建设（针对涉嫌罪名）
             - 内部控制流程改进
             - 人员处理（对责任人员的纪律处分）
             - 培训计划

          3. 合规有效性保障：
             - 合规考察期（6个月-1年）
             - 第三方合规监管人机制
             - 定期合规报告
             - 整改成果评估标准

          4. 申请材料清单：
             - 合规整改承诺书
             - 合规整改方案
             - 损失弥补证明
             - 企业合规制度

          第三步：申请策略建议：
             - 申请时机
             - 与检察机关的沟通策略
             - 第三方监管人的选择建议

          输出合规不起诉可行性评估 + 合规整改方案。

- id: "00000000-0000-0000-0000-000000000d19"
  name: "行政监管调查应对"
  description: "Administrative regulatory investigation response — legal basis review, strategy, evidence, communication, penalty plan"
  category: "regulatory_response"
  steps:
    - name: "Search administrative investigation rules"
      description: "Search for administrative investigation and penalty procedures"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate response plan"
      description: "Generate administrative regulatory investigation response plan"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请为以下企业制定行政监管调查应对方案：

          调查信息：
          - 调查机关：【如：市场监管局/网信办/银保监/证监/税务稽查/海关/数据安全审查】
          - 调查类型：【日常检查/专项检查/举报调查/立案调查】
          - 调查事由：【如：涉嫌垄断行为/数据安全违规/虚假宣传/违规收集个人信息/证券违规】
          - 调查阶段：【即将到来/正在进行/已收到处罚告知书】
          - 我方角色：【被调查企业/相关方】

          应对方案框架：

          1. 调查法律依据审查：
             - 调查机关是否有法定职权
             - 调查范围是否超出法定授权
             - 调查程序是否合法（通知/出示证件/告知权利等）

          2. 企业应对策略：
             - 配合原则（依法配合vs.合法抗辩）
             - 信息披露范围控制：
               * 哪些信息必须提供
               * 哪些信息可以拒绝提供（商业秘密/法律特权）
               * 提供信息的方式和口径统一
             - 内部信息管控：
               * 统一对外沟通窗口
               * 员工不得私自回应调查人员
               * 文件审查和提交前的法律审核
             - 调查期间的业务持续性安排

          3. 证据准备：
             - 合规证据（已有合规制度/培训记录/审计报告）
             - 自查报告起草（主动自查可能减轻处罚）
             - 整改措施即时启动（减轻处罚的法定因素）

          4. 沟通策略：
             - 与监管机关的沟通策略
             - 沟通口径统一
             - 媒体/公众沟通预案（如调查可能公开）

          5. 行政处罚预案：
             - 可能的处罚类型和幅度
             - 从轻/减轻处罚的争取策略
             - 行政复议/行政诉讼的预备

          6. 配套民事/刑事风险评估：
             - 行政处罚是否可能引发民事赔偿（消费者/投资者）
             - 行政调查是否可能移送刑事

          输出监管调查应对方案。

- id: "00000000-0000-0000-0000-000000000d1a"
  name: "行政复议/诉讼"
  description: "Administrative reconsideration / litigation plan — legality review, reconsideration, litigation strategy"
  category: "regulatory_response"
  steps:
    - name: "Search administrative reconsideration cases"
      description: "Search for similar administrative reconsideration and litigation cases"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate plan"
      description: "Generate administrative reconsideration / litigation plan"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请基于以下行政处罚，起草行政复议/行政诉讼方案：

          处罚信息：
          - 处罚机关：【XX行政机关】
          - 处罚决定：【简述处罚内容和理由】
          - 处罚金额：【XX万元】
          - 处罚日期：【XX】
          - 申请人/原告：【我方当事人】

          法律分析框架：

          1. 处罚合法性审查：
             a. 事实认定：
                - 处罚认定的事实是否准确
                - 证据是否充分
             b. 法律适用：
                - 处罚依据的法规是否正确
                - 法条理解是否准确
                - 是否存在法律适用错误
             c. 程序合法性：
                - 是否履行了告知义务
                - 是否给予了陈述申辩权
                - 是否组织了听证（如应组织）
                - 是否有程序违规

          2. 处罚合理性审查：
             - 处罚幅度是否合理
             - 是否考虑了从轻/减轻因素
             - 是否与类似案件的处罚一致（同等情况同等对待）

          3. 行政复议（首选路径）：
             - 复议机关：【原机关的上一级/本级政府】
             - 申请期限：【60日】
             - 申请书要点
             - 复议理由

          4. 行政诉讼（复议后/直接起诉）：
             - 管辖法院
             - 起诉期限：【6个月】
             - 诉讼请求
             - 举证责任分配（行政机关负主要举证责任）

          5. 策略选择：
             - 复议先行 vs. 直接诉讼
             - 复议+诉讼组合策略

          请使用华宇元典数据库检索同类行政复议/诉讼案例。
          输出行政复议/诉讼方案 + 申请书/起诉状草稿。

- id: "00000000-0000-0000-0000-000000000d1b"
  name: "多法域合规对比——中国/美国/欧盟/东南亚四地框架"
  description: "Cross-border compliance comparison across China/US/EU/SEA — regulatory overview, conflict identification, path decision tree"
  category: "compliance_system"
  steps:
    - name: "Search cross-border regulations"
      description: "Search for regulations across the four jurisdictions"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate comparison"
      description: "Generate multi-jurisdiction compliance comparison and decision matrix"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请对以下合规事项在四个法域（中国/美国/欧盟/东南亚）进行合规路径对比分析，输出决策矩阵：

          合规事项：
          - 合规领域：【如：数据出境/AI产品合规/出口管制/游戏出海/个人信息保护/产品认证/制裁合规】
          - 企业业务描述：【简述核心业务和跨境场景】
          - 涉及法域：【中国/美国/欧盟/【东南亚某国】，可多选】
          - 当前合规状态：【无合规措施/部分合规/需要全面合规建设】

          四法域合规对比分析框架：

          一、各法域法规体系概览：

          | 法域 | 核心法规/政策 | 监管机构 | 管辖范围 | 执法风格 | 罚款上限 |

            1. 中国：
               - 核心法规体系（按合规领域列举）
               - 监管机构（网信办/市场监管局/海关等）
               - "属地管辖+效果管辖"的适用范围
               - 执法特点：事前审批重+事后执法趋严

            2. 欧盟：
               - 核心法规体系（按合规领域列举）
               - 监管机构（各国DSA/EDPB/欧盟委员会等）
               - "设立地+目标指向"管辖
               - 执法特点：框架性立法+各国执行差异

            3. 美国：
               - 核心法规体系（联邦+州级双轨制）
               - 监管机构（FTC/SEC/BIS/OFAC/各州AG等）
               - 管辖范围（效果管辖为主）
               - 执法特点：执法驱动+州级差异大

            4. 东南亚（以【指定国家】为重点）：
               - 核心法规体系
               - 监管机构
               - 数据本地化要求
               - 执法特点：法规尚在完善+执法能力参差

          二、合规冲突识别：

            1. 法域间合规要求冲突清单：
               - 数据本地化 vs. 跨境传输自由
               - 事前审批 vs. 事后自律
               - 严格禁止 vs. 有条件允许
               - 长臂管辖 vs. 反制裁/阻断法
            2. 冲突严重程度分级：
               - 🔴不可调和（必须选择遵守一方，违反另一方）
               - 🟡可通过设计规避（调整架构可同时满足）
               - 🟢无冲突或微调可满足

          三、合规路径选择决策树：
            1. "最高标准"策略——以最严格法域为基准统一合规
            2. "分层合规"策略——各法域独立合规，数据/运营分区管理
            3. "架构隔离"策略——不同法域使用不同法律实体和系统
            4. 各策略的合规成本/运营成本/风险对比

          四、统一合规框架建议：
            - 基于四法域对比的统一合规框架设计
            - 各法域的叠加合规要求
            - 合规日历（各法域年度合规义务时间线）

          请输出多法域合规对比矩阵 + 冲突识别清单 + 合规路径决策树 + 统一合规框架建议。

- id: "00000000-0000-0000-0000-000000000d1c"
  name: "跨境合规冲突解决——决策树与策略选择"
  description: "Cross-border compliance conflict resolution — legal analysis, architecture solutions, strategy selection matrix"
  category: "compliance_system"
  steps:
    - name: "Search blocking statutes"
      description: "Search for blocking statutes and counter-sanctions laws"
      tool: "kb_search"
      parameters:
        top_k: 10

    - name: "Generate solution"
      description: "Generate cross-border compliance conflict resolution solution"
      tool: "generate_docx"
      parameters:
        system_prompt: |
          请为以下跨境合规冲突场景设计解决方案：

          冲突场景：
          - 冲突类型：【如：数据本地化要求 vs. 全球化数据处理 / 美国制裁要求 vs. 中国反制裁法 / 欧盟AI Act要求 vs. 中国AI备案 / 欧盟GDPR删除权 vs. 中国数据留存义务】
          - 涉及法域：【列举】
          - 企业运营模式：【简述全球化架构】
          - 冲突焦点：【简述具体合规要求之间的矛盾】

          解决方案设计框架：

          一、冲突法律分析：
            1. 各法域要求的详细对比：
               | 维度 | 法域A要求 | 法域B要求 | 冲突点 |
            2. 不可调和区域识别：
               - 哪些要求确实无法同时满足
               - 哪些看似冲突但可通过架构设计化解
            3. 阻断法/反制裁法的适用分析：
               - 中国《反外国制裁法》的适用场景
               - 欧盟Blocking Statute的适用场景
               - 阻断法是否提供"合规豁免"

          二、架构解决方案：
            1. 法律实体隔离方案：
               - 不同法域设立独立法律实体
               - 数据/系统/人员的物理/逻辑隔离
               - 成本评估与可行性
            2. 技术解决方案：
               - 数据分区存储（本地化+全球化分区）
               - 访问控制的分区设计
               - 加密/匿名化的中间方案
            3. 合同解决方案：
               - 合同条款的冲突缓冲设计
               - 合同中的法域选择与管辖选择
               - 不可抗力/合规终止权的嵌入

          三、策略选择矩阵：

          | 解决策略 | 合规满足度 | 运营影响 | 成本 | 风险残留 | 推荐场景 |

          四、持续监测机制：
            1. 法规变化监测（各国法规动态追踪）
            2. 合规冲突的定期重新评估
            3. 监管执法案例的跟踪学习

          请输出冲突法律分析 + 架构解决方案 + 策略选择矩阵 + 持续监测机制设计。
