# Pacgate-ai DeerFlow configuration
#
# STANDALONE / image-baked config. The CLIENT stack does not use this file: both
# `compose.prod.yaml` and `compose.bundle.yaml` bind-mount
# `deploy/client-bundle/deer-flow-config.yaml` over `/app/backend/config.yaml`.
# Nothing mounts this one, and no script reads it.
#
# It still matters twice over, so do not leave it as a trap:
#   1. `deploy/deer-flow-pacgate/Dockerfile` bakes it into the published
#      deer-flow image, so any run that starts that image WITHOUT the client
#      mount gets this behaviour.
#   2. deer-flow treats `models[0]` as the default (`agent.py` line 96), and this
#      file used to list three CLOUD models first. Starting the image bare
#      therefore sent every prompt to ollama.com by default - the same defect the
#      client config was fixed for on 2026-09-25. A local model is now first, so
#      the default is on-device and cloud models are explicit choices only.
#
# The client's authoritative config lives in `deploy/client-bundle/`. Edit that
# one for anything client-facing; edit this one only for the standalone image.
#
# To switch the active model, reorder the list so your preferred model is first.
# All models use Ollama (local or cloud-routed).

models:
  # ── LOCAL FIRST: this is the default (models[0]) ──────────────────────────
  - name: nemotron-3.5-lightning-30b-local
    display_name: Nemotron 3.5 Lightning 30B (Local GPU)
    description: LOCAL default. GPU-accelerated, 1M context. Long-context legal reasoning without egress.
    use: langchain_openai:ChatOpenAI
    model: nemotron-3.5-lightning:30b-a3b
    api_key: ollama
    base_url: http://host.docker.internal:11434/v1
    max_tokens: 8192
    temperature: 0.1

  # Pacgate 2026-10-07: qwen3.8 DEMOTED from the picker. Benchmark on the 8060S
  # iGPU (warm, ~3k ctx): dense 27B = 26 t/s gen / 225 t/s ingestion, vs
  # nemotron MOE 81/1080 and ornith MOE 64/1263. Strictly dominated by the MOEs.
  # It remains pre-pulled for the pacgate-api Mid workflow tier.
  # - name: qwen3.8-27b-local
  #   display_name: Qwen 3.8 27B (Local GPU)
  #   description: Dense local model. Slower than the MOEs (26 t/s vs 64-81).
  #   use: langchain_openai:ChatOpenAI
  #   model: qwen3.8:27b-mtp-q4_K_M
  #   api_key: ollama
  #   base_url: http://host.docker.internal:11434/v1
  #   max_tokens: 8192
  #   temperature: 0.1

  # Dedicated memory-update model (referenced by memory.model_name above).
  # Background memory updates run OUTSIDE user-visible runs; a hard 2048 cap
  # means a confused run cannot loop meaningfully. Memory facts are short JSON.
  - name: gemma4-12b-memory
    display_name: Gemma 4 12B (Memory, capped)
    description: Internal model for background memory updates. Hard 2048-token cap.
    use: langchain_openai:ChatOpenAI
    model: gemma4:12b-it-qat
    api_key: ollama
    base_url: http://host.docker.internal:11434/v1
    max_tokens: 2048
    temperature: 0.1

  # ── CLOUD: reachable only by EXPLICIT selection ───────────────────────────
  # These have no weight layers on disk; inference routes to ollama.com. Auth
  # rides the `ollama signin` OAuth session. Selecting one is a deliberate choice;
  # nothing here routes to them by default.
  # Pacgate 2026-10-07 (rev 2): cloud roster = the TWO FLASH models (fast and
  # cheap). deepseek-v4.1-flash replaces the retired v4-flash:0731 tag; the
  # heavier deepseek-v4-pro:cloud was dropped from the picker. The ollama.com
  # account hit its WEEKLY usage limit (account-wide; resets weekly or needs
  # credits at ollama.com/settings) - cloud entries fail until then.
  - name: deepseek-v4.1-flash-cloud
    display_name: DeepSeek V4.1 Flash (Ollama)
    description: Fast legal execution model. Cloud-tagged via Ollama - prompt text leaves the machine.
    use: langchain_openai:ChatOpenAI
    model: deepseek-v4.1-flash:cloud
    api_key: ollama
    base_url: http://host.docker.internal:11434/v1
    max_tokens: 8192
    temperature: 0.1
    supports_thinking: true
    stream_chunk_timeout: 120

  # deepseek-v4-pro:cloud dropped from the picker 2026-10-07 (rev 2, flash-only
  # cloud roster). Re-add a models: entry if a workload needs the heavy tier.

  - name: glm-5.3-flash-cloud
    display_name: GLM 5.3 Flash (Cloud)
    description: Fast cloud model for research and drafting. Cloud-tagged via Ollama.
    use: langchain_openai:ChatOpenAI
    model: glm-5.3-flash:cloud
    api_key: ollama
    base_url: http://host.docker.internal:11434/v1
    max_tokens: 8192
    temperature: 0.1
    supports_thinking: true
    stream_chunk_timeout: 120

  # gemma4:26b-a4b-it-qat was listed here and is deliberately COMMENTED OUT in
  # deploy/client-bundle/ollama-models.txt ("heavier than AIPC NPU budget for
  # Main"), so nothing pre-pulls it and it is absent from the dev box. Keeping it
  # active here made the standalone image request a tag not installed anywhere:
  # HTTP 404, no fallback. Re-enable only together with a prepull entry.
  # - name: gemma4-26b-local
  #   display_name: Gemma 4 26B (Local GPU)
  #   description: Local Gemma model, lighter footprint. Good for drafting.
  #   use: langchain_openai:ChatOpenAI
  #   model: gemma4:26b-a4b-it-qat
  #   api_key: ollama
  #   base_url: http://host.docker.internal:11434/v1
  #   max_tokens: 8192
  #   temperature: 0.1

sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider
  # Pacgate: opt in to host bash for the LocalSandboxProvider (trusted local
  # deployment). Without it the bash tool is hard-gated off.
  allow_host_bash: true

# Pacgate: expose the sandbox file/shell tools to the agent (names must match
# the @tool() names in deerflow/sandbox/tools.py).
tools:
  - name: bash
    group: sandbox
    use: deerflow.sandbox.tools:bash_tool
  - name: ls
    group: sandbox
    use: deerflow.sandbox.tools:ls_tool
  - name: read_file
    group: sandbox
    use: deerflow.sandbox.tools:read_file_tool
  - name: write_file
    group: sandbox
    use: deerflow.sandbox.tools:write_file_tool
  - name: str_replace
    group: sandbox
    use: deerflow.sandbox.tools:str_replace_tool
  - name: glob
    group: sandbox
    use: deerflow.sandbox.tools:glob_tool
  - name: grep
    group: sandbox
    use: deerflow.sandbox.tools:grep_tool

# Pacgate: auto-convert uploaded PDF/DOCX/PPTX/XLSX to Markdown on upload
# (markitdown is preinstalled in the image venv).
uploads:
  auto_convert_documents: true

# Pacgate: DEFER MCP tool loading to cut system-prompt size dramatically.
# MCP tool schemas are NOT bound into context; listed by name and fetched on
# demand via tool_search. Removes ~36K tokens of MCP schema from every prompt.
# Sandbox tools stay always-bound. CRITICAL for local models capped at 64K ctx.
tool_search:
  enabled: true

memory:
  storage_class: pacgate_deerflow_adapter.storage.PacgateMemoryStorage
  # Pacgate 2026-10-07: pin background memory updates to a capped model. The
  # memory updater runs OUTSIDE user-visible runs; without a pin it uses the
  # first config model with no generation cap, and a confused run can loop tens
  # of thousands of tokens on the single Ollama runner slot, stalling every
  # chat. gemma4-12b-memory carries a hard 2048 max_tokens (entry below).
  model_name: gemma4-12b-memory