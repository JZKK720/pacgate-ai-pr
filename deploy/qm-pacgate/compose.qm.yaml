# qm 0.1.20 deployment - the two-service topology.
#
# 2026-11-27: bumped 0.1.19 -> 0.1.20 (upstream dist-tag `next`; `latest` is still
# 0.1.18). 0.1.20 is a FEATURE release, not a patch - 179 files vs 176, with a new
# dist/src/frontmatter module and changed sandbox-layer, docker backend, aws backend
# and cli. The material change is SKILL FRONTMATTER PARSING: the inline hand-rolled
# YAML reader (stripSkillQuotes / skillIndent / a literal-block accumulator) was
# replaced by parseFrontmatter() backed by a new `yaml` dependency, which also adds
# FrontmatterFenceError. We ship 30+ skills under deer-flow-skills, so this release
# is about how OUR skill files are read, not a cosmetic bump.
#
# Digests moved (all three, as in every qm release):
#   core           fd3482d2... -> a64d18cc...
#   sandbox-base   4ddeeb8e... -> 7c5d764f...
# The registry publishes both as tags named `sha256-<hex>`; the bare `sha256:<hex>`
# reference resolves only when the request carries an image-manifest Accept type,
# which is why a naive HEAD without Accept reports a false 404.
#
# Previous bump (2026-11-24) for the record: 0.1.18 -> 0.1.19 was a patch (151 of 153
# dist files identical), removing PI_DETECT_MODEL from the Fly.io env allowlist. That
# key is left in our config: it is inert upstream and removing it would widen the diff.
#
# WHY THIS FILE CHANGED SHAPE (2026-11-23)
#
# 0.1.18 was a re-architecture, not a version bump: the topology collapsed 5 services to 2.
# 0.1.18 was a re-architecture, not a version bump: the topology collapsed 5 services to 2.
# "web-ui", "portal" and "admin" are no longer services - core now serves the public sign-in
# front door, the browser UI and the operator settings at /settings. "auth" survives as the
# in-core sign-in broker. The digests below are the ones the pinned CLI's manifest.json
# publishes; keep them in step with `deploy/qm-pacgate/node_modules/@yc-software/qm/manifest.json`.
#
# THE TWO SOURCE PATCHES ARE GONE. Both existed to fix upstream behaviour that 0.1.18 now
# implements natively:
#   - patch/local-sandbox.ts  -> replaced by QM_CORE_CONTAINER (read by localSandboxEnv since
#     upstream #271/#1675). Removed.
#   - patch/pi-models.ts      -> replaced by a runtime CUSTOM PROVIDER (admin API), which is
#     the supported way to point an OpenAI-compatible id at Ollama. Removed.
# See deploy/qm-pacgate/migration-0.1.18/MIGRATION-SPIKE.md.
#
# MAILPIT IS GONE. Sign-in email is disabled by default in 0.1.18 and `qm admin-login` prints
# a single-use admin link, so the SMTP catcher and its wiring are no longer required.
#
# What is still hand-maintained on purpose: the docker-socket mount and the static docker CLI
# (handbook 7.4). Upstream's local sandbox backend shells the docker CLI from inside core, and
# the Alpine core image ships neither the binary nor the socket. RW socket = host-root
# equivalent; acceptable on the single-firm AIPC deployment model, NOT for shared hosts.
#
# Do NOT run `qm up` against this directory; it would fight this file over the same volumes
# and network. `qm up` is also currently broken on Windows (its which() helper shells
# /bin/sh), which is why this file - not the CLI - is the launcher.

name: qm-pacgate

services:
  core:
    image: ghcr.io/yc-software/qm/core@sha256:a64d18cc72fa8d0f7af295e5e502a62e5ed5a406f2deee59351b4a51f76ac75b
    container_name: qm-pacgate-core
    user: node
    # Docker access for the socket mount: on Docker Desktop the socket is root:root
    # mode 660 and there is no docker gid to join, so access is granted by joining
    # the root group. The node user's other groups are untouched.
    group_add:
      - "0"
    # Password-account hashes are supplied here, NOT in .env: a scrypt hash contains
    # `$` separators, and compose interpolates `$15`/`$8`/`$salt` in an `environment:`
    # value, silently truncating the hash so qm rejects it with the misleading
    # "not produced by the password helper". env_file passes bytes through unexpanded.
    env_file:
      - path: .env.secrets
        required: false
    depends_on:
      - pg
    environment:
      CORE_SIGNING_SECRET: ${CORE_SIGNING_SECRET}
      CAPABILITY_SECRET: ${CAPABILITY_SECRET}
      CONNECTOR_SECRET_KEY: ${CONNECTOR_SECRET_KEY}
      SKILL_SIGNING_SECRET: ${SKILL_SIGNING_SECRET}
      PORTAL_IDENTITY_SECRET: ${PORTAL_IDENTITY_SECRET}
      PORTAL_SESSION_SECRET: ${PORTAL_SESSION_SECRET}
      AUTH_CLIENT_SECRET: ${AUTH_CLIENT_SECRET}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET}
      AUTH_SIGNING_JWK: ${AUTH_SIGNING_JWK}
      AUTH_ALLOWED_EMAILS: ${AUTH_ALLOWED_EMAILS}
      # Optional password accounts (<email>:<scrypt-hash>). 0.1.18 disables sign-in EMAIL
      # by default, and the portal form then says "Email delivery isn't configured" - so
      # without this, staff cannot sign in at all except via an operator-run
      # `qm admin-login`. Generate entries with new-password-user.ps1, which uses qm's own
      # hash helper (a hand-rolled scrypt digest is rejected).
      # Sign-in email is disabled by default; this key is still REQUIRED by config
      # validation even so. AUTH_BRAND_NAME keeps the branded sign-in page.
      AUTH_EMAIL_TRANSPORT: smtp
      AUTH_BRAND_NAME: PacGate
      # EMBEDDED AUTH BROKER. Without these, /auth/login redirects to SLACK's OIDC
      # endpoint with an EMPTY client_id (portal/src/index.ts:169 defaults
      # OIDC_AUTH_ENDPOINT to slack.com when unset) and sign-in cannot proceed.
      # AUTH_EMBEDDED=1 runs the broker INSIDE core on 127.0.0.1:8099 - the separate
      # `auth` container no longer exists in 0.1.18.
      AUTH_EMBEDDED: "1"
      AUTH_BROKER_UPSTREAM: http://127.0.0.1:8099
      AUTH_BROKER_PREFIX: /idp
      AUTH_ISSUER: ${QM_PUBLIC_URL:-http://localhost:8182}/idp
      AUTH_CLIENT_ID: qm-portal
      AUTH_REDIRECT_URI: ${QM_PUBLIC_URL:-http://localhost:8182}/auth/callback
      OIDC_CLIENT_ID: qm-portal
      OIDC_CLIENT_SECRET: ${AUTH_CLIENT_SECRET}
      OIDC_ISSUER: ${QM_PUBLIC_URL:-http://localhost:8182}/idp
      OIDC_AUTH_ENDPOINT: ${QM_PUBLIC_URL:-http://localhost:8182}/idp/authorize
      OIDC_TOKEN_ENDPOINT: http://127.0.0.1:8099/token
      OIDC_USERINFO_ENDPOINT: http://127.0.0.1:8099/userinfo
      OIDC_JWKS_URI: http://127.0.0.1:8099/.well-known/jwks.json
      OIDC_SCOPES: "openid email"
      OIDC_PRINCIPAL_CLAIM: email

      # Model lane. The provider endpoint is OpenAI-compatible; Ollama serves it.
      # MODEL_BASE_URL was renamed OPENAI_BASE_URL in 0.1.18.
      MODEL_PROVIDER: openai
      OPENAI_BASE_URL: http://host.docker.internal:11434/v1
      OPENAI_API_KEY: ${MODEL_API_KEY:-ollama-local}
      # REQUIRED: 0.1.18 refuses a custom provider whose baseUrl is a private address
      # (an SSRF control) and logs "resolves to a private network address" otherwise.
      # Without this every session turn fails with a bare "Connection error."
      PRIVATE_NETWORK_ALLOWED_ORIGINS: http://host.docker.internal:11434
      PI_MODEL: ${PI_MODEL:-minimax-m3.1-flash:cloud}
      PI_DETECT_MODEL: ${PI_DETECT_MODEL:-minimax-m3.1-flash:cloud}
      PI_TITLE_MODEL: ${PI_TITLE_MODEL:-minimax-m3.1-flash:cloud}
      PI_JUDGE_MODEL: ${PI_JUDGE_MODEL:-minimax-m3.1-flash:cloud}
      ADMIN_GRANTS: ${ADMIN_GRANTS}
      ORG_ID: pacgate
      NODE_ENV: development
      PORT: 8080
      # basePort + 2 is core's public front door in 0.1.18 (the portal's old slot).
      PUBLIC_PORT: "8000"
      DATA_DIR: /data
      RUN_STORE: postgres
      SESSION_STORE: postgres
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@pg:5432/qm
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8182}
      PUBLIC_WEB_URL: ${QM_PUBLIC_URL:-http://localhost:8182}
      WEB_UI_PUBLIC_URL: ${QM_PUBLIC_URL:-http://localhost:8182}
      # Sandbox. QM_CORE_CONTAINER replaces patch/local-sandbox.ts: upstream reaches the
      # sandbox by container DNS and attaches core to the sandbox network, instead of
      # dialling 127.0.0.1:<published port> (which inside a container is core itself).
      SANDBOX_BACKEND: local
      QM_CORE_CONTAINER: qm-pacgate-core
      DEPLOYMENT_LAYER: /layer
      # The local backend boots this image for the exec daemon. Machine-local tag,
      # built from deploy/qm-pacgate/sandbox-local/.
      LOCAL_SANDBOX_IMAGE: ${LOCAL_SANDBOX_IMAGE:-qm-pacgate-sandbox-local:latest}
      FLY_SANDBOX_APP_NAME: pacgate-sandboxes
      # nginx routes the metadata API under /pacgate/; sandbox tools follow suit.
      #
      # FROM 0.1.18 THE `sandbox` CONFIG BLOCK IS GONE, so the secrets and URLs the sandbox
      # tools need live here as FLY_RESIDENT_ENV_* variables instead. Do not delete these when
      # tidying the retired block: verify-surviving-components.ps1 asserts every
      # OPENVIKING_*_API_KEY stays wired, and audit-qm-bootstrap.ps1 asserts the host-port
      # coupling to 8089/1933 still exists. Both caught their removal once already.
      FLY_RESIDENT_ENV_PACGATE_API_URL: http://host.docker.internal:8089/pacgate
      FLY_RESIDENT_ENV_PACGATE_API_EMAIL: ${PACGATE_API_EMAIL}
      FLY_RESIDENT_ENV_PACGATE_API_PASSWORD: ${PACGATE_API_PASSWORD}
      FLY_RESIDENT_ENV_OPENVIKING_URL: http://host.docker.internal:1933
      # /mcp authenticates with the ROOT key; the app key returns 401 there.
      FLY_RESIDENT_ENV_OPENVIKING_ROOT_API_KEY: ${OPENVIKING_ROOT_API_KEY}
      FLY_RESIDENT_ENV_OPENVIKING_API_KEY: ${OPENVIKING_API_KEY}
      FLY_RESIDENT_ENV_OPENVIKING_ACCOUNT: ${OPENVIKING_ACCOUNT}
      FLY_RESIDENT_ENV_OPENVIKING_USER: ${OPENVIKING_USER}
      FLY_RESIDENT_ENV_FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY}
    volumes:
      - ./sandbox/skills:/layer/skills:ro
      - ./sandbox/tools:/layer/tools:ro
      # The static docker CLI + the host daemon socket (handbook 7.4). Client binary
      # ONLY - dockerd/runc are deliberately NOT mounted; this container must never
      # run a daemon.
      - ./patch/docker-cli/docker:/usr/local/bin/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - qm-pacgate-coredata:/data
    ports:
      - "${QM_CORE_PORT:-8180}:8080"
      - "${QM_PUBLIC_PORT:-8182}:8000"
    restart: unless-stopped

  pg:
    image: pgvector/pgvector:0.8.1-pg16
    container_name: qm-pacgate-pg
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: qm
    volumes:
      - qm-pacgate-pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  qm-pacgate-coredata:
    name: qm-pacgate-coredata
    external: true
  qm-pacgate-pgdata:
    name: qm-pacgate-pgdata
    external: true

networks:
  default:
    name: qm-pacgate
    external: true



